<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sơ đồ hệ thống Pet Care</title>
<style>
:root{--paper:#f5f5f5;--bone:#fbfbfa;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--line:#eaeaea;--rule:rgba(45,49,66,.12);--rule-solid:#bfc0c0;--accent:#bf4520;--link:#2e5aa8;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;--serif:Cambria,"Times New Roman",serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
h1{font:400 1.55rem/1.1 var(--serif);letter-spacing:-.02em;margin:0 6px 0 0}
h1 em{color:var(--accent);font-style:italic}
.tabs,.seg{display:flex;gap:2px;padding:3px;background:#f1efeb;border-radius:8px}
.tabs button,.seg button{border:0;background:transparent;border-radius:6px;padding:6px 14px;font:inherit;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.tabs button:hover,.seg button:hover{color:var(--ink);background:rgba(255,255,255,.65)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent),0 0 0 1px var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.btn{border:1px solid #e2dfd9;background:#fff;border-radius:6px;padding:6px 11px;font:inherit;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#f7f6f3;border-color:#c9c5bd}
.btn:active{transform:scale(.98)}
.btn.dark{background:#111;border-color:#111;color:#fff;font-weight:600}
.btn.dark:hover{background:#333;border-color:#333}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--link);outline-offset:1px}
.lbl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
select.btn{padding:5px 6px}
.body{flex:1;display:flex;min-height:0}
aside{width:268px;flex:none;border-right:1px solid var(--line);background:var(--bone);padding:16px 14px;overflow:auto}
aside h2{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.chips{display:flex;flex-direction:column;gap:5px}
.chip{--c:#8b8f9c;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px;font:inherit;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--c)}
.chip span{display:flex;align-items:center}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:9px;flex:none}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c);font-weight:600}
.chip small{font:11px var(--mono);color:var(--soft)}
.row{display:flex;gap:6px;margin:0 0 12px}
label{cursor:pointer}
.info{font-size:12.5px}
.info h3{font:600 15px/1.25 var(--sans);margin:0 0 2px}
.info ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:7px}
.info li{--c:#ccc;display:grid;grid-template-columns:42px 1fr;gap:6px;padding:2px 0 2px 9px;border-left:3px solid var(--c)}
.info code{font:11px var(--mono);color:var(--soft)}
.info em{font:11px var(--mono);color:var(--soft);font-style:normal}
.hint{color:var(--soft);font-size:12px;margin:12px 0 0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#wrap{flex:1;position:relative;min-height:0;background-color:var(--paper);background-image:radial-gradient(rgba(45,49,66,.17) 1px,transparent 1.2px);background-size:22px 22px}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.panning{cursor:grabbing}
#stage.move .node{cursor:move}
.badge{position:absolute;left:14px;top:12px;background:#fbf3db;color:#956400;border:1px solid #efe2b0;border-radius:6px;padding:5px 11px;font:12px var(--sans);pointer-events:none}
#legendbox{border-top:1px solid var(--line);background:#fff;padding:6px 14px;overflow-x:auto}
#cap{font-size:12px;color:var(--soft);padding:8px 14px 10px;background:var(--bone);border-top:1px solid var(--line)}
#cap code{font:11px var(--mono);background:#f1efeb;padding:1px 5px;border-radius:3px;color:var(--ink)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (max-width:820px){.body{flex-direction:column}aside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:34vh}.tools{margin-left:0}}
</style>
<style id="dgcss">

  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;--serif:Cambria,"Times New Roman",serif;font-family:var(--sans)}
.dg text{fill:var(--ink);font-family:var(--sans)}
.dg .nm{font-size:12px;font-weight:600}
.dg .nm-i{font-size:12px;font-weight:600;font-style:italic}
.dg .sub{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.dg .typ{font-family:var(--mono);font-size:9px;fill:var(--muted)}
.dg .eye{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;fill:var(--soft)}
.dg .chp{font-family:var(--mono);font-size:8px;font-weight:600;fill:var(--ink)}
.dg .atr{font-family:var(--mono);font-size:10px;fill:var(--ink)}
.dg .atr.st{text-decoration:underline}
.dg .mut{fill:var(--soft)}
.dg .mlt{font-family:var(--mono);font-size:8px;letter-spacing:.04em;fill:var(--muted)}
.dg .ttl{font:400 22px var(--serif);fill:var(--ink)}
.dg .stt{font:11px var(--mono);fill:var(--soft)}
.dg .box{fill:#fff;stroke:var(--ink);stroke-width:1}
.dg .box.ghost{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.35);stroke-dasharray:4 3}
.dg .box.legacy{stroke-dasharray:4 3}
.dg .hd{fill:rgba(45,49,66,.06)}
.dg .hr{stroke:var(--rule-solid);stroke-width:1}
.dg .alt{fill:rgba(45,49,66,.025)}
.dg .tag{fill:none;stroke:var(--soft);stroke-width:.8}
.dg .kchip{stroke-width:.8}
.dg .chip-r{fill:none;stroke:var(--ink);stroke-width:.8}
.dg .chip-f{fill:rgba(46,90,168,.1);stroke:var(--link);stroke-width:.8}
.dg .zone{fill:rgba(45,49,66,.02);stroke:rgba(45,49,66,.22);stroke-width:1;stroke-dasharray:4 4}
.dg .edge path.ln{fill:none;stroke:var(--muted);stroke-width:1}
.dg .edge.comp path.ln{stroke:var(--ink);stroke-width:1.2}
.dg .edge.gen path.ln{stroke:var(--ink)}
.dg .edge line.ln{stroke:var(--muted);stroke-width:1;opacity:.7}
.dg .mask{fill:rgba(255,255,255,.75)}
.dg .fig{fill:#fff;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round}
.dg .fig.abs{stroke-dasharray:3 3}
.dg .ell{fill:#fff;stroke:var(--ink);stroke-width:1}
.dg .ext{fill:rgba(45,49,66,.03);stroke:rgba(45,49,66,.4);stroke-width:1}
.dg .bound{fill:none;stroke:var(--ink);stroke-width:1.2}
.dg .mk-f{fill:var(--ink)} .dg .mk-h{fill:#fff;stroke:var(--ink);stroke-width:1} .dg .mk-o{fill:none;stroke:var(--muted);stroke-width:1}
.dg .mk-d{fill:var(--muted)}
.dg.focus .edge:not(.hl){opacity:.1}
.dg.focus .node:not(.hl){opacity:.3}
.dg .edge.hl path.ln,.dg .edge.hl line.ln{stroke:var(--accent)!important;stroke-width:2!important;opacity:1!important}
.dg .node.pick .box,.dg .node.pick .ell,.dg .node.pick .ext{stroke:var(--accent)!important;stroke-width:1.8}
.dg .node.pick .fig{stroke:var(--accent)!important}
</style>
</head>

/* ---------- bố cục phân tầng (cha bên trái, con bên phải) ---------- */
function layered(ids,links,opt){
  const set=new Set(ids),par=new Map(ids.map(i=>[i,[]])),chi=new Map(ids.map(i=>[i,[]]));
  for(const [p,c] of links)if(p!==c&&set.has(p)&&set.has(c)){chi.get(p).push(c);par.get(c).push(p)}
  const depth=new Map(),vis=new Set();
  const dep=n=>{if(depth.has(n))return depth.get(n);if(vis.has(n))return 0;vis.add(n);let d=0;for(const p of par.get(n))d=Math.max(d,dep(p)+1);vis.delete(n);depth.set(n,d);return d};
  ids.forEach(dep);
  const L=[];ids.forEach(i=>{const d=depth.get(i);(L[d]??=[]).push(i)});
  const idx=new Map();const reidx=()=>L.forEach(l=>l.forEach((n,i)=>idx.set(n,i)));reidx();
  const bary=(n,nb)=>{const a=nb.get(n).filter(x=>idx.has(x));return a.length?a.reduce((s,x)=>s+idx.get(x),0)/a.length:idx.get(n)};
  for(let it=0;it<3;it++){
    for(let d=1;d<L.length;d++){const b=new Map(L[d].map(n=>[n,bary(n,par)]));L[d].sort((a,c)=>b.get(a)-b.get(c));reidx()}
    for(let d=L.length-2;d>=0;d--){const b=new Map(L[d].map(n=>[n,bary(n,chi)]));L[d].sort((a,c)=>b.get(a)-b.get(c));reidx()}
  }
  const pos=new Map();let x=0,W=0,H=0;
  for(const layer of L){
    if(!layer)continue;
    const cols=[[]];let y=0;
    for(const id of layer){const hh=opt.size(id).h;if(y+hh>opt.maxH&&cols.at(-1).length){cols.push([]);y=0}cols.at(-1).push(id);y+=hh+opt.gapY}
    for(const col of cols){let y2=0,cw=0;for(const id of col){const s=opt.size(id);pos.set(id,[x,y2]);y2+=s.h+opt.gapY;cw=Math.max(cw,s.w)}H=Math.max(H,y2-opt.gapY);x+=cw+opt.gapX}
  }
  W=Math.max(0,x-opt.gapX);return{pos,w:W,h:H};
}

function buildRelational(tab){
  const selSet=S.sel[tab];
  const all=selSet.size===DATA.groups.length;
  const src=tab==='db'?DATA.db:DATA.classes;
  const inSel=t=>selSet.has(t.group);
  const own=src.filter(inSel);
  const ownIds=new Set(own.map(t=>t.id||t.name));
  const need=new Set();           // cột được tham chiếu (giữ lại ở chế độ chỉ khóa)
  // cạnh
  let E=[];
  if(tab==='db'){
    for(const t of own)for(const c of t.cols)if(c.fk)E.push({from:t.name,to:c.fk.t,col:c.n,tcol:c.fk.c});
    E.forEach(e=>need.add(e.tcol));
  }else{
    for(const r of DATA.rels)if(ownIds.has(r.from))E.push(r);
  }
  const ghostIds=new Set();
  for(const e of E)if(!ownIds.has(e.to))ghostIds.add(e.to);
  if(all)ghostIds.clear();
  // nút
  const byId=tab==='db'?Object.fromEntries(DATA.db.map(t=>[t.name,t])):Object.fromEntries(DATA.classes.map(c=>[c.id,c]));
  const gcol={};E.forEach(e=>{if(tab==='db'&&!ownIds.has(e.to))(gcol[e.to]??=new Set()).add(e.tcol)});
  const mk=(id,ghost)=>tab==='db'?dbNode(byId[id],ghost?gcol[id]:null,need):classNode(byId[id],ghost);
  for(const t of own)mk(t.id||t.name,false);
  for(const gid of ghostIds)mk(gid,true); // bảng/lớp ngoài phân hệ: nét đứt, bảng chỉ hiện cột được tham chiếu
  // bố cục theo cụm
  const clusters=[];
  const groupsShown=DATA.groups.filter(g=>selSet.has(g.id));
  const linksOf=ids=>{const s=new Set(ids);return E.filter(e=>s.has(e.from)&&s.has(e.to)).map(e=>[e.to,e.from])};
  for(const g of groupsShown){
    const ids=own.filter(t=>t.group===g.id).map(t=>t.id||t.name);
    const L=layered(ids,linksOf(ids),{size:sizeOf,gapX:tab==='db'?130:120,gapY:28,maxH:tab==='db'?1300:1100});
    clusters.push({key:g.id,title:g.title,ids,L});
  }
  const ghostList=[...nodes.values()].filter(n=>n.ghost).map(n=>n.id);
  const PAD=24,HEAD=30;
  let cx=0,cy=0,rowH=0;const GAP=60;
  if(ghostList.length){
    const L=layered(ghostList,[],{size:sizeOf,gapX:40,gapY:20,maxH:1400});
    clusters.unshift({key:'~ghost',title:'Ngoài phân hệ (tham chiếu)',ids:ghostList,L,ghost:true});
  }
  for(const c of clusters){c.w=c.L.w+2*PAD;c.h=c.L.h+2*PAD+HEAD}
  // khổ ngang ~1.7:1; luôn đủ chỗ cho cụm lớn nhất kèm cụm tham chiếu bên trái
  const area=clusters.reduce((a,c)=>a+(c.w+GAP)*(c.h+GAP),0),widest=Math.max(...clusters.filter(c=>!c.ghost).map(c=>c.w),0),gw=ghostList.length?clusters[0].w+GAP:0;
  const MAXW=Math.max(Math.sqrt(area*1.7),widest+gw);
  for(const c of clusters){
    const w=c.w,h=c.h;
    if(cx>0&&cx+w>MAXW){cx=0;cy+=rowH+GAP;rowH=0}
    c.x=cx;c.y=cy;cx+=w+GAP;rowH=Math.max(rowH,h);
    for(const id of c.ids){const [px,py]=c.L.pos.get(id);const n=nodes.get(id);n.x=c.x+PAD+px;n.y=c.y+PAD+HEAD+py;n.cluster=c.key}
  }
  zones=clusters.map(c=>{const z={x:c.x,y:c.y,w:c.w,h:c.h,title:c.title,ghost:c.ghost};
    const gc=GCOL[c.key]||NEUTRAL;
    el('rect',{class:'zone',x:z.x,y:z.y,width:z.w,height:z.h,rx:8,style:`fill:${tint(gc,.055)};stroke:${tint(gc,.5)}`},gZones);
    el('rect',{x:z.x+12,y:z.y+11,width:8,height:8,rx:2,fill:gc},gZones);
    txt(gZones,z.x+26,z.y+19,z.title,'eye',{style:`fill:${dark(gc,.75)};font-weight:600`});return z});
  // tạo cạnh thật
  buildEdges(tab,E,ownIds,all);
}

function buildEdges(tab,E,ownIds,all){

      ed.l0=mlabel(g,e.mFrom);ed.l1=mlabel(g,e.mTo)}

function mlabel(p,s){const g=el('g',null,p);const r=el('rect',{class:'mask',height:11,rx:2},g);const t=txt(g,0,0,s,'mlt');const w=tw(s,`8px ${MONO}`)+6;r.setAttribute('width',w);return{g,r,t,w}}

const STUB=26,MINGAP=44;
function sidesOf(ed){
  if(ed.s0)return[ed.s0,ed.s1];
  const a=ed.a,b=ed.b;
  if(a.x+a.w+MINGAP<=b.x)return['R','L'];
  if(b.x+b.w+MINGAP<=a.x)return['L','R'];
  return['R','R'];
}
function assignPorts(){
  const slots=new Map(); // key node|side → list
  for(const ed of edges){
    if(ed.straight)continue;
    const [s0,s1]=sidesOf(ed);ed.sd=[s0,s1];
    for(const [n,s,end,other] of [[ed.a,s0,0,ed.b],[ed.b,s1,1,ed.a]]){
      const k=n.id+'|'+s;(slots.get(k)??(slots.set(k,[]),slots.get(k))).push({ed,end,n,oy:other.y+other.h/2,row:n.rows?(end?ed.tcol:ed.col):null});
    }
  }
  for(const list of slots.values()){
    const n=list[0].n;
    if(n.rows){
      const byRow=new Map();for(const s of list)(byRow.get(s.row)??(byRow.set(s.row,[]),byRow.get(s.row))).push(s);
      for(const [row,arr] of byRow){arr.sort((p,q)=>p.oy-q.oy);const m=arr.length,step=Math.min(6,16/Math.max(1,m-1));
        arr.forEach((s,i)=>{s.ed['y'+s.end]=n.y+(n.rows[row]??n.h/2)+(i-(m-1)/2)*step})}
    }else{
      list.sort((p,q)=>p.oy-q.oy);const m=list.length,top=n.y+(n.portY!=null?0:10),avail=n.portY!=null?0:n.h-20;
      list.forEach((s,i)=>{s.ed['y'+s.end]=n.portY!=null?n.y+n.portY:top+avail*(i+.5)/m})
    }
  }
}
function rpath(p,r){
  const q=[p[0]];for(let i=1;i<p.length;i++){const l=q.at(-1);if(Math.abs(p[i][0]-l[0])+Math.abs(p[i][1]-l[1])<.01)continue;q.push(p[i])}
  const z=[q[0]];for(let i=1;i<q.length-1;i++){const a=z.at(-1),b=q[i],c=q[i+1];if((a[0]===b[0]&&b[0]===c[0])||(a[1]===b[1]&&b[1]===c[1]))continue;z.push(b)}z.push(q.at(-1));
  let d=`M${z[0][0]},${z[0][1]}`;
  for(let i=1;i<z.length-1;i++){const a=z[i-1],b=z[i],c=z[i+1];
    const l1=Math.hypot(a[0]-b[0],a[1]-b[1]),l2=Math.hypot(c[0]-b[0],c[1]-b[1]),rr=Math.min(r,l1/2,l2/2);
    const p1=[b[0]+(a[0]-b[0])/l1*rr,b[1]+(a[1]-b[1])/l1*rr],p2=[b[0]+(c[0]-b[0])/l2*rr,b[1]+(c[1]-b[1])/l2*rr];
    d+=`L${p1[0]},${p1[1]}Q${b[0]},${b[1]} ${p2[0]},${p2[1]}`}
  return{d:d+`L${z.at(-1)[0]},${z.at(-1)[1]}`,pts:z};
}
let POOL=[];
const hitsRect=(n,x1,y1,x2,y2)=>!(x2<n.x-3||x1>n.x+n.w+3||y2<n.y-3||y1>n.y+n.h+3);
// chọn x của đoạn dọc sao cho đường ít xuyên qua khối không liên quan nhất
function bestMx(ed,x0,x1,y0,y1,s0,s1){
  const lo=Math.min(x0,x1),hi=Math.max(x0,x1),mid=(x0+x1)/2+ed.jit,j=Math.abs(ed.jit);
  let c=[mid,x0+(s0==='R'?1:-1)*(22+j),x1+(s1==='R'?1:-1)*(22+j)];
  const pool=POOL.filter(v=>v>lo+12&&v<hi-12);
  pool.sort((p,q)=>Math.abs(p-mid)-Math.abs(q-mid));
  c=c.concat(pool.slice(0,12)).filter(v=>v>lo+10&&v<hi-10);
  if(!c.length)return mid;
  let bs=1e9,bv=c[0];
  for(const v of c){
    let h=0;
    for(const n of POOL_NODES){if(n===ed.a||n===ed.b)continue;
      if(hitsRect(n,Math.min(x0,v),y0,Math.max(x0,v),y0)||hitsRect(n,Math.min(v,x1),y1,Math.max(v,x1),y1)||hitsRect(n,v,Math.min(y0,y1),v,Math.max(y0,y1)))h++}
    const sc=h*1000+Math.abs(v-mid)*.02;if(sc<bs){bs=sc;bv=v}
  }
  return bv;
}
let POOL_NODES=[];
function routeOne(ed){
  const [s0,s1]=ed.sd,a=ed.a,b=ed.b;
  const x0=s0==='R'?a.x+a.w:a.x,x1=s1==='R'?b.x+b.w:b.x,y0=ed.y0,y1=ed.y1;
  let pts;
  if(ed.custom)pts=ed.custom(ed);
  else if(s0!==s1){const mx=ed.xo??bestMx(ed,x0,x1,y0,y1,s0,s1);pts=[[x0,y0],[mx,y0],[mx,y1],[x1,y1]]}
  else{const xo=ed.xo??(s0==='R'?Math.max(x0,x1)+STUB+Math.abs(ed.jit)/2:Math.min(x0,x1)-STUB-Math.abs(ed.jit)/2);pts=[[x0,y0],[xo,y0],[xo,y1],[x1,y1]]}
  const r=rpath(pts,8);ed.ln.setAttribute('d',r.d);ed.pts=r.pts;
  if(ed.l0){ // bội số quan hệ
    const put=(l,pt,dir,off)=>{const x=pt[0]+dir*off,y=pt[1]-7;l.t.setAttribute('x',dir>0?x:x);l.t.setAttribute('y',y);l.t.setAttribute('text-anchor',dir>0?'start':'end');
      l.r.setAttribute('x',dir>0?x-3:x-l.w+3);l.r.setAttribute('y',y-8.5)};
    put(ed.l0,[x0,y0],s0==='R'?1:-1,8);put(ed.l1,[x1,y1],s1==='R'?1:-1,ed.e.comp?20:16);
  }
}
function routeAll(){
  assignPorts();
  POOL_NODES=[...nodes.values()].filter(n=>!n.ell&&!n.act);
  POOL=[...new Set(POOL_NODES.flatMap(n=>[Math.round(n.x-16),Math.round(n.x+n.w+16)]))];
  for(const ed of edges){if(ed.straight)continue;routeOne(ed)}
  for(const ed of edges)if(ed.straight)ed.straight(ed);
}

function expand(a){const s=new Set();for(const t of a.split(',')){const r=/^A(\d\d)-A(\d\d)$/.exec(t);if(r)for(let i=+r[1];i<=+r[2];i++)s.add('A'+String(i).padStart(2,'0'));else s.add(t)}return s}
function wrapLines(s,font,max){const w=s.split(' ');const out=[''];for(const x of w){const t=out.at(-1)?out.at(-1)+' '+x:x;if(tw(t,font)<=max||!out.at(-1))out[out.length-1]=t;else out.push(x)}return out}
function buildUC(){
  const U=DATA.uc,P=U.pos,GR=P.grid,TR=P.tr;
  const RX=GR.rx,RY=GR.ry,BX=P.bound.x,BY=P.bound.y,BW=P.bound.w,BH=P.bound.h;
  // ranh giới hệ thống
  const bz=el('g',null,gZones);el('rect',{class:'bound',x:BX,y:BY,width:BW,height:BH,rx:8,style:'fill:rgba(255,255,255,.6)'},bz);txt(bz,BX+14,BY+22,'Hệ thống Pet Care','nm');txt(bz,BX+14,BY+36,`${U.modules.length} phân hệ · ${U.cases.length} use case hiệu lực`,'sub');
  zones.push({x:BX,y:BY,w:BW,h:BH});
  const ucBy={};U.cases.forEach(c=>(ucBy[c.m]??=[]).push(c));
  // nút phân hệ
  for(const m of U.modules){
    const [cx,cy]=P.mod[m.id];
    const n=mkNode('M:'+m.id,cx-RX,cy-RY,RX*2,RY*2,{mod:m,ell:true});
    el('title',null,n.g).textContent=`${m.title}: ${ucBy[m.id].map(u=>u.c).join(', ')}`;
    const ac=AREA[MAREA[m.id]][0];
    el('ellipse',{class:'ell',cx:RX,cy:RY,rx:RX,ry:RY,style:`fill:${tint(ac,.11)};stroke:${dark(ac,.9)}`},n.g);
    const lines=wrapLines(m.title,F.nm,RX*2-34).slice(0,2);const y0=RY-(lines.length-1)*7-4;
    lines.forEach((s,i)=>txt(n.g,RX,y0+i*15,s,'nm',{'text-anchor':'middle'}));
    txt(n.g,RX,y0+lines.length*15+3,`${m.id} · ${ucBy[m.id].length} UC`,'sub',{'text-anchor':'middle',style:`fill:${dark(ac,.7)}`});
    place(n);
  }
  // tác nhân
  for(const a of U.actors){
    const [cx,cy]=P.act[a.id];
    if(a.ext){
      const w=Math.ceil(Math.max(tw(a.name,F.nm),tw(a.sub,F.sub),tw('«hệ thống ngoài»',F.eye))/4)*4+28,h=56;
      const n=mkNode('A:'+a.id,cx-w/2,cy-h/2,w,h,{act:a,portY:h/2,ext:true});
      el('rect',{class:'ext',width:w,height:h,rx:6},n.g);
      txt(n.g,w/2,16,'«hệ thống ngoài»','eye',{'text-anchor':'middle'});txt(n.g,w/2,33,a.name,'nm',{'text-anchor':'middle'});txt(n.g,w/2,46,a.sub,'sub',{'text-anchor':'middle'});
    }else{
      const w=Math.ceil(Math.max(tw(a.name,F.nm),tw(a.sub,F.sub),44)/4)*4+16,h=96;
      const n=mkNode('A:'+a.id,cx-w/2,cy-30,w,h,{act:a,portY:30,fig:true});
      const m=w/2,c='fig'+(a.abstract?' abs':''),ac=ACOL[a.id],fs=`stroke:${ac}`;
      el('circle',{class:c,cx:m,cy:9,r:8,style:`${fs};fill:${tint(ac,.14)}`},n.g);el('path',{class:c,d:`M${m},17V40M${m-14},26H${m+14}M${m},40L${m-11},56M${m},40L${m+11},56`,fill:'none',style:fs},n.g);
      txt(n.g,m,72,a.name,a.abstract?'nm-i':'nm',{'text-anchor':'middle'});txt(n.g,m,85,(a.code?a.code+' · ':'')+a.sub,'sub',{'text-anchor':'middle',style:`fill:${dark(ac,.8)}`});
      el('rect',{x:0,y:0,width:w,height:h,fill:'transparent'},n.g);
    }
    place(nodes.get('A:'+a.id));
  }
  // liên kết association (đường thẳng, theo quy ước UML)
  const gen=(from,to,s0,s1,xo)=>{const a=nodes.get('A:'+from),b=nodes.get('A:'+to);const g=el('g',{class:'edge gen'},gEdges);const ln=el('path',{class:'ln','marker-end':'url(#m-tri)'},g);edges.push({a,b,g,ln,s0,s1,sd:[s0,s1],jit:0,xo,e:{}})};
  for(const [m,a] of U.links){
    const an=nodes.get('A:'+a),mn=nodes.get('M:'+m);
    const g=el('g',{class:'edge'},gEdges);const ln=el('line',{class:'ln',style:`stroke:${ACOL[a]};opacity:.8;stroke-width:1.2`},g);
    const ed={a:an,b:mn,g,ln,e:{},straight(ed){
      const A=ed.a,M=ed.b;const ax=A.x+A.w/2,ay=A.y+(A.portY??A.h/2),mx=M.x+RX,my=M.y+RY;
      const dx=mx-ax,dy=my-ay,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
      let sx,sy;
      if(A.ext){const hw=A.w/2,hh=A.h/2;const t=Math.min(hw/Math.abs(ux||1e-9),hh/Math.abs(uy||1e-9));sx=ax+ux*t;sy=ay+uy*t}
      else{sx=ax+ux*24;sy=ay+uy*24}
      const k=1/Math.sqrt((ux/RX)**2+(uy/RY)**2);const ex=mx-ux*k,ey=my-uy*k;
      ed.ln.setAttribute('x1',sx);ed.ln.setAttribute('y1',sy);ed.ln.setAttribute('x2',ex);ed.ln.setAttribute('y2',ey)}};
    edges.push(ed);
  }
  for(const s of['A05','A06','A07','A08'])gen(s,'STAFF','R','L',TR.staff);
  for(const s of['A03','A04','STAFF'])gen(s,'USER','R','R',TR.user);
  gen('A02','USER','L','L',TR.l2);gen('A02','A01','L','L',TR.l1);
  routeAll();
}
function ucsOfActor(id){
  const stf=new Set(DATA.uc.links.filter(l=>l[1]==='STAFF').map(l=>l[0]));
  const out=[];for(const c of DATA.uc.cases){const s=expand(c.a);
    const hit=id==='USER'?['A02','A03','A04','A05','A06','A07','A08'].every(x=>s.has(x)):id==='STAFF'?(stf.has(c.m)&&['A05','A06','A07','A08'].some(x=>s.has(x))):(s.has(id)||(id==='A02'&&s.has('A01')));
    if(hit)out.push(c)}
  return out;
}
function onPick(n){
  if(S.tab!=='uc')return;
  const box=$('#ucinfo');if(!box)return;
  if(!n||!S.pick){box.innerHTML='<p class="hint">Nhấp một tác nhân hoặc một phân hệ để xem use case chi tiết. Rê chuột lên một khối để tô sáng các đường nối của nó.</p>';return}
  const li=c=>`<li style="--c:${AREA[MAREA[c.m]][0]}"><code>${c.c}</code><span>${c.n}<br><em>${c.a.replace(/-/g,'–').replace(/,/g,', ')}</em></span></li>`;
  if(n.mod){const cs=DATA.uc.cases.filter(c=>c.m===n.mod.id);box.innerHTML=`<div class="info"><h3>${n.mod.title}</h3><em>${n.mod.id} · ${cs.length} use case</em><ul>${cs.map(li).join('')}</ul></div>`}
  else if(n.act){const cs=ucsOfActor(n.act.id);box.innerHTML=`<div class="info"><h3>${n.act.name}</h3><em>${n.act.code?n.act.code+' · ':''}${n.act.sub} · ${cs.length} use case${n.act.id==='A02'?' (gồm mọi UC của A01 do kế thừa)':''}</em><ul>${cs.map(li).join('')}</ul></div>`}
}

// SVG mở ngoài trình duyệt (Word, Inkscape, bộ chuyển đổi) không đọc được var(--x): thay bằng giá trị cố định
function inlineVars(xml){
  const m=/\.dg\{([^}]*)\}/.exec($('#dgcss').textContent),tok={};
  m[1].split(';').forEach(d=>{const i=d.indexOf(':');if(i>0&&d.trim().startsWith('--'))tok[d.slice(0,i).trim()]=d.slice(i+1).trim()});
  let out=xml;for(let k=0;k<3;k++)out=out.replace(/var\((--[\w-]+)\)/g,(_,n)=>tok[n]??'currentColor');
  return out;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function fname(ext){const v=S.tab==='uc'?'usecase':S.tab==='class'?'lop-thuc-the':'db-schema';const s=S.tab==='uc'?'':'-'+(S.sel[S.tab].size===DATA.groups.length?'tat-ca':[...S.sel[S.tab]].join('+'));return `petcare-${v}${s}.${ext}`}
async function doExport(kind){
  try{
    const{svg,W,H}=buildExport();
    const xml=inlineVars('<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(svg));
    if(kind==='svg'){download(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),fname('svg'));toast(`Đã tải SVG (${W}×${H})`);return}
    let sc=+$('#scale').value;sc=Math.min(sc,16000/W,16000/H,Math.sqrt(120e6/(W*H)));
    const img=new Image();const url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('Không dựng được ảnh từ SVG'));img.src=url});
    const cv=document.createElement('canvas');cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
    const c=cv.getContext('2d');c.fillStyle='#f5f5f5';c.fillRect(0,0,cv.width,cv.height);c.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    const mime=kind==='png'?'image/png':'image/jpeg';
    const blob=await new Promise(r=>cv.toBlob(r,mime,.93));
    if(!blob)throw new Error('Ảnh quá lớn, hãy giảm độ phân giải hoặc chọn bớt phân hệ');
    download(blob,fname(kind));toast(`Đã tải ${kind.toUpperCase()} ${cv.width}×${cv.height}px${sc<+$('#scale').value?' (đã giảm độ phân giải để vừa giới hạn trình duyệt)':''}`);
  }catch(e){toast('Lỗi xuất ảnh: '+e.message)}
}
$$('[data-exp]').forEach(b=>b.onclick=()=>doExport(b.dataset.exp));

/* khởi động */
window.__pc={S,get nodes(){return nodes},get edges(){return edges},setTab,rebuild,exportSvg:buildExport};
setTab(store.get('pcd:tab')||'uc');
</script>
