<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UC · Workforce Management · Pet Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand"><h1>🎯 Use Cases</h1><p class="subtitle">Workforce Management</p></div>
    <nav class="sidebar-nav">
      <div class="nav-group open">
        <div class="nav-group-header">📁 Workforce</div>
        <div class="nav-group-content">
          <div class="menu-item" onclick="switchDiagram('schedule')"><span class="badge">UC15a</span><span>Schedule Management</span></div>
          <div class="menu-item" onclick="switchDiagram('absence')"><span class="badge">UC15b</span><span>Staff Absence</span></div>
        </div>
      </div>
      <div class="nav-group">
        <div class="nav-group-header">📁 Navigation</div>
        <div class="nav-group-content">
          <div class="menu-item" onclick="location.href='uc-store.html'"><span class="badge">UC13</span><span>Store</span></div>
          <div class="menu-item" onclick="location.href='../index.html'"><span class="badge">↑</span><span>All</span></div>
        </div>
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-bar">
      <div class="top-left">
        <div class="breadcrumb"><a href="../index.html">Diagrams</a><span>/</span><span>Use Cases</span><span>/</span><span>Workforce</span></div>
        <h1 class="top-title" id="top-title">Schedule Management</h1>
      </div>
      <div class="controls">
        <button class="control-btn" onclick="zoomIn()">🔍+</button>
        <button class="control-btn" onclick="zoomOut()">🔍-</button>
        <button class="control-btn" onclick="resetZoom()">Reset</button>
      </div>
    </div>
    <div class="canvas-wrapper">
      <div id="viewport"><div id="canvas-content"><svg id="main-svg" width="100%" height="100%" viewBox="0 0 1200 800"></svg></div></div>
      <div class="zoom-indicator" id="zoom-indicator">100%</div>
    </div>
    <div class="footer" id="footer-desc"><strong>Domain Note:</strong> Workforce Management</div>
  </main>

  <script src="../shared/renderer.js"></script>
  <script>
    const DIAGRAMS = {
      'schedule': {
        description: 'UC15a · Schedule Management: Assign, View, Modify schedules',
        actors: [
          { name: "Store Manager", color: "#7b4ac7" },
          { name: "Staff", color: "#eb6c36" },
          { name: "Scheduling Service", system: true, color: "#4f5d75" }
        ],
        useCases: [
          { id: "UC15a-1", name: "Create Work Schedule", focal: true },
          { id: "UC15a-2", name: "Assign Staff to Shift" },
          { id: "UC15a-3", name: "View Schedule" },
          { id: "UC15a-4", name: "Request Shift Change" },
          { id: "UC15a-5", name: "Approve Shift Change" }
        ],
        relations: [
          { actor: "Store Manager", uc: "UC15a-1" },
          { actor: "Store Manager", uc: "UC15a-2" },
          { actor: "Staff", uc: "UC15a-3" },
          { actor: "Staff", uc: "UC15a-4" },
          { actor: "Store Manager", uc: "UC15a-5" }
        ]
      },
      'absence': {
        description: 'UC15b · Staff Absence: Report → Approve → Replace → Recalculate',
        actors: [
          { name: "Staff", color: "#eb6c36" },
          { name: "Store Manager", color: "#7b4ac7" },
          { name: "Scheduling Service", system: true, color: "#4f5d75" }
        ],
        useCases: [
          { id: "UC15b-1", name: "Report Absence", focal: true },
          { id: "UC15b-2", name: "Approve Absence" },
          { id: "UC15b-3", name: "Find Shift Replacement" },
          { id: "UC15b-4", name: "Recalculate Schedule" },
          { id: "UC15b-5", name: "Notify Affected Staff" }
        ],
        relations: [
          { actor: "Staff", uc: "UC15b-1" },
          { actor: "Store Manager", uc: "UC15b-2" },
          { actor: "Scheduling Service", uc: "UC15b-3", type: "include" },
          { actor: "Scheduling Service", uc: "UC15b-4", type: "include" },
          { actor: "Scheduling Service", uc: "UC15b-5", type: "include" }
        ]
      }
    };

    let currentDiagram = 'schedule';
    let zoomLevel = 1.0;

    function switchDiagram(key) {
      currentDiagram = key;
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      event.target.closest('.menu-item').classList.add('active');
      document.getElementById('top-title').textContent = DIAGRAMS[key].useCases[0].name;
      document.getElementById('footer-desc').innerHTML = `<strong>Domain Note:</strong> ${DIAGRAMS[key].description}`;
      renderCurrentDiagram();
    }

    function renderCurrentDiagram() {
      const svg = document.getElementById('main-svg');
      svg.innerHTML = `<defs>
        <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f5d75"/></marker>
        <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e5aa8"/></marker>
      </defs>`;
      DIAGRAMS[currentDiagram]._type = 'usecase';
      renderUseCase(svg, DIAGRAMS[currentDiagram]);
    }

    function zoomIn() { zoomLevel = Math.min(2.0, zoomLevel + 0.1); applyZoom(); }
    function zoomOut() { zoomLevel = Math.max(0.5, zoomLevel - 0.1); applyZoom(); }
    function resetZoom() { zoomLevel = 1.0; applyZoom(); }
    function applyZoom() {
      document.getElementById('canvas-content').style.transform = `scale(${zoomLevel})`;
      document.getElementById('zoom-indicator').textContent = Math.round(zoomLevel * 100) + '%';
    }

    renderCurrentDiagram();
  </script>
</body>
</html>
