  "/public/product-categories":
    get:
      tags: [Public]
      summary: "Danh mục sản phẩm công khai"
      description: "UC16 · BR-CK-01. Actor: A01, A02. Quyền: Public. Chuyển trạng thái: —."
      operationId: listPublicProductCategories
