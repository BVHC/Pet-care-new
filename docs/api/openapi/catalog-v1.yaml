  "/public/products":
    get:
      tags: [Public]
      summary: "Xem & tìm sản phẩm"
      description: "UC16 · BR-CK-01, 02, 03, BR-SP-01. Actor: A01, A02. Quyền: Public. Chuyển trạng thái: —."
      operationId: listPublicProducts
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
