  - name: Services
    description: "Dịch vụ và loại chuồng (UC30)"
  - name: Vaccines
    description: "Loại vaccine và phác đồ (UC31)"
  - name: Public
    description: "Dịch vụ, sản phẩm cho khách xem (UC15, UC16)"
