components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VaccineTypeId:
      name: vaccineTypeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProtocolId:
      name: protocolId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Species:
      type: string
      enum: [DOG, CAT, OTHER]
    ServiceGroup:
      type: string
      enum: [MEDICAL, GROOMING, BOARDING]
      description: "Khám/Tiêm, Thẩm mỹ, Lưu trú (05 §0)"
    MedicalType:
      type: string
      enum: [EXAM, VACCINE]
      description: "Chỉ nhóm MEDICAL (BR-SP-06)"
    ProductType:
      type: string
      enum: [GOODS, DRUG, VACCINE]
    ProductCategory:
      type: object
      required: [categoryId, name, isActive]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        isActive:
          type: boolean
    ProductCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
    UpdateProductCategoryRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 100
        isActive:
          type: [boolean, "null"]
    Product:
      type: object
      required: [productId, categoryId, sku, name, productType, isPrescription, tracksExpiry, unit, price, isActive]
      properties:
        productId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        productType:
          $ref: "#/components/schemas/ProductType"
        isPrescription:
          type: boolean
        tracksExpiry:
          type: boolean
        vaccineTypeId:
          type: [integer, "null"]
          format: int64
        unit:
          type: string
          maxLength: 20
        price:
          type: integer
          format: int64
          minimum: 0
          description: VND
        description:
          type: [string, "null"]
        imageUrl:
          type: [string, "null"]
          maxLength: 500
        isActive:
          type: boolean
    CreateProductRequest:
      type: object
      required: [categoryId, sku, name, productType, isPrescription, tracksExpiry, unit, price]
      properties:
        categoryId:
          type: integer
          format: int64
        sku:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        productType:
          $ref: "#/components/schemas/ProductType"
        isPrescription:
          type: boolean
          description: "Chỉ DRUG (BR-SP-01)"
        tracksExpiry:
          type: boolean
          description: "Bắt buộc true với thuốc kê đơn và vaccine (BR-SP-05)"
        vaccineTypeId:
          type: [integer, "null"]
          format: int64
          description: "Bắt buộc với VACCINE (BR-SP-07)"
        unit:
          type: string
          maxLength: 20
        price:
          type: integer
          format: int64
          minimum: 0
          description: VND
        description:
          type: [string, "null"]
        imageUrl:
          type: [string, "null"]
          maxLength: 500
    UpdateProductRequest:
      type: object
      properties:
        categoryId:
          type: [integer, "null"]
          format: int64
        name:
          type: [string, "null"]
          maxLength: 200
        isPrescription:
          type: [boolean, "null"]
        tracksExpiry:
          type: [boolean, "null"]
        vaccineTypeId:
          type: [integer, "null"]
          format: int64
        unit:
          type: [string, "null"]
          maxLength: 20
        price:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: VND
        description:
          type: [string, "null"]
        imageUrl:
          type: [string, "null"]
          maxLength: 500
        isActive:
          type: [boolean, "null"]
          description: "false = ngừng kinh doanh (A2)"
    KennelTypeSpec:
      type: object
      description: "Chỉ với dịch vụ nhóm BOARDING (BR-SP-04)"
      required: [species, maxWeightKg]
      properties:
        species:
          $ref: "#/components/schemas/Species"
        maxWeightKg:
          type: number
          description: "> 0"
    Service:
      type: object
      required: [serviceId, name, group, price, priceIsFrom, isActive]
      properties:
        serviceId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 150
        group:
          $ref: "#/components/schemas/ServiceGroup"
        medicalType:
          $ref: "#/components/schemas/MedicalType"
        price:
          type: integer
          format: int64
          minimum: 0
          description: "Với BOARDING là giá theo đêm"
        priceIsFrom:
          type: boolean
          description: "Hiển thị \"Từ X đ\" (BR-CK-02)"
        description:
          type: [string, "null"]
        isActive:
          type: boolean
        kennelType:
          $ref: "#/components/schemas/KennelTypeSpec"
    CreateServiceRequest:
      type: object
      required: [name, group, price]
      properties:
        name:
          type: string
          maxLength: 150
        group:
          $ref: "#/components/schemas/ServiceGroup"
        medicalType:
          $ref: "#/components/schemas/MedicalType"
        price:
          type: integer
          format: int64
          minimum: 0
          description: "> 0 với BOARDING (BR-SP-04)"
        priceIsFrom:
          type: [boolean, "null"]
        description:
          type: [string, "null"]
        kennelType:
          $ref: "#/components/schemas/KennelTypeSpec"
    UpdateServiceRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 150
        medicalType:
          $ref: "#/components/schemas/MedicalType"
        price:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: VND
        priceIsFrom:
          type: [boolean, "null"]
        description:
          type: [string, "null"]
        isActive:
          type: [boolean, "null"]
          description: "false = ngừng (A2)"
        kennelType:
          $ref: "#/components/schemas/KennelTypeSpec"
    VaccineType:
      type: object
      required: [vaccineTypeId, name, species, isActive]
      properties:
        vaccineTypeId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        species:
          $ref: "#/components/schemas/Species"
        isActive:
          type: boolean
    VaccineTypeRequest:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
          maxLength: 100
        species:
          $ref: "#/components/schemas/Species"
    UpdateVaccineTypeRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 100
        isActive:
          type: [boolean, "null"]
    VaccinationProtocol:
      type: object
      required: [protocolId, species, vaccineTypeId, doseNumber, intervalDays, minAgeWeeks, requiredForBoarding, isActive]
      properties:
        protocolId:
          type: integer
          format: int64
        species:
          $ref: "#/components/schemas/Species"
        vaccineTypeId:
          type: integer
          format: int64
        doseNumber:
          type: integer
          format: int32
        intervalDays:
          type: integer
          format: int32
          description: "Khoảng cách tới mũi kế (ngày)"
        minAgeWeeks:
          type: integer
          format: int32
        requiredForBoarding:
          type: boolean
        isActive:
          type: boolean
    CreateProtocolRequest:
      type: object
      required: [species, vaccineTypeId, doseNumber, intervalDays, minAgeWeeks, requiredForBoarding]
      properties:
        species:
          $ref: "#/components/schemas/Species"
        vaccineTypeId:
          type: integer
          format: int64
        doseNumber:
          type: integer
          format: int32
          description: "≥ 1"
        intervalDays:
          type: integer
          format: int32
          description: "> 0 (BR-SP-02)"
        minAgeWeeks:
          type: integer
          format: int32
          description: "≥ 0"
        requiredForBoarding:
          type: boolean
    UpdateProtocolRequest:
      type: object
      description: "Chỉ áp dụng cho mũi tiêm sau thời điểm sửa (BR-SP-03)"
      properties:
        intervalDays:
          type: [integer, "null"]
          format: int32
        minAgeWeeks:
          type: [integer, "null"]
          format: int32
        requiredForBoarding:
          type: [boolean, "null"]
        isActive:
          type: [boolean, "null"]
    PublicService:
      type: object
      required: [serviceId, name, group, price, priceIsFrom, branchIds]
      properties:
        serviceId:
          type: integer
          format: int64
        name:
          type: string
        group:
          $ref: "#/components/schemas/ServiceGroup"
        price:
          type: integer
          format: int64
          minimum: 0
          description: VND
        priceIsFrom:
          type: boolean
        description:
          type: [string, "null"]
        kennelType:
          $ref: "#/components/schemas/KennelTypeSpec"
        branchIds:
          type: array
          items:
            type: integer
            format: int64
          description: "Chi nhánh ACTIVE đang bật dịch vụ (BR-CK-01)"
    PublicProduct:
      type: object
      required: [productId, name, categoryId, categoryName, price, unit, inStockBranchIds]
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        categoryId:
          type: integer
          format: int64
        categoryName:
          type: string
        price:
          type: integer
          format: int64
          minimum: 0
          description: VND
        unit:
          type: string
        description:
          type: [string, "null"]
        imageUrl:
          type: [string, "null"]
          maxLength: 500
        inStockBranchIds:
          type: array
          items:
            type: integer
            format: int64
          description: "Chi nhánh có tồn khả dụng > 0, không kèm số lượng (BR-CK-03)"
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
