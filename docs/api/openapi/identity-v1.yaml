        - $ref: "#/components/parameters/TemplateCode"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationTemplate"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/audit-logs":
    get:
      tags: [Audit]
      summary: "Xem nhật ký audit"
      description: "UC11 · BR-QT-15, 16. Actor: A03. Quyền: Chỉ ADMIN. Chuyển trạng thái: —. Chỉ đọc; không có endpoint sửa / xóa (BR-QT-16)."
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: actorAccountId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: entityType
          in: query
          required: false
          schema:
            type: string
        - name: entityId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/AuditLogEntry"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/public/vets":
    get:
      tags: [Public]
      summary: "Đội ngũ bác sĩ"
      description: "UC15 · BR-TK-20, BR-CK-01. Actor: A01, A02. Quyền: Public. Chuyển trạng thái: —. Chỉ VET ACTIVE, không khóa."
      operationId: listPublicVets
      security: []
      parameters:
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicVet"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: "accountId của nhân viên"
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ConfigKey:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: "Ví dụ otp.ttl_minutes"
    TemplateCode:
      name: code
      in: path
      required: true
      schema:
        type: string
      description: "Ví dụ VACCINE_REMINDER"
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Role:
      type: string
      enum: [CUSTOMER, ADMIN, SUPER_MANAGER, BRANCH_MANAGER, RECEPTIONIST, VET, CARETAKER]
      description: "Role cố định (04 §1)"
    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, DISABLED]
      description: "03 #1; khóa là cờ isLocked riêng"
    RegisterRequest:
      type: object
      required: [email, password, fullName, isAdult, termsAccepted]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: "Định danh duy nhất, lưu chữ thường (BR-TK-01)"
        password:
          type: string
          description: "≥ 8 ký tự [CFG], có chữ và số, ≤ 72 byte UTF-8 (BR-TK-03, ADR-0009)"
        fullName:
          type: string
          maxLength: 100
          description: "Họ tên của hồ sơ online (BR-KH-01)"
        phone:
          type: [string, "null"]
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
          description: "Không bắt buộc, không kiểm trùng (BR-TK-01, v16)"
        isAdult:
          type: boolean
          description: "Phải true (BR-TK-02)"
        termsAccepted:
          type: boolean
          description: "Phải true (BR-TK-02)"
    RegistrationResponse:
      type: object
      required: [accountId, email, status, otpResendAvailableAt]
      properties:
        accountId:
          type: integer
          format: int64
        email:
          type: string
          format: email
          maxLength: 255
        status:
          type: string
          enum: [PENDING]
        otpResendAvailableAt:
          type: string
          format: date-time
          description: "Mốc được gửi lại OTP (BR-TK-07)"
    VerifyOtpRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          description: "6 chữ số (BR-TK-05)"
    VerificationResponse:
      type: object
      required: [accountId, status, linkDecisionPending]
      properties:
        accountId:
          type: integer
          format: int64
        status:
          type: string
          enum: [ACTIVE]
        linkDecisionPending:
          type: boolean
          description: "true nếu SĐT trùng hồ sơ tại quầy chưa liên kết → mở màn hình liên kết (BR-TK-19)"
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    OtpSentResponse:
      type: object
      required: [resendAvailableAt]
      properties:
        resendAvailableAt:
          type: string
          format: date-time
          description: "Mốc được gửi lại (BR-TK-07)"
        maskedEmail:
          type: [string, "null"]
          description: "Email nhận mã đã che, chỉ có ở luồng liên kết hồ sơ"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    AccountSummary:
      type: object
      required: [id, email, role, status, isLocked, mustChangePassword]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AccountStatus"
        isLocked:
          type: boolean
        mustChangePassword:
          type: boolean
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, account, linkDecisionPending]
      properties:
        accessToken:
          type: string
          description: "Bearer token gắn với một phiên (A1)"
        expiresAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/AccountSummary"
        linkDecisionPending:
          type: boolean
          description: "Khách còn cờ chờ quyết định liên kết thì FE nhắc lại lời đề nghị (BR-TK-19)"
    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
        newPassword:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    StaffProfile:
      type: object
      required: [accountId, fullName, phone]
      properties:
        accountId:
          type: integer
          format: int64
        fullName:
          type: string
          maxLength: 100
        avatarUrl:
          type: [string, "null"]
          maxLength: 500
        phone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        branchId:
          type: [integer, "null"]
          format: int64
          description: "null với ADMIN, SUPER_MANAGER (BR-QT-03)"
        specialty:
          type: [string, "null"]
          maxLength: 200
          description: "Chỉ VET (BR-TK-20)"
        bio:
          type: [string, "null"]
          maxLength: 500
          description: "Chỉ VET, ≤ 500 ký tự [CFG]"
    MeResponse:
      type: object
      required: [account, linkDecisionPending]
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        staffProfile:
          $ref: "#/components/schemas/StaffProfile"
        customerId:
          type: [integer, "null"]
          format: int64
          description: "Hồ sơ khách gắn tài khoản (chỉ CUSTOMER)"
        linkDecisionPending:
          type: boolean
    UpdateStaffProfileRequest:
      type: object
      properties:
        fullName:
          type: [string, "null"]
          maxLength: 100
        avatarUrl:
          type: [string, "null"]
          maxLength: 500
        phone:
          type: [string, "null"]
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        specialty:
          type: [string, "null"]
          maxLength: 200
          description: "Chỉ VET"
        bio:
          type: [string, "null"]
          maxLength: 500
          description: "Chỉ VET"
    LinkCandidate:
      type: object
      required: [customerId, maskedFullName, hasEmail]
      properties:
        customerId:
          type: integer
          format: int64
        maskedFullName:
          type: string
          description: "Ví dụ Ng*** V** A (BR-TK-19)"
        hasEmail:
          type: boolean
          description: "false: không liên kết online được, hướng dẫn ra quầy"
    LinkOtpRequest:
      type: object
      required: [customerId]
      properties:
        customerId:
          type: integer
          format: int64
          description: "Hồ sơ tại quầy chọn từ danh sách gợi ý"
    LinkConfirmRequest:
      type: object
      required: [customerId, code]
      properties:
        customerId:
          type: integer
          format: int64
        code:
          type: string
    LinkResult:
      type: object
      required: [customerId]
      properties:
        customerId:
          type: integer
          format: int64
          description: "Hồ sơ khách mà tài khoản đang gắn sau khi liên kết"
    StaffResponse:
      type: object
      required: [accountId, email, phone, fullName, role, status, isLocked, mustChangePassword, online]
      properties:
        accountId:
          type: integer
          format: int64
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        fullName:
          type: string
          maxLength: 100
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/AccountStatus"
        isLocked:
          type: boolean
        branchId:
          type: [integer, "null"]
          format: int64
        specialty:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        mustChangePassword:
          type: boolean
        online:
          type: boolean
          description: "Thao tác trong 10 phút [CFG] gần nhất (BR-TN-06)"
    CreateStaffRequest:
      type: object
      required: [email, phone, fullName, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
          description: "Bắt buộc với nhân viên (BR-TK-01)"
        fullName:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [SUPER_MANAGER, BRANCH_MANAGER, RECEPTIONIST, VET, CARETAKER]
          description: "Theo phân cấp BR-QT-01"
        branchId:
          type: [integer, "null"]
          format: int64
          description: "Bắt buộc với BRANCH_MANAGER…CARETAKER; chi nhánh DRAFT/ACTIVE (BR-QT-03)"
    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [BRANCH_MANAGER, RECEPTIONIST, VET, CARETAKER]
          description: BR-QT-05
    TransferStaffRequest:
      type: object
      required: [branchId]
      properties:
        branchId:
          type: integer
          format: int64
    ReactivateStaffRequest:
      type: object
      properties:
        branchId:
          type: [integer, "null"]
          format: int64
          description: "Gán lại chi nhánh nếu cần (BR-QT-10)"
    EmailChangeRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 255
    OtpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    CustomerEmailChangeRequest:
      type: object
      required: [newEmail, verificationMethod]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 255
        verificationMethod:
          type: string
          enum: [ID_CARD_IN_PERSON]
          description: "Lễ tân đã đối chiếu CCCD với họ tên hồ sơ; không lưu CCCD (BR-TK-16, A6)"
    CounterLinkRequest:
      type: object
      required: [accountEmail, verificationMethod]
      properties:
        accountEmail:
          type: string
          format: email
          maxLength: 255
          description: "Email tài khoản online của khách"
        verificationMethod:
          type: string
          enum: [ID_CARD_IN_PERSON]
          description: "BR-TK-19, A6"
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: "Bắt buộc (BR-QT-11)"
    PendingWorkItem:
      type: object
      required: [type, entityId, branchId, needsReassign]
      properties:
        type:
          type: string
          enum: [VISIT_IN_PROGRESS, VISIT_WAITING, CASHIER_SHIFT_OPEN, APPOINTMENT_BOOKED, BOARDING_ACTIVE, ORDER_UNPAID]
        entityId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        needsReassign:
          type: boolean
          description: "true với Visit IN_PROGRESS (BR-TN-08)"
    LockResult:
      type: object
      required: [account, pendingWork]
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        pendingWork:
          type: array
          items:
            $ref: "#/components/schemas/PendingWorkItem"
          description: "Quy trình dở dang hiển thị sau khi khóa (BR-QT-11)"
    SystemConfig:
      type: object
      required: [key, value, valueType, description]
      properties:
        key:
          type: string
        value:
          type: string
        valueType:
          type: string
          enum: [INT, DECIMAL, BOOL, TIME]
        minValue:
          type: [string, "null"]
        maxValue:
          type: [string, "null"]
        unit:
          type: [string, "null"]
        description:
          type: string
    UpdateConfigRequest:
      type: object
      required: [value]
      properties:
        value:
          type: string
          description: "Phải nằm trong [minValue, maxValue] (BR-QT-13)"
    NotificationTemplate:
      type: object
      required: [code, channel, body, allowedVars, requiredVars, isDefault]
      properties:
        code:
          type: string
        channel:
          type: string
          enum: [EMAIL, IN_APP]
        subject:
          type: [string, "null"]
        body:
          type: string
        allowedVars:
          type: array
          items:
            type: string
        requiredVars:
          type: array
          items:
            type: string
        isDefault:
          type: boolean
          description: "Nội dung đang trùng bản mặc định"
    UpdateTemplateRequest:
      type: object
      required: [body]
      properties:
        subject:
          type: [string, "null"]
          maxLength: 255
        body:
          type: string
          description: "Chỉ dùng biến trong allowedVars, đủ requiredVars (BR-QT-14)"
    AuditLogEntry:
      type: object
      required: [id, action, createdAt]
      properties:
        id:
          type: integer
          format: int64
        actorAccountId:
          type: [integer, "null"]
          format: int64
        actorEmail:
          type: [string, "null"]
        action:
          type: string
        entityType:
          type: [string, "null"]
        entityId:
          type: [integer, "null"]
          format: int64
        beforeData:
          type: [object, "null"]
          additionalProperties: true
        afterData:
          type: [object, "null"]
          additionalProperties: true
        reason:
          type: [string, "null"]
        ipAddress:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    PublicVet:
      type: object
      required: [accountId, fullName, branchId, branchName]
      properties:
        accountId:
          type: integer
          format: int64
        fullName:
          type: string
        avatarUrl:
          type: [string, "null"]
          maxLength: 500
        specialty:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        branchId:
          type: integer
          format: int64
        branchName:
          type: string
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "INVALID_STATE_TRANSITION: trạng thái hiện tại không cho phép thao tác · CONCURRENCY_CONFLICT: xung đột cập nhật đồng thời."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
