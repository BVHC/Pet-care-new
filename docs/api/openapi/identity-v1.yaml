# Pet Care Identity API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module TK, QT · owner BE-1
# Nguồn: 01 UC01–UC11, UC22 (phần tài khoản); 02 BR-TK-01…20, BR-QT-01…16; 03 #1 Tài khoản; 04 §1; 05 §1 (accounts, staff_profiles, sessions, otp_tokens, audit_logs, system_configs, notification_templates)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Identity API v1"
  version: "1.0.0"
  description: "Module TK, QT · owner BE-1. Nguồn: 01 UC01–UC11, UC22 (phần tài khoản); 02 BR-TK-01…20, BR-QT-01…16; 03 #1 Tài khoản; 04 §1; 05 §1 (accounts, staff_profiles, sessions, otp_tokens, audit_logs, system_configs, notification_templates). Chi tiết và truy vết: ../identity-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Auth
    description: "Đăng ký, OTP, đăng nhập, mật khẩu (UC01–UC05)"
  - name: Me
    description: "Thông tin và hồ sơ của người đang đăng nhập (UC05, UC06)"
  - name: "Profile link"
    description: "Liên kết tài khoản với hồ sơ khách có sẵn (UC07, BR-TK-19)"
  - name: Staff
    description: "Quản lý tài khoản nhân viên (UC08)"
  - name: "Customer account"
    description: "Lễ tân xử lý tài khoản của khách tại quầy (UC22)"
  - name: Accounts
    description: "Khóa / mở khóa mọi tài khoản (UC09)"
  - name: Configuration
    description: "Tham số [CFG] và mẫu thông báo (UC10)"
  - name: Audit
    description: "Nhật ký audit (UC11)"
  - name: Public
    description: "Hồ sơ bác sĩ công khai (UC15)"
paths:
  "/auth/register":
    post:
      tags: [Auth]
      summary: "Đăng ký tài khoản"
      description: "UC01 · BR-TK-01, 02, 03, 04, 05, 07, BR-KH-01. Actor: A01. Quyền: Public. Chuyển trạng thái: — → PENDING (Tài khoản#1); tạo hồ sơ online. Gửi OTP_REGISTER qua outbox (A8)."
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/RegistrationResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-01` email đã được sử dụng · `BR-TK-02` chưa xác nhận ≥ 18 tuổi / điều khoản · `BR-TK-03` mật khẩu yếu hoặc quá 72 byte · `BR-TK-07` email đã nhận quá 5 mã OTP/giờ [CFG]"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`CONCURRENCY_CONFLICT` hai request đăng ký cùng email cùng lúc"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/register/verify":
    post:
      tags: [Auth]
      summary: "Xác thực OTP đăng ký"
      description: "UC02 · BR-TK-05, 06, 19. Actor: A01. Quyền: Public. Chuyển trạng thái: PENDING → ACTIVE (Tài khoản#2). Không tự đăng nhập (A2)."
      operationId: verifyRegistration
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/VerificationResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-05` mã sai / hết hạn · `BR-TK-06` sai quá 5 lần, mã bị hủy"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không có tài khoản PENDING với email này"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/register/resend-otp":
    post:
      tags: [Auth]
      summary: "Gửi lại OTP đăng ký"
      description: "UC02 · BR-TK-04, 05, 07. Actor: A01. Quyền: Public. Chuyển trạng thái: —. Mã cũ cùng mục đích mất hiệu lực (BR-TK-05)."
      operationId: resendRegistrationOtp
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/OtpSentResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-07` chưa đủ 60 giây hoặc vượt 5 mã/giờ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không có tài khoản PENDING với email này"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/login":
    post:
      tags: [Auth]
      summary: "Đăng nhập"
      description: "UC03 · BR-TK-08, 09, 10, 11, 17, BR-QT-15. Actor: A02–A08. Quyền: Public. Chuyển trạng thái: —. Ghi audit thành công và thất bại."
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-08` tài khoản chưa xác thực → FE chuyển màn OTP · `BR-TK-09` đang khóa tạm, message có giờ thử lại · `BR-TK-11` tài khoản bị khóa / vô hiệu hóa"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Sai email hoặc mật khẩu — thông điệp chung (BR-TK-10); sai lần thứ 5 trong 15 phút [CFG] kích hoạt ST01"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/logout":
    post:
      tags: [Auth]
      summary: "Đăng xuất"
      description: "UC03 · BR-TK-11, BR-TN-06. Actor: A02–A08. Quyền: Người đang đăng nhập. Chuyển trạng thái: —. Hủy phiên hiện tại; nhân viên chuyển offline ngay."
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "Không có nội dung"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/auth/password/forgot":
    post:
      tags: [Auth]
      summary: "Quên mật khẩu — gửi OTP"
      description: "UC04 · BR-TK-04, 07, 10, 12. Actor: A02–A08. Quyền: Public. Chuyển trạng thái: —. Luôn trả 202 cùng nội dung, kể cả email không tồn tại hoặc tài khoản không đủ điều kiện BR-TK-12 (không gửi mã). Gửi lại = gọi lại endpoint này (A7)."
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: "Đã nhận"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/OtpSentResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Email sai định dạng"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/auth/password/reset":
    post:
      tags: [Auth]
      summary: "Đặt lại mật khẩu bằng OTP"
      description: "UC04 · BR-TK-03, 05, 06, 13. Actor: A02–A08. Quyền: Public. Chuyển trạng thái: —. Thành công: hủy mọi phiên, gỡ khóa tạm, gửi email PASSWORD_CHANGED (BR-TK-13)."
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: "Không có nội dung"
        "400":
          description: "`BR-TK-05` mã sai / hết hạn · `BR-TK-06` sai quá 5 lần, mã bị hủy · `BR-TK-03` mật khẩu không hợp lệ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/me":
    get:
      tags: [Me]
      summary: "Thông tin người đang đăng nhập"
      description: "UC06 · BR-TK-17, 19. Actor: A02–A08. Quyền: Người đang đăng nhập. Chuyển trạng thái: —."
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/me/password":
    post:
      tags: [Me]
      summary: "Đổi mật khẩu"
      description: "UC05 · BR-TK-03, 09, 14, 17. Actor: A02–A08. Quyền: Người đang đăng nhập. Chuyển trạng thái: —. Đăng xuất mọi phiên khác; gỡ `mustChangePassword`."
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: "Không có nội dung"
        "400":
          description: "`BR-TK-14` mật khẩu hiện tại sai (tính vào bộ đếm BR-TK-09) · `BR-TK-03` mật khẩu mới không hợp lệ hoặc trùng mật khẩu cũ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/me/staff-profile":
    patch:
      tags: [Me]
      summary: "Sửa hồ sơ nhân viên của tôi"
      description: "UC06 · BR-TK-15, 20. Actor: A03–A08. Quyền: Nhân viên đang đăng nhập; specialty, bio chỉ VET. Chuyển trạng thái: —."
      operationId: updateMyStaffProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateStaffProfileRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffProfile"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-20` mô tả ngắn vượt 500 ký tự [CFG] · `BR-TK-15` cố sửa email"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/me/link-candidates":
    get:
      tags: ["Profile link"]
      summary: "Danh sách hồ sơ tại quầy có thể liên kết"
      description: "UC07 · BR-TK-19, BR-KH-10. Actor: A02. Quyền: Khách đang đăng nhập. Chuyển trạng thái: —. Chỉ trả hồ sơ COUNTER chưa liên kết, họ tên đã che."
      operationId: listLinkCandidates
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: query
          required: false
          schema:
            type: string
            pattern: "^0[0-9]{9,10}$"
            maxLength: 15
          description: "SĐT của hồ sơ tại quầy (UC07 khi không có cờ); bỏ trống = SĐT đã khai trên hồ sơ online"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkCandidate"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-19` hồ sơ online đã phát sinh dữ liệu, không liên kết được"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/me/link/otp":
    post:
      tags: ["Profile link"]
      summary: "Gửi OTP tới email hồ sơ tại quầy"
      description: "UC07 · BR-TK-04, 07, 19. Actor: A02. Quyền: Khách đang đăng nhập. Chuyển trạng thái: —."
      operationId: sendLinkOtp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LinkOtpRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/OtpSentResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-19` hồ sơ không có email (ra quầy) hoặc hồ sơ online đã có dữ liệu · `BR-TK-07` gửi quá nhanh / quá 5 mã/giờ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  "/me/link/confirm":
    post:
      tags: ["Profile link"]
      summary: "Xác nhận liên kết"
      description: "UC07 · BR-TK-05, 06, 19. Actor: A02. Quyền: Khách đang đăng nhập. Chuyển trạng thái: —. Gắn tài khoản vào hồ sơ tại quầy, xóa hồ sơ online, email hồ sơ theo email tài khoản, ghi audit."
      operationId: confirmLink
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LinkConfirmRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/LinkResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-05` mã sai / hết hạn · `BR-TK-06` sai quá 5 lần, mã bị hủy · `BR-TK-19` hồ sơ online đã phát sinh dữ liệu"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  "/me/link/decline":
    post:
      tags: ["Profile link"]
      summary: "Chọn \"Không phải tôi\""
      description: "UC07 · BR-TK-19. Actor: A02. Quyền: Khách đang đăng nhập. Chuyển trạng thái: —."
      operationId: declineLink
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "Không có nội dung"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: "Hồ sơ không còn cờ chờ quyết định"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/staff":
    get:
      tags: [Staff]
      summary: "Danh sách nhân viên"
      description: "UC08 · BR-QT-01, 07. Actor: A03, A04, A05. Quyền: ADMIN: SUPER_MANAGER · SUPER_MANAGER: A05–A08 · BRANCH_MANAGER: A06–A08 chi nhánh mình. Chuyển trạng thái: —."
      operationId: listStaff
      security:
        - bearerAuth: []
      parameters:
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [SUPER_MANAGER, BRANCH_MANAGER, RECEPTIONIST, VET, CARETAKER]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Tìm theo họ tên, email"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/StaffResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Staff]
      summary: "Tạo tài khoản nhân viên"
      description: "UC08 · BR-QT-01, 02, 03, BR-TK-01, 17. Actor: A03, A04, A05. Quyền: Theo BR-QT-01. Chuyển trạng thái: — → ACTIVE (Tài khoản#4). Sinh mật khẩu ngẫu nhiên gửi STAFF_TEMP_PASSWORD; người tạo không thấy mật khẩu; mustChangePassword = true."
      operationId: createStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateStaffRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-01` email đã dùng · `BR-QT-03` thiếu chi nhánh hoặc chi nhánh không DRAFT/ACTIVE"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`BR-QT-01` chức vụ / chi nhánh ngoài quyền (ghi audit)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/staff/{id}":
    get:
      tags: [Staff]
      summary: "Chi tiết nhân viên"
      description: "UC08 · BR-QT-01, 07. Actor: A03, A04, A05. Quyền: Trong phạm vi như listStaff. Chuyển trạng thái: —."
      operationId: getStaff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffResponse"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/staff/{id}/change-role":
    post:
      tags: [Staff]
      summary: "Đổi chức vụ"
