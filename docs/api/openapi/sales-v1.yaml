# Pet Care Sales & Cashier API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module BH, TG · owner BE-2
# Nguồn: 01 UC66, UC67, UC70–UC72; 02 BR-BH-01…06, BR-TG-01…05, BR-TN-01, 08, BR-KB-03, 04, BR-LT-09, BR-SP-01, BR-QT-15; 03 #5 Order, #8 Ca thu ngân; 04 §8; 05 §8 (orders, order_lines, payments, cashier_shifts)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Sales & Cashier API v1"
  version: "1.0.0"
  description: "Module BH, TG · owner BE-2. Nguồn: 01 UC66, UC67, UC70–UC72; 02 BR-BH-01…06, BR-TG-01…05, BR-TN-01, 08, BR-KB-03, 04, BR-LT-09, BR-SP-01, BR-QT-15; 03 #5 Order, #8 Ca thu ngân; 04 §8; 05 §8 (orders, order_lines, payments, cashier_shifts). Chi tiết và truy vết: ../sales-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Orders
    description: "Order và dòng Order (UC66, UC67)"
  - name: Payments
    description: "Thu tiền tại quầy, thu gộp (UC70)"
  - name: "Cashier shifts"
    description: "Mở / chốt ca, đối soát (UC71, UC72)"
paths:
  "/orders":
    post:
      tags: [Orders]
      summary: "Tạo Order bán lẻ"
      description: "UC66 · BR-BH-01. Actor: A06. Quyền: Lễ tân. Chuyển trạng thái: — → OPEN, RETAIL (Order#2)."
      operationId: createRetailOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateRetailOrderRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Orders]
      summary: "Danh sách Order"
      description: "UC66, UC70, ST13 · BR-BH-05. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh của Order. Chuyển trạng thái: —."
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, PENDING, PAID, CANCELLED]
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [VISIT, RETAIL, BOARDING]
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: visitId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: boardingBookingId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: pendingOverdue
          in: query
          required: false
          schema:
            type: boolean
          description: "PENDING quá 1 ngày [CFG] — danh sách ST13 cho quản lý (BR-BH-05)"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/OrderSummary"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/orders/{orderId}":
    get:
      tags: [Orders]
      summary: "Chi tiết Order"
      description: "UC66, UC67, UC70 · BR-BH-02, 06. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh của Order. Chuyển trạng thái: —."
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/orders/{orderId}/lines":
    post:
      tags: [Orders]
      summary: "Thêm dịch vụ / hàng vào Order"
      description: "UC66, UC67 · BR-BH-02, 03, 04, BR-SP-01. Actor: A06, A07, A08. Quyền: Lễ tân: GOODS; VET: SERVICE nhóm MEDICAL của Visit mình; CARETAKER: SERVICE nhóm GROOMING của Visit mình. Chuyển trạng thái: —. Giá snapshot lúc thêm. Thiếu tồn bán lẻ: cảnh báo, không chặn."
      operationId: addOrderLine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AddOrderLineRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/AddOrderLineResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-SP-01` thuốc kê đơn (dùng kê đơn) · sản phẩm / dịch vụ ngừng kinh doanh"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`BR-BH-02` vai trò không được thêm loại dòng này"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Order không OPEN (khi PENDING chỉ lễ tân thêm GOODS) / đã PAID, CANCELLED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/lines/{lineId}":
    patch:
      tags: [Orders]
      summary: "Sửa dòng (giảm số lượng / đổi dịch vụ tự sinh)"
      description: "UC66, UC67 · BR-BH-02, 03, 04, BR-TN-01. Actor: A06, A07, A08. Quyền: Chủ dòng (ownerAccountId). Chuyển trạng thái: —."
      operationId: updateOrderLine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/LineId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateOrderLineRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`BR-BH-02` không phải chủ dòng, hoặc dòng dịch vụ / thuốc đã khóa khi PENDING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Order đã PAID / CANCELLED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Orders]
      summary: "Xóa dòng"
      description: "UC66, UC67 · BR-BH-02, BR-KB-04. Actor: A06, A07, A08. Quyền: Chủ dòng (ownerAccountId). Chuyển trạng thái: —."
      operationId: deleteOrderLine
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/LineId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-BH-02` dòng VACCINE không xóa trực tiếp (xóa mũi tiêm) · dòng DRUG xóa qua đơn thuốc"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`BR-BH-02` không phải chủ dòng"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Order đã PAID / CANCELLED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/close":
    post:
      tags: [Orders]
      summary: "Chốt Order bán lẻ"
      description: "UC66 · BR-BH-01. Actor: A06. Quyền: Lễ tân. Chuyển trạng thái: OPEN → PENDING, RETAIL (Order#5)."
      operationId: closeRetailOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-BH-01` Order chưa có dòng nào"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Không phải Order RETAIL OPEN"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/cancel":
    post:
      tags: [Orders]
      summary: "Hủy Order bán lẻ chưa chốt"
      description: "UC66 · BR-BH-01. Actor: A06. Quyền: Lễ tân. Chuyển trạng thái: OPEN → CANCELLED, RETAIL (Order#7)."
      operationId: cancelRetailOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Không phải Order RETAIL OPEN"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/abort-checkout":
    post:
      tags: [Orders]
      summary: "Hủy phiên trả thú (khách không thanh toán)"
      description: "UC59 · BR-LT-09, BR-QT-15. Actor: A06. Quyền: Lễ tân. Chuyển trạng thái: PENDING → CANCELLED, BOARDING (Order#9). cancelType = CHECKOUT_ABORTED, không tính thất thu. Đặt chỗ giữ trạng thái, tiếp tục tính đêm. Ghi audit."
      operationId: abortBoardingCheckout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-09` thiếu lý do · thú không còn trong chuồng (dùng cancel-unpaid)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Không phải Order BOARDING PENDING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/cancel-unpaid":
    post:
      tags: [Orders]
      summary: "Hủy Order khách không thanh toán"
      description: "UC66 · BR-BH-05, BR-BC-02, BR-QT-15. Actor: A05. Quyền: Chỉ BRANCH_MANAGER chi nhánh. Chuyển trạng thái: PENDING → CANCELLED (Order#10). cancelType = UNPAID (thất thu). Không đổi kho, bệnh án, lịch hẹn, lưu trú. Ghi audit."
      operationId: cancelUnpaidOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-BH-05` thiếu lý do · Order BOARDING khi thú còn trong chuồng (xử lý theo BR-LT-09)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Order không PENDING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/orders/{orderId}/lines/{lineId}/move-to-external-purchase":
    post:
      tags: [Orders]
      summary: "Chuyển dòng thuốc kê đơn sang mua ngoài khi thiếu tồn lúc thu"
      description: "UC70 · BR-BH-04, BR-KB-03, BR-QT-15. Actor: A06. Quyền: Lễ tân. Chuyển trạng thái: —. Dòng bị xóa khỏi Order, vẫn in trên đơn thuốc (external_reason = OUT_OF_STOCK_AT_PAYMENT). Ghi audit."
      operationId: moveDrugLineToExternalPurchase
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/LineId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Order"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Dòng không phải DRUG hoặc tồn vẫn đủ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Order không PENDING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/customers/{customerId}/payable-orders":
    get:
      tags: [Payments]
      summary: "Order PENDING của khách tại chi nhánh"
      description: "UC70 · BR-TG-01, 03. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: —. Dùng để chọn Order thu gộp."
      operationId: listPayableOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderSummary"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/payments/preview":
    post:
      tags: [Payments]
      summary: "Xem trước khi thu (tổng tiền, dòng thiếu tồn)"
      description: "UC70 · BR-TG-02, 03, BR-BH-04. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: —. Không ghi gì (A2)."
      operationId: previewPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PaymentPreviewRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/PaymentPreview"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TG-03` Order khác khách / khác chi nhánh · `BR-TG-01` có Order không PENDING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/payments":
    post:
      tags: [Payments]
      summary: "Thu tiền"
      description: "UC70, ST06 · BR-TG-01…04, BR-BH-04, 06, BR-KO-05. Actor: A06. Quyền: Lễ tân có ca OPEN của chính mình. Chuyển trạng thái: PENDING → PAID (Order#8) cho mọi Order trong phiếu. Trừ kho FEFO cùng transaction; ghi vào ca; ghi audit."
      operationId: collectPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Payment"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TG-01` chưa mở ca · `BR-TG-02` số tiền khác tổng · `BR-TG-03` Order khác khách / chi nhánh · `BR-BH-04` thiếu tồn (gọi preview để xem dòng thiếu)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Có Order không còn PENDING · xung đột đồng thời"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/payments/{paymentId}":
    get:
      tags: [Payments]
      summary: "Chi tiết phiếu thu"
      description: "UC70 · —. Actor: A05, A06. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —."
      operationId: getPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Payment"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
