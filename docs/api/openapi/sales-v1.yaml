components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    OrderSource:
      type: string
      enum: [VISIT, RETAIL, BOARDING]
    OrderStatus:
      type: string
      enum: [OPEN, PENDING, PAID, CANCELLED]
      description: "03 #5"
    OrderLine:
      type: object
      required: [lineId, lineType, description, quantity, unitPrice, lineTotal, isAutoGenerated, addedBy, ownerAccountId, canEdit, canDelete]
      properties:
        lineId:
          type: integer
          format: int64
        lineType:
          type: string
          enum: [SERVICE, GOODS, DRUG, VACCINE, BOARDING]
        serviceId:
          type: [integer, "null"]
          format: int64
        productId:
          type: [integer, "null"]
          format: int64
        description:
          type: string
          description: "Tên lúc thêm dòng"
        quantity:
          type: integer
          format: int32
          description: "Với BOARDING là số đêm"
        unitPrice:
          type: integer
          format: int64
          minimum: 0
          description: "Snapshot (BR-BH-03)"
        lineTotal:
          type: integer
          format: int64
          minimum: 0
          description: VND
        isAutoGenerated:
          type: boolean
        addedBy:
          type: integer
          format: int64
        ownerAccountId:
          type: integer
          format: int64
          description: "Người có quyền xóa (BR-BH-02, BR-TN-08)"
        canEdit:
          type: boolean
          description: "Theo người đang xem"
        canDelete:
          type: boolean
          description: "Theo người đang xem; dòng VACCINE luôn false"
    Order:
      type: object
      required: [orderId, code, source, status, customerId, customerName, branchId, totalAmount, lines, createdAt, deliveryAllowed]
      properties:
        orderId:
          type: integer
          format: int64
        code:
          type: string
        source:
          $ref: "#/components/schemas/OrderSource"
        status:
          $ref: "#/components/schemas/OrderStatus"
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        branchId:
          type: integer
          format: int64
        visitId:
          type: [integer, "null"]
          format: int64
        boardingBookingId:
          type: [integer, "null"]
          format: int64
        totalAmount:
          type: integer
          format: int64
          minimum: 0
          description: VND
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        createdAt:
          type: string
          format: date-time
        pendingAt:
          type: [string, "null"]
          format: date-time
        paidAt:
          type: [string, "null"]
          format: date-time
        paymentId:
          type: [integer, "null"]
          format: int64
        cancelType:
          type: [string, "null"]
          enum: [VISIT_CANCELLED, RETAIL_UNCLOSED, CHECKOUT_ABORTED, UNPAID, null]
        cancelReason:
          type: [string, "null"]
        cancelledAt:
          type: [string, "null"]
          format: date-time
        deliveryAllowed:
          type: boolean
          description: "true chỉ khi PAID (BR-BH-06)"
    OrderSummary:
      type: object
      required: [orderId, code, source, status, customerId, customerName, branchId, totalAmount, createdAt]
      properties:
        orderId:
          type: integer
          format: int64
        code:
          type: string
        source:
          $ref: "#/components/schemas/OrderSource"
        status:
          $ref: "#/components/schemas/OrderStatus"
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        branchId:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
          minimum: 0
          description: VND
        createdAt:
          type: string
          format: date-time
        pendingAt:
          type: [string, "null"]
          format: date-time
        paidAt:
          type: [string, "null"]
          format: date-time
    CreateRetailOrderRequest:
      type: object
      required: [customerId]
      properties:
        customerId:
          type: integer
          format: int64
          description: A1
    AddOrderLineRequest:
      type: object
      required: [lineType, quantity]
      properties:
        lineType:
          type: string
          enum: [SERVICE, GOODS]
        serviceId:
          type: [integer, "null"]
          format: int64
          description: "SERVICE: nhóm khớp vai trò (VET: MEDICAL, CARETAKER: GROOMING)"
        productId:
          type: [integer, "null"]
          format: int64
          description: "GOODS: không phải thuốc kê đơn (BR-SP-01)"
        quantity:
          type: integer
          format: int32
          description: "> 0"
    StockWarning:
      type: object
      required: [productId, requested, available]
      properties:
        productId:
          type: integer
          format: int64
        requested:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
    AddOrderLineResult:
      type: object
      description: "stockWarning có khi hàng bán lẻ thiếu tồn khả dụng — cảnh báo, không chặn (BR-BH-04)"
      required: [order, lineId]
      properties:
        order:
          $ref: "#/components/schemas/Order"
        lineId:
          type: integer
          format: int64
        stockWarning:
          $ref: "#/components/schemas/StockWarning"
    UpdateOrderLineRequest:
      type: object
      properties:
        quantity:
          type: [integer, "null"]
          format: int32
          description: "Giảm dòng bán lẻ (BR-BH-04)"
        serviceId:
          type: [integer, "null"]
          format: int64
          description: "Người được gán lượt đổi dịch vụ của dòng tự sinh (BR-TN-01, A5)"
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 300
    ShortageLine:
      type: object
      required: [orderId, lineId, lineType, productId, productName, requested, available]
      properties:
        orderId:
          type: integer
          format: int64
        lineId:
          type: integer
          format: int64
        lineType:
          type: string
          enum: [GOODS, DRUG]
        productId:
          type: integer
          format: int64
        productName:
          type: string
        requested:
          type: integer
          format: int32
        available:
          type: integer
          format: int32
    PaymentPreviewRequest:
      type: object
      required: [orderIds]
      properties:
        orderIds:
          type: array
          items:
            type: integer
            format: int64
          description: "Các Order PENDING cùng khách, cùng chi nhánh (BR-TG-03)"
    PaymentPreview:
      type: object
      required: [customerId, branchId, totalAmount, shortages]
      properties:
        customerId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        totalAmount:
          type: integer
          format: int64
          minimum: 0
          description: VND
        shortages:
          type: array
          items:
            $ref: "#/components/schemas/ShortageLine"
          description: "Rỗng mới thu được; bỏ qua dòng VACCINE (BR-BH-04)"
    CreatePaymentRequest:
      type: object
      required: [orderIds, method, amount]
      properties:
        orderIds:
          type: array
          items:
            type: integer
            format: int64
        method:
          type: string
          enum: [CASH, TRANSFER]
        amount:
          type: integer
          format: int64
          minimum: 0
          description: "Phải bằng tổng các Order (BR-TG-02)"
    Payment:
      type: object
      required: [paymentId, code, branchId, customerId, cashierShiftId, method, amount, receivedBy, paidAt, orders]
      properties:
        paymentId:
          type: integer
          format: int64
        code:
          type: string
          description: "Số phiếu thu"
        branchId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        cashierShiftId:
          type: integer
          format: int64
        method:
          type: string
          enum: [CASH, TRANSFER]
        amount:
          type: integer
          format: int64
          minimum: 0
          description: VND
        receivedBy:
          type: integer
          format: int64
        paidAt:
          type: string
          format: date-time
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
    CashierShift:
      type: object
      required: [shiftId, branchId, cashierId, cashierName, isAfterHours, businessDate, status, openedAt, autoClosed, paymentCount]
      properties:
        shiftId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        cashierId:
          type: integer
          format: int64
        cashierName:
          type: string
        isAfterHours:
          type: boolean
          description: "Ca ngoài giờ thu tiền cấp cứu (BR-CN-05)"
        businessDate:
          type: string
          format: date
        status:
          type: string
          enum: [OPEN, CLOSED, RECONCILED]
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: [string, "null"]
          format: date-time
        autoClosed:
          type: boolean
          description: ST13
        expectedCash:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: VND
        expectedTransfer:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: VND
        countedCash:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: VND
        difference:
          type: [integer, "null"]
          format: int64
          description: "countedCash − expectedCash (VND), có thể âm"
        reconcileNote:
          type: [string, "null"]
        reconciledBy:
          type: [integer, "null"]
          format: int64
        reconciledAt:
          type: [string, "null"]
          format: date-time
        paymentCount:
          type: integer
          format: int32
    OpenShiftRequest:
      type: object
      required: [afterHours]
      properties:
        afterHours:
          type: boolean
          description: "false = ca thường, true = ca ngoài giờ (BR-TG-05)"
    CurrentShift:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
        shift:
          $ref: "#/components/schemas/CashierShift"
    CloseShiftRequest:
      type: object
      required: [countedCash]
      properties:
        countedCash:
          type: integer
          format: int64
          minimum: 0
          description: "Tiền mặt thực đếm (A4)"
    ReconcileShiftRequest:
      type: object
      required: [note]
      properties:
        countedCash:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: "Bắt buộc với ca tự chốt (BR-TG-05)"
        note:
          type: string
          description: "Ghi chú chênh lệch"
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
