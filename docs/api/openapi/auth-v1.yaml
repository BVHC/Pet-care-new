# Pet Care Auth API v1 — OpenAPI 3.1 (derived strictly from docs/)
#
# Source of truth: docs/01-business-operations.md, docs/02-business-rules.md,
# docs/03-state-machines.md (FSM-1 Account), docs/04-glossary.md (+D-04),
# docs/05-domain-model.md (#4.1), docs/06-erd.md (accounts/otps/users).
# Folder plans/ is outdated and was NOT used.
#
# Traceability legend: CONFIRMED = in docs (source cited) / ASSUMPTION (A#) =
# reasonable inference, unconfirmed / TBD (Q#) = needs PO/Product (see
# ../auth-v1.md section E). No `servers` is declared (base URL/versioning TBD Q1,
# defaults to "/"). No token TTLs (TBD Q4), no password constraints (TBD Q5).
# No forgot/reset endpoints (unconfirmed ops). No /auth/refresh endpoint
# (TBD Q3: insufficient contract).

openapi: 3.1.0
info:
  title: Pet Care Auth API v1
  version: 1.0.0
  description: >-
    Strictly derived from docs/ (01 operations, 02 RULE-01/02, 03 FSM-1 Account,
    04 glossary+D-04, 05 domain 4.1, 06 ERD accounts/otps/users).
    Base URL/versioning (Q1) is TBD: no `servers` is declared
    (defaults to "/") and paths below are PROPOSED. Token TTLs (Q4), password
    policy (Q5) intentionally absent. No forgot/reset (unconfirmed ops). No
    /auth/refresh endpoint (Q3: insufficient contract). Error envelope follows
    docs/convention/backend/04-exception-handling
    ({success, errorCode, message, statusCode, timestamp, traceId}); 410/423/429
    are PROPOSED extensions not yet in that convention. LOCKED has no
    auto-unlock: LOCKED->ACTIVE only via manual UnlockAccount (FSM-1
    invariant #5).
    **Sửa 2026-09-13 (RULE-01-10):** danh tính chính đổi từ `phone` sang
    `email` cho Register/VerifyOtp/ResendOtp — xem Decision Log
    docs/02-business-rules.md mục 01 (cuối). `phone` chuyển thành optional.
tags:
  - name: Auth
    description: Registration OTP, login, logout (docs module 01).
  - name: StaffProvisioning
    description: CreateStaff D-04 (docs 01#1, RULE-01-03, RULE-02-05).
  - name: CustomerProvisioning
    description: Receptionist counter-assisted customer creation (docs 02, RULE-02-06).
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register customer account (RegisterAccount)
      description: CONFIRMED behavior (RULE-01-01/02/03, FSM-1). Path/shape PROPOSED.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created as PENDING_VERIFICATION; registration OTP sent via Gmail SMTP (module/notification).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-decision-2026-09-13: >-
        Email or phone already exists is BUSINESS_RULE_VIOLATION/400 (RULE-01-10),
        NOT 409 — decided to stick to the 5 base exceptions in
        docs/convention/backend/04-exception-handling.md rather than add a new
        HTTP status for this one case. Same status covers the concurrent-double-
        register race (Service catches DataIntegrityViolationException on the
        UNIQUE constraint and re-throws the same BusinessRuleViolationException).
        See Decision Log in docs/02-business-rules.md section 01.
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify registration OTP (VerifyOTP)
      description: CONFIRMED (RULE-01-02/03/05, FSM-1 PENDING_VERIFICATION->ACTIVE). No tokens issued (docs require none).
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Account activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          description: >-
            VALIDATION_FAILED (bad format) or BUSINESS_RULE_VIOLATION — wrong/
            expired OTP (RULE-01-02) or verification session locked 15 min
            after 5 wrong attempts (RULE-01-05). Decided 2026-09-13 to fold
            wrong-code/expired/locked all into 400 BUSINESS_RULE_VIOLATION
            (message carries the RULE-ID) instead of 401/410/423 — see
            Decision Log docs/02-business-rules.md section 01. No separate
            remainingAttempts/lockedUntil response fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No OTP session/account found for this email (anti-enumeration TBD Q11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Already ACTIVE — AccountTransitionHandler (FSM-1) rejects the
            ACTIVE->ACTIVE transition, surfaced as the standard
            INVALID_STATE_TRANSITION (convention 04-exception-handling),
            not a custom ACCOUNT_ALREADY_ACTIVE code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/otp/resend:
    post:
      tags: [Auth]
      summary: Resend registration OTP (ResendOTP, standalone)
      description: CONFIRMED (RULE-01-04/05). Each call kills previous OTP (non-idempotent by rule).
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: New OTP issued, previous invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
        '400':
          description: >-
            VALIDATION_FAILED, or BUSINESS_RULE_VIOLATION for any of: account
            already ACTIVE (RULE-01-03, replaces ASSUMPTION A6), verification
            session locked (RULE-01-05), 60s cooldown not elapsed (RULE-01-04),
            or 5/hour resend limit exceeded (RULE-01-05). Decided 2026-09-13 to
            use 400 for all of these (no 409, no 429, no Retry-After header) —
            see Decision Log docs/02-business-rules.md section 01.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No account found for this email (Q11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (Login)
      description: >-
        IMPLEMENTED 2026-09-14. CONFIRMED guards (RULE-01-01/07, RULE-02-04).
        Identifier là email (RULE-01-10 — không còn nhận phone, thay ASSUMPTION A1
        cũ). Response không có field `user` (quyết định 2026-09-14 — xem
        LoginResponse) và có `expiresIn` (giây, từ access-token TTL, ADR-0002).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; token pair issued (pair existence CONFIRMED RULE-01-06/02-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials (PROPOSED code INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not ACTIVE — PENDING_VERIFICATION or DEACTIVATED (CONFIRMED RULE-01-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: "Account LOCKED with lockedUntil (CONFIRMED RULE-01-07/02-04). Still 423 until manual UnlockAccount; locked_until is the earliest-unlock threshold, NOT auto-unlock (FSM-1 invariant 5)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Brute-force protection (PROPOSED, thresholds TBD Q11; convention has no 429 mapping yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh (làm mới token pair)
      description: >-
        IMPLEMENTED 2026-09-14. Rotate refresh token (1-lần-dùng, ADR-0001);
        không có RULE-ID/FSM riêng — session/token layer infra giống Logout.
        Re-check AccountStatus tại thời điểm gọi (RULE-01-01/07).
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token pair mới; refresh token cũ đã bị revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token không hợp lệ — malformed/hết hạn/sai type/không tìm thấy hoặc đã bị revoke (reuse).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Account không còn ACTIVE (PENDING_VERIFICATION/DEACTIVATED) kể từ lúc refresh token được cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Account đã bị LOCKED kể từ lúc refresh token được cấp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (Logout)
      description: CONFIRMED effect (RULE-01-06 revoke session+refresh, blacklist access). Idempotent.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /staff-accounts:
    post:
      tags: [StaffProvisioning]
      summary: Create staff account direct ACTIVE (CreateStaff D-04)
      description: CONFIRMED (RULE-01-03/D-04, RULE-02-05, FSM-1). No OTP step. Temp password + must_change_password=true.
      operationId: createStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside admin scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Phone or email already exists (ERD UNIQUE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers:
    post:
      tags: [CustomerProvisioning]
      summary: Receptionist creates customer at counter, direct ACTIVE (ManageCustomerProfile)
      description: >-
        CONFIRMED operation (docs 02, RULE-02-06). DECIDED 2026-09-14 (unlike
        self-service RegisterAccount): created directly ACTIVE, no OTP step —
        Receptionist has already verified the customer's identity in person at
        the counter (same spirit as CreateStaff D-04). mustChangePassword=true
        since the Receptionist sets the password on the customer's behalf
        (ASSUMPTION, reasoned by the same security rationale as D-04).
      operationId: createCustomer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Role other than RECEPTIONIST.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ASSUMPTION A2 — docs only confirm JWT/Session Token (RULE-01-01).
  schemas:
    Phone:
      type: string
      pattern: '^[0-9]{10}$'
      description: CONFIRMED format — VO PhoneNumber 10 digits (05#4.1). May need locale review.
    OtpCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: CONFIRMED format — VO OtpCode 6 digits (05#4.1).
    AccountStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, LOCKED, DEACTIVATED]
      description: CONFIRMED (04 glossary AccountStatus). MUST MIRROR the `AccountStatus` schema in `openapi/iam-v1.yaml` byte-for-byte (no cross-file $ref support in this repo's tooling) — if you edit one, edit the other.
    RoleCode:
      type: string
      enum: [SUPER_ADMIN, ORGANIZATION_ADMIN, STORE_MANAGER, RECEPTIONIST, VETERINARIAN, GROOMER, INVENTORY_STAFF, FINANCE_STAFF, CUSTOMER]
      description: CONFIRMED 9 canonical roles (RULE-02-02). MUST MIRROR the `RoleCode` schema in `openapi/iam-v1.yaml` byte-for-byte (no cross-file $ref support in this repo's tooling) — if you edit one, edit the other.
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          description: >-
            Required + unique platform identity (RULE-01-10, sửa 2026-09-13 —
            xem Decision Log docs/02-business-rules.md mục 01: đổi danh tính
            chính từ phone sang email để dùng Gmail SMTP làm kênh gửi OTP).
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          description: Required (ERD password_hash NOT NULL CONFIRMED). Policy TBD Q5 — no constraints declared here by design.
        name:
          type: string
          description: ASSUMPTION A3 — ERD users.full_name NOT NULL but ops don't state collection step.
    RegisterResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    VerifyOtpRequest:
      type: object
      required: [email, otpCode]
      properties:
        email:
          type: string
          format: email
          description: Đổi từ phone sang email (RULE-01-10, sửa 2026-09-13).
        otpCode:
          $ref: '#/components/schemas/OtpCode'
    VerifyOtpResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    ResendOtpRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Đổi từ phone sang email (RULE-01-10, sửa 2026-09-13).
    ResendOtpResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Danh tính đăng nhập duy nhất (RULE-01-10, sửa 2026-09-14 — thay ASSUMPTION A1 "phone or email" cũ).
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: CONFIRMED existence (RULE-01-01/02-04).
        refreshToken:
          type: string
          description: CONFIRMED existence (RULE-01-06/02-04).
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: TTL access token tính bằng giây (ADR-0002, mặc định 900 = 15 phút).
      description: >-
        Quyết định 2026-09-14: KHÔNG có field `user` — userId/accountId/role đã
        có sẵn trong claim của accessToken (FE tự giải mã JWT), trả thêm ở JSON
        body là thừa và lộ thông tin không cần thiết. `mustChangePassword`
        (RULE-01-03) cũng tạm bỏ khỏi response này — FE lấy giá trị này trực
        tiếp từ response của `CreateStaff`/`CreateCustomer` lúc tạo tài khoản;
        bổ sung lại ở đây (claim JWT hoặc field riêng) khi luồng Staff/Customer
        first-login-đổi-mật-khẩu được xây (TBD Q6).
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshTokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: Access token mới.
        refreshToken:
          type: string
          description: Refresh token mới (rotate — token cũ dùng trong request đã bị revoke, ADR-0001).
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: TTL access token tính bằng giây (ADR-0002, mặc định 900 = 15 phút).
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: PROPOSED — identifies refresh to revoke per RULE-01-06; omit to revoke by access session.
    LogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    CreateStaffRequest:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
          description: Required + unique platform identity (RULE-01-10), matches code — the openapi doc previously said phone was required and email optional; fixed to match CreateStaffRequest.java.
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          description: Temporary password (CONFIRMED D-04). Policy TBD Q5.
        name:
          type: string
          description: ASSUMPTION A3.
        role:
          $ref: '#/components/schemas/RoleCode'
        organizationId:
          type: string
          format: uuid
          description: Scope binding; required-matrix TBD Q9.
        storeId:
          type: string
          format: uuid
          description: Scope binding; required-matrix TBD Q9.
    CreateStaffResponse:
      type: object
      required: [accountId, userId, status, mustChangePassword]
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        mustChangePassword:
          type: boolean
          example: true
    CreateCustomerRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          description: Required + unique platform identity (RULE-01-10).
        phone:
          $ref: '#/components/schemas/Phone'
        password:
          type: string
          description: Set by the Receptionist on the customer's behalf. Policy TBD Q5.
        name:
          type: string
    CreateCustomerResponse:
      type: object
      required: [accountId, userId, status, mustChangePassword]
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        mustChangePassword:
          type: boolean
          example: true
    Error:
      type: object
      required: [success, errorCode, message, statusCode, timestamp]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          description: Only ACCESS_DENIED_SCOPE_MISMATCH is CONFIRMED (RULE-02-01, 403); VALIDATION_FAILED/BUSINESS_RULE_VIOLATION/INVALID_STATE_TRANSITION/RESOURCE_NOT_FOUND/CONCURRENCY_CONFLICT follow docs/convention/backend/04-exception-handling; all other codes in ../auth-v1.md section C are PROPOSED (410/423/429 have no convention mapping yet).
        message:
          type: string
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
