# Pet Care Auth API v1 — OpenAPI 3.1 (derived strictly from docs/)
#
# Source of truth: docs/01-business-operations.md, docs/02-business-rules.md,
# docs/03-state-machines.md (FSM-1 Account), docs/04-glossary.md (+D-04),
# docs/05-domain-model.md (#4.1), docs/06-erd.md (accounts/otps/users).
# Folder plans/ is outdated and was NOT used.
#
# Traceability legend: CONFIRMED = in docs (source cited) / ASSUMPTION (A#) =
# reasonable inference, unconfirmed / TBD (Q#) = needs PO/Product (see
# ../auth-v1.md section E). No `servers` is declared (base URL/versioning TBD Q1,
# defaults to "/"). No token TTLs (TBD Q4), no password constraints (TBD Q5).
# No forgot/reset endpoints (unconfirmed ops). No /auth/refresh endpoint
# (TBD Q3: insufficient contract).

openapi: 3.1.0
info:
  title: Pet Care Auth API v1
  version: 1.0.0
  description: >-
    Strictly derived from docs/ (01 operations, 02 RULE-01/02, 03 FSM-1 Account,
    04 glossary+D-04, 05 domain 4.1, 06 ERD accounts/otps/users).
    Base URL/versioning (Q1) and envelope (Q2) are TBD: no `servers` is declared
    (defaults to "/") and paths below are PROPOSED. Token TTLs (Q4), password
    policy (Q5) intentionally absent. No forgot/reset (unconfirmed ops). No
    /auth/refresh endpoint (Q3: insufficient contract).
tags:
  - name: Auth
    description: Registration OTP, login, logout (docs module 01).
  - name: StaffProvisioning
    description: CreateStaff D-04 (docs 01#1, RULE-01-03, RULE-02-05).
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register customer account (RegisterAccount)
      description: CONFIRMED behavior (RULE-01-01/02/03, FSM-1). Path/shape PROPOSED.
      operationId: registerAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created as PENDING_VERIFICATION; registration OTP sent by system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Phone or email already exists (ERD UNIQUE, CONFIRMED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Abuse limit (RULE-01-05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify registration OTP (VerifyOTP)
      description: CONFIRMED (RULE-01-02/03/05, FSM-1 PENDING_VERIFICATION->ACTIVE). No tokens issued (docs require none).
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: Account activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong OTP with attempts remaining (PROPOSED code OTP_INVALID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No OTP session/account (anti-enumeration TBD Q11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already ACTIVE (PROPOSED, derived from FSM).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: OTP expired after 300s TTL (CONFIRMED RULE-01-02).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Verification locked 15 min after 5 wrong attempts (CONFIRMED RULE-01-05).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/otp/resend:
    post:
      tags: [Auth]
      summary: Resend registration OTP (ResendOTP, standalone)
      description: CONFIRMED (RULE-01-04/05). Each call kills previous OTP (non-idempotent by rule).
      operationId: resendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: New OTP issued, previous invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No pending account/OTP (Q11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already ACTIVE (ASSUMPTION A6).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 60s cooldown or 5/hour exceeded (CONFIRMED limits; codes PROPOSED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (Login)
      description: >-
        CONFIRMED guards (RULE-01-01/07, RULE-02-04). Identifier phone-or-email is
        ASSUMPTION A1; Bearer transport ASSUMPTION A2; TTLs TBD Q4 (no expiresIn emitted).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; token pair issued (pair existence CONFIRMED RULE-01-06/02-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials (PROPOSED code INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not ACTIVE — PENDING_VERIFICATION or DEACTIVATED (CONFIRMED RULE-01-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Account LOCKED with lockedUntil (CONFIRMED RULE-01-07/02-04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Brute-force protection (thresholds TBD Q11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (Logout)
      description: CONFIRMED effect (RULE-01-06 revoke session+refresh, blacklist access). Idempotent.
      operationId: logout
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /staff-accounts:
    post:
      tags: [StaffProvisioning]
      summary: Create staff account direct ACTIVE (CreateStaff D-04)
      description: CONFIRMED (RULE-01-03/D-04, RULE-02-05, FSM-1). No OTP step. Temp password + must_change_password=true.
      operationId: createStaff
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStaffResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside admin scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Phone or email already exists (ERD UNIQUE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ASSUMPTION A2 — docs only confirm JWT/Session Token (RULE-01-01).
  schemas:
    Phone:
      type: string
      pattern: '^[0-9]{10}$'
      description: CONFIRMED format — VO PhoneNumber 10 digits (05#4.1). May need locale review.
    OtpCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: CONFIRMED format — VO OtpCode 6 digits (05#4.1).
    AccountStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, LOCKED, DEACTIVATED]
      description: CONFIRMED (04 glossary AccountStatus).
    RoleCode:
      type: string
      enum: [SUPER_ADMIN, ORGANIZATION_ADMIN, STORE_MANAGER, RECEPTIONIST, VETERINARIAN, GROOMER, INVENTORY_STAFF, FINANCE_STAFF, CUSTOMER]
      description: CONFIRMED 9 canonical roles (RULE-02-02).
    RegisterRequest:
      type: object
      required: [phone, password, name]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
          description: Optional per ERD nullable (CONFIRMED).
        password:
          type: string
          description: Required (ERD password_hash NOT NULL CONFIRMED). Policy TBD Q5 — no constraints declared here by design.
        name:
          type: string
          description: ASSUMPTION A3 — ERD users.full_name NOT NULL but ops don't state collection step.
    RegisterResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    VerifyOtpRequest:
      type: object
      required: [phone, otpCode]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        otpCode:
          $ref: '#/components/schemas/OtpCode'
    VerifyOtpResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    ResendOtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
    ResendOtpResponse:
      type: object
      required: [accountId, status]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: ASSUMPTION A1 — phone or email (both UNIQUE in ERD; ops say only "Credentials").
        password:
          type: string
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, user]
      properties:
        accessToken:
          type: string
          description: CONFIRMED existence (RULE-01-01/02-04). Lifetime TBD Q4.
        refreshToken:
          type: string
          description: CONFIRMED existence (RULE-01-06/02-04). Lifetime/rotation TBD Q3/Q4.
        tokenType:
          type: string
          example: Bearer
          description: ASSUMPTION A2.
        user:
          type: object
          required: [userId, accountId, role, mustChangePassword]
          properties:
            userId:
              type: string
              format: uuid
            accountId:
              type: string
              format: uuid
            role:
              $ref: '#/components/schemas/RoleCode'
            mustChangePassword:
              type: boolean
              description: CONFIRMED need (RULE-01-03). Enforcement TBD Q6.
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: PROPOSED — identifies refresh to revoke per RULE-01-06; omit to revoke by access session.
    LogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    CreateStaffRequest:
      type: object
      required: [phone, password, name, role]
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
        password:
          type: string
          description: Temporary password (CONFIRMED D-04). Policy TBD Q5.
        name:
          type: string
          description: ASSUMPTION A3.
        role:
          $ref: '#/components/schemas/RoleCode'
        organizationId:
          type: string
          format: uuid
          description: Scope binding; required-matrix TBD Q9.
        storeId:
          type: string
          format: uuid
          description: Scope binding; required-matrix TBD Q9.
    CreateStaffResponse:
      type: object
      required: [accountId, userId, status, mustChangePassword]
      properties:
        accountId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AccountStatus'
        mustChangePassword:
          type: boolean
          example: true
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Only ACCESS_DENIED_SCOPE_MISMATCH is CONFIRMED (RULE-02-01); all other codes in ../auth-v1.md section C are PROPOSED.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
