# Pet Care Fee & Material-norm Config API v1 (tầng 3) — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module SP (mở rộng UC30) · owner BE-2
# Nguồn: 01 UC32; 08-tang3-be2-spec.md §A (BR-SP-08, 10, 11); 05 bổ sung shipping_fee_configs, service_material_norms
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Fee & Material-norm Config API v1 (tầng 3)"
  version: "1.0.0"
  description: "Module SP (mở rộng UC30) · owner BE-2. Nguồn: 01 UC32; 08-tang3-be2-spec.md §A (BR-SP-08, 10, 11); 05 bổ sung shipping_fee_configs, service_material_norms. Chi tiết và truy vết: ../fees-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: "Shipping fee"
    description: "Phí vận chuyển toàn chuỗi (UC32)"
  - name: "Material norms"
    description: "Định mức vật tư của dịch vụ (UC32)"
paths:
  "/shipping-fee-config":
    get:
      tags: ["Shipping fee"]
      summary: "Xem cấu hình phí vận chuyển"
      description: "UC32 · BR-SP-08. Actor: A04. Quyền: Chỉ SUPER_MANAGER. Chuyển trạng thái: —."
      operationId: getShippingFeeConfig
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/ShippingFeeConfig"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: ["Shipping fee"]
      summary: "Lưu cấu hình phí vận chuyển"
      description: "UC32 · BR-SP-08, 11. Actor: A04. Quyền: Chỉ SUPER_MANAGER. Chuyển trạng thái: —."
      operationId: saveShippingFeeConfig
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SaveShippingFeeConfigRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/ShippingFeeConfig"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-SP-08` số âm hoặc sai kiểu"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/services/{serviceId}/material-norms":
    get:
      tags: ["Material norms"]
      summary: "Xem định mức vật tư của dịch vụ"
      description: "UC32 · BR-SP-10. Actor: A04. Quyền: Chỉ SUPER_MANAGER. Chuyển trạng thái: —. Không phân trang (ít dòng)."
      operationId: listMaterialNorms
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialNorm"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: ["Material norms"]
      summary: "Lưu định mức vật tư của dịch vụ"
      description: "UC32 · BR-SP-10, 11. Actor: A04. Quyền: Chỉ SUPER_MANAGER. Chuyển trạng thái: —. Ghi đè toàn bộ; chỉ ảnh hưởng các lần thực hiện sau (BR-SP-10)."
      operationId: saveMaterialNorms
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ServiceId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SaveMaterialNormsRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MaterialNorm"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-SP-10` sản phẩm là vaccine / không tồn tại · số lượng < 1 · trùng sản phẩm"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, TOO_MANY_REQUESTS, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    ShippingFeeConfig:
      type: object
      required: [baseFee, freeThreshold, updatedAt]
      properties:
        baseFee:
          type: integer
          format: int64
          minimum: 0
          description: "Phí cơ bản (BR-SP-08)"
        freeThreshold:
          type: integer
          format: int64
          minimum: 0
          description: "0 = không miễn phí"
        updatedAt:
          type: string
          format: date-time
    SaveShippingFeeConfigRequest:
      type: object
      required: [baseFee, freeThreshold]
      properties:
        baseFee:
          type: integer
          format: int64
          minimum: 0
          description: VND
        freeThreshold:
          type: integer
          format: int64
          minimum: 0
          description: VND
    MaterialNorm:
      type: object
      required: [productId, productName, unit, quantity]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unit:
          type: string
        quantity:
          type: integer
          format: int32
    MaterialNormInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          description: "Số nguyên ≥ 1"
    SaveMaterialNormsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaterialNormInput"
          description: "Ghi đè toàn bộ danh sách; rỗng = xóa hết"
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
