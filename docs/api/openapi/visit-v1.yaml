components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PrescriptionItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VaccinationId:
      name: vaccinationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    VisitStatus:
      type: string
      enum: [WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
      description: "03 #4"
    PriorityClass:
      type: string
      enum: [EMERGENCY, APPOINTMENT, WALK_IN]
      description: "BR-TN-03, 04. Hạng trong hàng đợi; lễ tân sắp lại / xác định cấp cứu có thể đổi (A2, A3) — có lịch hẹn hay không xem `appointmentId`"
    CreateVisitRequest:
      type: object
      required: [petId]
      properties:
        petId:
          type: integer
          format: int64
        appointmentId:
          type: [integer, "null"]
          format: int64
          description: "Có = check-in lịch hẹn; không = walk-in"
        serviceId:
          type: [integer, "null"]
          format: int64
          description: "Bắt buộc với walk-in; có lịch hẹn thì lấy dịch vụ của lịch"
        isEmergency:
          type: [boolean, "null"]
          description: "Bắt buộc true khi tiếp nhận ngoài giờ (BR-CN-05)"
    Visit:
      type: object
      required: [visitId, code, branchId, customerId, customerName, petId, petName, species, serviceGroup, status, priorityClass, queueSortKey, needsReassign, orderId, checkedInAt]
      properties:
        visitId:
          type: integer
          format: int64
        code:
          type: string
        branchId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
          description: "Họ tên chủ tại thời điểm tiếp nhận"
        petId:
          type: integer
          format: int64
        petName:
          type: string
        species:
          type: string
          enum: [DOG, CAT, OTHER]
        appointmentId:
          type: [integer, "null"]
          format: int64
        serviceGroup:
          type: string
          enum: [MEDICAL, GROOMING]
        status:
          $ref: "#/components/schemas/VisitStatus"
        priorityClass:
          $ref: "#/components/schemas/PriorityClass"
        queueSortKey:
          type: string
          format: date-time
        assigneeId:
          type: [integer, "null"]
          format: int64
        assigneeName:
          type: [string, "null"]
        needsReassign:
          type: boolean
          description: "Người phụ trách bị khóa (BR-QT-11, BR-TN-08)"
        orderId:
          type: integer
          format: int64
        checkedInAt:
          type: string
          format: date-time
        calledAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        cancelReason:
          type: [string, "null"]
    AssignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: integer
          format: int64
          description: "VET cho MEDICAL, CARETAKER cho GROOMING (BR-TN-05)"
    AssignResult:
      type: object
      required: [visit, assigneeOffline]
      properties:
        visit:
          $ref: "#/components/schemas/Visit"
        assigneeOffline:
          type: boolean
          description: "true = đã cảnh báo người được gán đang offline, không chặn (BR-TN-06)"
    MoveVisitRequest:
      type: object
      required: [placeBeforeVisitId]
      properties:
        placeBeforeVisitId:
          type: integer
          format: int64
          description: "Visit WAITING cùng chi nhánh (A3)"
    ReassignRequest:
      type: object
      required: [assigneeId, reason]
      properties:
        assigneeId:
          type: integer
          format: int64
