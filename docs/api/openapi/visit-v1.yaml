        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/vaccinations/{vaccinationId}":
    delete:
      tags: [Vaccinations]
      summary: "Xóa mũi tiêm ghi nhầm"
      description: "UC49 · BR-KB-04. Actor: A07. Quyền: VET đã ghi mũi đó. Chuyển trạng thái: —. Hoàn kho đúng lô, xóa dòng Order vaccine trong cùng transaction."
      operationId: deleteVaccination
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/VaccinationId"
      responses:
        "204":
          description: "Không có nội dung"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Visit đã COMPLETED — sai sót ghi bằng bản bổ sung"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/pets/{petId}/health-record":
    get:
      tags: ["Health record"]
      summary: "Hồ sơ sức khỏe thú cưng"
      description: "UC25, UC53 · BR-KH-07, BR-KB-01, 04, 06. Actor: A02, A06, A07, A08. Quyền: Khách là chủ hiện tại; nhân viên. Chuyển trạng thái: —. Khách không nhận internalNote và bản bổ sung nội bộ. Chỉ mũi tiêm tại hệ thống."
      operationId: getPetHealthRecord
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PetId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/HealthRecord"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TK-19` hồ sơ còn chờ quyết định liên kết"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Không phải chủ hiện tại"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PrescriptionItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VaccinationId:
      name: vaccinationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    VisitStatus:
      type: string
      enum: [WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
      description: "03 #4"
    PriorityClass:
      type: string
      enum: [EMERGENCY, APPOINTMENT, WALK_IN]
      description: "BR-TN-03, 04"
    CreateVisitRequest:
      type: object
      required: [petId]
      properties:
        petId:
          type: integer
          format: int64
        appointmentId:
          type: [integer, "null"]
          format: int64
          description: "Có = check-in lịch hẹn; không = walk-in"
        serviceId:
          type: [integer, "null"]
          format: int64
          description: "Bắt buộc với walk-in; có lịch hẹn thì lấy dịch vụ của lịch"
        isEmergency:
          type: [boolean, "null"]
          description: "Bắt buộc true khi tiếp nhận ngoài giờ (BR-CN-05)"
    Visit:
      type: object
      required: [visitId, code, branchId, customerId, customerName, petId, petName, species, serviceGroup, status, priorityClass, queueSortKey, needsReassign, orderId, checkedInAt]
      properties:
        visitId:
          type: integer
          format: int64
        code:
          type: string
        branchId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        petId:
          type: integer
          format: int64
        petName:
          type: string
        species:
          type: string
          enum: [DOG, CAT, OTHER]
        appointmentId:
          type: [integer, "null"]
          format: int64
        serviceGroup:
          type: string
          enum: [MEDICAL, GROOMING]
        status:
          $ref: "#/components/schemas/VisitStatus"
        priorityClass:
          $ref: "#/components/schemas/PriorityClass"
        queueSortKey:
          type: string
          format: date-time
        assigneeId:
          type: [integer, "null"]
          format: int64
        assigneeName:
          type: [string, "null"]
        needsReassign:
          type: boolean
          description: "Người phụ trách bị khóa (BR-QT-11, BR-TN-08)"
        orderId:
          type: integer
          format: int64
        checkedInAt:
          type: string
          format: date-time
        calledAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        cancelReason:
          type: [string, "null"]
    AssignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: integer
          format: int64
          description: "VET cho MEDICAL, CARETAKER cho GROOMING (BR-TN-05)"
    AssignResult:
      type: object
      required: [visit, assigneeOffline]
      properties:
        visit:
          $ref: "#/components/schemas/Visit"
        assigneeOffline:
          type: boolean
          description: "true = đã cảnh báo người được gán đang offline, không chặn (BR-TN-06)"
    MoveVisitRequest:
      type: object
      required: [placeBeforeVisitId]
      properties:
        placeBeforeVisitId:
          type: integer
          format: int64
          description: "Visit WAITING cùng chi nhánh (A3)"
    ReassignRequest:
      type: object
      required: [assigneeId, reason]
      properties:
        assigneeId:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 300
          description: "Bắt buộc (BR-TN-08)"
    CancelVisitRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 300
    PrescriptionItem:
      type: object
      required: [itemId, productId, productName, quantity, dosageInstructions, isExternalPurchase]
      properties:
        itemId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
          format: int32
        dosageInstructions:
          type: string
          maxLength: 500
        isExternalPurchase:
          type: boolean
          description: "Mua ngoài: vẫn in trên đơn, không sinh dòng Order"
        externalReason:
          type: [string, "null"]
          enum: [OUT_OF_STOCK_AT_PRESCRIBE, OUT_OF_STOCK_AT_PAYMENT, null]
        orderLineId:
          type: [integer, "null"]
          format: int64
    Addendum:
      type: object
      required: [addendumId, content, isInternal, createdBy, createdByName, createdAt]
      properties:
        addendumId:
          type: integer
          format: int64
        content:
          type: string
        isInternal:
          type: boolean
        createdBy:
          type: integer
          format: int64
        createdByName:
          type: string
        createdAt:
          type: string
          format: date-time
    VaccinationRecord:
      type: object
      required: [vaccinationId, visitId, branchId, vaccineTypeId, vaccineTypeName, protocolId, doseNumber, productId, productName, administeredOn, nextDueDate, superseded, recordedBy, orderLineId]
      properties:
        vaccinationId:
          type: integer
          format: int64
        visitId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        vaccineTypeId:
          type: integer
          format: int64
        vaccineTypeName:
          type: string
        protocolId:
          type: integer
          format: int64
        doseNumber:
          type: integer
          format: int32
        productId:
          type: integer
          format: int64
        productName:
          type: string
        lotNumber:
          type: [string, "null"]
        expiryDate:
          type: [string, "null"]
          format: date
        administeredOn:
          type: string
          format: date
        nextDueDate:
          type: string
          format: date
          description: "= ngày tiêm + khoảng cách của mũi trong phác đồ (BR-KB-04)"
        superseded:
          type: boolean
          description: "Đã có mũi mới hơn cùng loại vaccine (BR-TB-03)"
        recordedBy:
          type: integer
          format: int64
        orderLineId:
          type: integer
          format: int64
    MedicalRecord:
      type: object
      required: [visitId, locked, prescriptions, vaccinations, addenda]
      properties:
        visitId:
          type: integer
          format: int64
        examination:
          type: [string, "null"]
        diagnosis:
          type: [string, "null"]
        treatmentPlan:
          type: [string, "null"]
        internalNote:
          type: [string, "null"]
          description: "Chỉ nhân viên"
        followUpDate:
          type: [string, "null"]
          format: date
        locked:
          type: boolean
          description: "Visit COMPLETED: chỉ thêm bản bổ sung (BR-KB-01)"
        lastEditedBy:
          type: [integer, "null"]
          format: int64
        prescriptions:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        vaccinations:
          type: array
          items:
            $ref: "#/components/schemas/VaccinationRecord"
        addenda:
          type: array
          items:
            $ref: "#/components/schemas/Addendum"
    UpdateMedicalRecordRequest:
      type: object
      properties:
        examination:
          type: [string, "null"]
          description: "Gồm tiền sử tiêm do chủ khai (04 nguyên tắc 9)"
        diagnosis:
          type: [string, "null"]
        treatmentPlan:
          type: [string, "null"]
        internalNote:
          type: [string, "null"]
        followUpDate:
          type: [string, "null"]
          format: date
          description: "Sau ngày khám, xa nhất 180 ngày [CFG] (BR-KB-06)"
    RecordWeightRequest:
      type: object
      required: [weightKg]
      properties:
        weightKg:
          type: number
          description: "> 0 (BR-KH-04)"
    WeightRecordRef:
      type: object
      required: [weightRecordId, weightKg, measuredAt]
      properties:
        weightRecordId:
          type: integer
          format: int64
        weightKg:
          type: number
        measuredAt:
          type: string
          format: date-time
    AddendumRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        isInternal:
          type: [boolean, "null"]
          description: "Bổ sung cho ghi chú nội bộ, khách không thấy"
    AddPrescriptionRequest:
      type: object
      required: [productId, quantity, dosageInstructions]
      properties:
        productId:
          type: integer
          format: int64
          description: "Thuốc kê đơn (BR-KB-03, BR-SP-01)"
        quantity:
          type: integer
          format: int32
          description: "> 0"
        dosageInstructions:
          type: string
          maxLength: 500
        shortageResolution:
          type: [string, "null"]
          enum: [REDUCE_TO_AVAILABLE, EXTERNAL_PURCHASE, null]
          description: "Chỉ gửi khi lần trước bị từ chối vì thiếu tồn (A5)"
    VaccineProductOption:
      type: object
      required: [productId, name, availableQuantity]
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        availableQuantity:
          type: integer
          format: int32
    VaccinationOptions:
      type: object
      required: [vaccineTypeId, protocol, products, underMinAge]
      properties:
        vaccineTypeId:
          type: integer
          format: int64
        protocol:
          type: array
          items:
            $ref: "#/components/schemas/ProtocolDoseOption"
          description: "Các mũi trong phác đồ của loài"
        suggestedProtocolId:
          type: [integer, "null"]
          format: int64
          description: "Gợi ý theo lịch sử tiêm cùng loại tại hệ thống, chỉ tham khảo (BR-KB-04)"
        lastDose:
          $ref: "#/components/schemas/VaccinationRecord"
        products:
          type: array
          items:
            $ref: "#/components/schemas/VaccineProductOption"
          description: "Chỉ sản phẩm thuộc loại còn tồn khả dụng tại chi nhánh"
        underMinAge:
          type: boolean
          description: "Thú chưa đủ tuổi tối thiểu của mũi gợi ý — cảnh báo, không chặn"
    ProtocolDoseOption:
      type: object
      required: [protocolId, doseNumber, intervalDays, minAgeWeeks, requiredForBoarding]
      properties:
        protocolId:
          type: integer
          format: int64
        doseNumber:
          type: integer
          format: int32
        intervalDays:
          type: integer
          format: int32
        minAgeWeeks:
          type: integer
          format: int32
        requiredForBoarding:
          type: boolean
    RecordVaccinationRequest:
      type: object
      required: [vaccineTypeId, protocolId, productId]
      properties:
        vaccineTypeId:
          type: integer
          format: int64
        protocolId:
          type: integer
          format: int64
          description: "Mũi VET chọn, có thể khác gợi ý"
        productId:
          type: integer
          format: int64
          description: "Vaccine thuộc loại đã chọn, còn tồn khả dụng"
    RecordVaccinationResult:
      type: object
      required: [vaccination, warnings]
      properties:
        vaccination:
          $ref: "#/components/schemas/VaccinationRecord"
        warnings:
          type: array
          items:
            type: string
          description: "Ví dụ UNDER_MIN_AGE"
    HealthVisitEntry:
      type: object
      required: [visitId, visitDate, branchName, serviceGroup, prescriptions, addenda]
      properties:
        visitId:
          type: integer
          format: int64
        visitDate:
          type: string
          format: date
        branchName:
          type: string
        serviceGroup:
          type: string
          enum: [MEDICAL, GROOMING]
        examination:
          type: [string, "null"]
        diagnosis:
          type: [string, "null"]
        treatmentPlan:
          type: [string, "null"]
        internalNote:
          type: [string, "null"]
          description: "Chỉ trả cho nhân viên"
        followUpDate:
          type: [string, "null"]
          format: date
        prescriptions:
          type: array
          items:
            $ref: "#/components/schemas/PrescriptionItem"
        addenda:
          type: array
          items:
            $ref: "#/components/schemas/Addendum"
          description: "Khách không thấy bản isInternal"
    UpcomingVaccination:
      type: object
      required: [vaccineTypeId, vaccineTypeName, nextDueDate]
      properties:
        vaccineTypeId:
          type: integer
          format: int64
        vaccineTypeName:
          type: string
        nextDueDate:
          type: string
          format: date
    HealthRecord:
      type: object
      required: [petId, visits, vaccinations, upcomingVaccinations]
      properties:
        petId:
          type: integer
          format: int64
        visits:
          type: array
          items:
            $ref: "#/components/schemas/HealthVisitEntry"
        vaccinations:
          type: array
