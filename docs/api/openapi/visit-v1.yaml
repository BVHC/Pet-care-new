# Pet Care Visit & Clinical API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module TN, KB · owner BE-1
# Nguồn: 01 UC25, UC44–UC49, UC52, UC53; 02 BR-TN-01…09, BR-KB-01…06, BR-KH-04, 05, 07, BR-CN-05, BR-BH-02; 03 #4 Visit (+ Lịch hẹn#3, #7, #8, Order#1, #4, #6, Care Task#5, #6); 04 §6; 05 §6 (visits, visit_assignments, medical_records, medical_record_addenda, prescription_items, vaccinations)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Visit & Clinical API v1"
  version: "1.0.0"
  description: "Module TN, KB · owner BE-1. Nguồn: 01 UC25, UC44–UC49, UC52, UC53; 02 BR-TN-01…09, BR-KB-01…06, BR-KH-04, 05, 07, BR-CN-05, BR-BH-02; 03 #4 Visit (+ Lịch hẹn#3, #7, #8, Order#1, #4, #6, Care Task#5, #6); 04 §6; 05 §6 (visits, visit_assignments, medical_records, medical_record_addenda, prescription_items, vaccinations). Chi tiết và truy vết: ../visit-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Queue
    description: "Tiếp nhận và hàng đợi (UC44–UC47)"
  - name: Completion
    description: "Hoàn tất, hủy lượt (UC45, UC48, UC49, UC52)"
  - name: "Medical record"
    description: "Bệnh án, cân nặng, bản bổ sung (UC48, UC53)"
  - name: Prescriptions
    description: "Kê đơn (UC48, BR-KB-03)"
  - name: Vaccinations
    description: "Tiêm chủng (UC49, BR-KB-04)"
  - name: "Health record"
    description: "Hồ sơ sức khỏe thú cưng (UC25, UC53)"
paths:
  "/visits":
    post:
      tags: [Queue]
      summary: "Tiếp nhận (check-in lịch hẹn / walk-in / cấp cứu)"
      description: "UC44, UC47 · BR-TN-01…04, BR-CN-05, BR-LH-01, BR-KH-05. Actor: A06. Quyền: Lễ tân; chi nhánh của lễ tân. Chuyển trạng thái: — → WAITING (Visit#1) · Lịch hẹn#3 · Order#1 (OPEN + dòng dịch vụ tự sinh) · có dịch vụ Khám → Care Task#6. Trễ quá `visit.late_priority_minutes` (15 phút) [CFG] xếp như walk-in. A9, A10, A11, A12. Thứ tự lỗi: 404 → 400 → 409 (docs/adr/0059). Có dịch vụ Khám: Care Task#6 chưa nối, nối khi visit cài FollowUpApi. Khách mang nhiều thú thì tạo nhiều Visit."
      operationId: checkInVisit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateVisitRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-01` walk-in thiếu dịch vụ / thú không khớp lịch hẹn / thú đã mất · `BR-TN-02` lịch hẹn của chi nhánh khác hoặc ngoài cửa sổ check-in · `BR-CN-01` chi nhánh chưa ACTIVE · `BR-CN-05` ngoài giờ mà chi nhánh không có cờ hoặc chưa đánh dấu cấp cứu · `BR-LH-01` walk-in: dịch vụ đã ngừng, đang tắt tại chi nhánh hoặc không thuộc MEDICAL / GROOMING; có lịch: dịch vụ đã ngừng kinh doanh · body sai (`VALIDATION_FAILED`, `MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lịch hẹn không còn BOOKED (đã check-in / NO_SHOW: tiếp nhận như walk-in, BR-TN-03)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Queue]
      summary: "Hàng đợi của chi nhánh"
      description: "UC45 · BR-TN-04, 09. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. A1, A13."
      operationId: listQueue
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "Ngày check-in (giờ Việt Nam). Không gửi: lượt chưa kết thúc của mọi ngày; với status COMPLETED / CANCELLED là hôm nay (A1)"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: serviceGroup
          in: query
          required: false
          schema:
            type: string
            enum: [MEDICAL, GROOMING]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: needsReassign
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Tham số sai kiểu (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/me/queue":
    get:
      tags: [Queue]
      summary: "Hàng đợi của tôi"
      description: "UC46 · BR-TN-05. Actor: A07, A08. Quyền: VET, CARETAKER. Chuyển trạng thái: —. Visit WAITING / IN_PROGRESS gán cho tôi."
      operationId: listMyQueue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: BR-TK-17
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/visits/{visitId}":
    get:
      tags: [Queue]
      summary: "Chi tiết lượt"
      description: "UC45, UC46 · —. Actor: A04–A08. Quyền: Nhân viên chi nhánh; SUPER_MANAGER toàn chuỗi. Chuyển trạng thái: —. A13, A14."
      operationId: getVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Tham số sai kiểu (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · nhân viên xem lượt của chi nhánh khác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  "/visits/{visitId}/assign":
    post:
      tags: [Queue]
      summary: "Gán / gán lại nhân viên (lượt chưa gọi)"
      description: "UC45 · BR-TN-05, 06, 08. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: WAITING → WAITING (Visit#2). Dòng dịch vụ tự sinh và các dòng người được gán cũ đã thêm chuyển quyền cho người được gán (docs/adr/0061). Gán đúng người đang được gán: 200, không ghi gì."
      operationId: assignVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/AssignResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-05` nhân viên không ACTIVE, khác chi nhánh hoặc sai chức vụ · body sai (`VALIDATION_FAILED`, `MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt đã được gọi"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/move":
    post:
      tags: [Queue]
      summary: "Sắp lại thứ tự hàng đợi"
      description: "UC45 · BR-TN-04. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: —. A3. Trả hàng đợi sau khi sắp."
      operationId: moveVisitInQueue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MoveVisitRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-04` lượt đích là chính lượt này, thuộc chi nhánh khác, hoặc sắp vượt ranh giới ca cấp cứu · body sai (`VALIDATION_FAILED`, `MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Không có lượt hoặc lượt đích"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Lượt hoặc lượt đích không còn WAITING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/mark-emergency":
    post:
      tags: [Queue]
      summary: "Xác định ca cấp cứu"
      description: "UC47 · BR-TN-04. Actor: A06, A07. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. Lượt lên đầu hàng đợi (A2)."
      operationId: markVisitEmergency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Tham số sai kiểu (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt đã được gọi hoặc đã là cấp cứu"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/call":
    post:
      tags: [Queue]
      summary: "Gọi lượt"
      description: "UC46 · BR-TN-05, 09. Actor: A07, A08. Quyền: Người được gán lượt. Chuyển trạng thái: WAITING → IN_PROGRESS (Visit#3). Người gọi được kiểm lại dưới khóa tài khoản của chính mình (docs/adr/0062)."
      operationId: callVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-05` người gọi không còn hoạt động tại chi nhánh hoặc sai chức vụ với nhóm dịch vụ (đổi chức vụ sau khi được gán) · tham số sai kiểu (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác · lượt không gán cho người gọi, kể cả lượt chưa gán (BR-TN-05, 09)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không còn WAITING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/reassign":
    post:
      tags: [Queue]
      summary: "Gán lại lượt đã gọi"
      description: "UC45 · BR-TN-05, 08, BR-QT-15. Actor: A05 (A04 khi chi nhánh không còn BRANCH_MANAGER ACTIVE). Quyền: BRANCH_MANAGER chi nhánh; SUPER_MANAGER theo điều kiện. Chuyển trạng thái: IN_PROGRESS → IN_PROGRESS (Visit#4). A15. Thứ tự lỗi: 404 → 403 → 409 → 400 (docs/adr/0063). Gỡ cờ needsReassign. Bệnh án giữ nguyên kèm tên người ghi; quyền xóa dòng Order người cũ đã thêm chuyển cho người mới; ghi audit."
      operationId: reassignCalledVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReassignRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-08` người phụ trách hiện tại vẫn đủ điều kiện (A15) · `BR-TN-05` người mới không ACTIVE, khác chi nhánh hoặc sai chức vụ · thiếu lý do / body sai (`VALIDATION_FAILED`, `MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · BRANCH_MANAGER của chi nhánh khác · SUPER_MANAGER khi chi nhánh còn BRANCH_MANAGER hoạt động"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS · lượt vừa được gán lại bởi thao tác khác (`CONCURRENCY_CONFLICT`)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/complete":
    post:
      tags: [Completion]
      summary: "Hoàn tất lượt"
      description: "UC48, UC49, UC52 · BR-KB-01, 02, BR-SP-06, BR-LH-11. Actor: A07, A08. Quyền: Người được gán lượt. Chuyển trạng thái: IN_PROGRESS → COMPLETED (Visit#5) · Lịch hẹn#7 · Order#4 (→ PENDING) · bệnh án khóa. A16. Thứ tự lỗi: 403 vai trò → 404 → 403 chi nhánh → 403 người phụ trách → 400 BR-TN-05 → 409 → 400 BR-KB-02 (docs/adr/0069). Gỡ cờ needsReassign. Lỗi BR-KB-02 hoàn tác cả lịch hẹn, Order và bệnh án."
      operationId: completeVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KB-02` có dịch vụ loại Khám mà chưa có chẩn đoán · chỉ có dịch vụ loại Tiêm mà chưa ghi mũi nào · lượt Khám/Tiêm không còn dịch vụ Khám hoặc Tiêm nào (A16) · `BR-TN-05` chức vụ hiện tại không phụ trách được nhóm dịch vụ của lượt (đổi chức vụ sau khi được gán) · tham số sai kiểu (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác · không phải người phụ trách hiện tại, kể cả lượt chưa gán"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/cancel":
    post:
      tags: [Completion]
      summary: "Hủy lượt khách bỏ về"
      description: "UC45 · BR-TN-07. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: WAITING → CANCELLED (Visit#6) · Lịch hẹn#8 · Order#6. Lịch hẹn → CANCELLED, không tính hủy muộn. Không gửi body: hủy không lý do (A4)."
      operationId: cancelVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CancelVisitRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Lý do quá 300 ký tự (`VALIDATION_FAILED`) · body / tham số sai (`MALFORMED_REQUEST`); BR-TK-17"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Sai vai trò · lượt của chi nhánh khác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
