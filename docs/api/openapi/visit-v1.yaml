# Pet Care Visit & Clinical API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module TN, KB · owner BE-1
# Nguồn: 01 UC25, UC44–UC49, UC52, UC53; 02 BR-TN-01…09, BR-KB-01…06, BR-KH-04, 05, 07, BR-CN-05, BR-BH-02; 03 #4 Visit (+ Lịch hẹn#3, #7, #8, Order#1, #4, #6, Care Task#5, #6); 04 §6; 05 §6 (visits, visit_assignments, medical_records, medical_record_addenda, prescription_items, vaccinations)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Visit & Clinical API v1"
  version: "1.0.0"
  description: "Module TN, KB · owner BE-1. Nguồn: 01 UC25, UC44–UC49, UC52, UC53; 02 BR-TN-01…09, BR-KB-01…06, BR-KH-04, 05, 07, BR-CN-05, BR-BH-02; 03 #4 Visit (+ Lịch hẹn#3, #7, #8, Order#1, #4, #6, Care Task#5, #6); 04 §6; 05 §6 (visits, visit_assignments, medical_records, medical_record_addenda, prescription_items, vaccinations). Chi tiết và truy vết: ../visit-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Queue
    description: "Tiếp nhận và hàng đợi (UC44–UC47)"
  - name: Completion
    description: "Hoàn tất, hủy lượt (UC45, UC48, UC49, UC52)"
  - name: "Medical record"
    description: "Bệnh án, cân nặng, bản bổ sung (UC48, UC53)"
  - name: Prescriptions
    description: "Kê đơn (UC48, BR-KB-03)"
  - name: Vaccinations
    description: "Tiêm chủng (UC49, BR-KB-04)"
  - name: "Health record"
    description: "Hồ sơ sức khỏe thú cưng (UC25, UC53)"
paths:
  "/visits":
    post:
      tags: [Queue]
      summary: "Tiếp nhận (check-in lịch hẹn / walk-in / cấp cứu)"
      description: "UC44, UC47 · BR-TN-01…04, BR-CN-05, BR-LH-01, BR-KH-05. Actor: A06. Quyền: Lễ tân; chi nhánh của lễ tân. Chuyển trạng thái: — → WAITING (Visit#1) · Lịch hẹn#3 · Order#1 (OPEN + dòng dịch vụ tự sinh) · có dịch vụ Khám → Care Task#6. Trễ 15–30 phút [CFG] xếp như walk-in. Khách mang nhiều thú thì tạo nhiều Visit."
      operationId: checkInVisit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateVisitRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-01` thú đã mất / walk-in thiếu dịch vụ · `BR-TN-02` ngoài cửa sổ check-in · `BR-CN-05` ngoài giờ mà chi nhánh không có cờ hoặc chưa đánh dấu cấp cứu · `BR-CN-01` chi nhánh chưa ACTIVE · `BR-LH-01` dịch vụ đang tắt"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lịch hẹn không còn BOOKED (đã check-in / NO_SHOW: tiếp nhận như walk-in, BR-TN-03)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Queue]
      summary: "Hàng đợi của chi nhánh"
      description: "UC45 · BR-TN-04, 09. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. A1."
      operationId: listQueue
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "Mặc định hôm nay"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [WAITING, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: serviceGroup
          in: query
          required: false
          schema:
            type: string
            enum: [MEDICAL, GROOMING]
        - name: assigneeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: needsReassign
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/me/queue":
    get:
      tags: [Queue]
      summary: "Hàng đợi của tôi"
      description: "UC46 · BR-TN-05. Actor: A07, A08. Quyền: VET, CARETAKER. Chuyển trạng thái: —. Visit WAITING / IN_PROGRESS gán cho tôi."
      operationId: listMyQueue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/visits/{visitId}":
    get:
      tags: [Queue]
      summary: "Chi tiết lượt"
      description: "UC45, UC46 · —. Actor: A05–A08. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —."
      operationId: getVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/visits/{visitId}/assign":
    post:
      tags: [Queue]
      summary: "Gán / gán lại nhân viên (lượt chưa gọi)"
      description: "UC45 · BR-TN-05, 06, 08. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: WAITING → WAITING (Visit#2). Dòng dịch vụ tự sinh chuyển quyền cho người được gán."
      operationId: assignVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AssignRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/AssignResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-05` nhân viên không ACTIVE, khác chi nhánh hoặc sai chức vụ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt đã được gọi"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/move":
    post:
      tags: [Queue]
      summary: "Sắp lại thứ tự hàng đợi"
      description: "UC45 · BR-TN-04. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: —. A3. Trả hàng đợi sau khi sắp."
      operationId: moveVisitInQueue
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MoveVisitRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt đã được gọi"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/mark-emergency":
    post:
      tags: [Queue]
      summary: "Xác định ca cấp cứu"
      description: "UC47 · BR-TN-04. Actor: A06, A07. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. Lượt lên đầu hàng đợi (A2)."
      operationId: markVisitEmergency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt đã được gọi hoặc đã là cấp cứu"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/call":
    post:
      tags: [Queue]
      summary: "Gọi lượt"
      description: "UC46 · BR-TN-05, 09. Actor: A07, A08. Quyền: Người được gán lượt. Chuyển trạng thái: WAITING → IN_PROGRESS (Visit#3)."
      operationId: callVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`BR-TN-05` lượt không gán cho người gọi"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không còn WAITING"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/reassign":
    post:
      tags: [Queue]
      summary: "Gán lại lượt đã gọi"
      description: "UC45 · BR-TN-05, 08, BR-QT-15. Actor: A05 (A04 khi chi nhánh không còn BRANCH_MANAGER ACTIVE). Quyền: BRANCH_MANAGER chi nhánh; SUPER_MANAGER theo điều kiện. Chuyển trạng thái: IN_PROGRESS → IN_PROGRESS (Visit#4). Bệnh án giữ nguyên kèm tên người ghi; quyền xóa dòng Order chuyển cho người mới; ghi audit."
      operationId: reassignCalledVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReassignRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-TN-08` người phụ trách vẫn ACTIVE · thiếu lý do · `BR-TN-05` người mới sai chức vụ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/complete":
    post:
      tags: [Completion]
      summary: "Hoàn tất lượt"
      description: "UC48, UC49, UC52 · BR-KB-01, 02, BR-SP-06, BR-LH-11. Actor: A07, A08. Quyền: Người được gán lượt. Chuyển trạng thái: IN_PROGRESS → COMPLETED (Visit#5) · Lịch hẹn#7 · Order#4 (→ PENDING) · bệnh án khóa."
      operationId: completeVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KB-02` có dịch vụ loại Khám mà chưa có chẩn đoán · chỉ có dịch vụ loại Tiêm mà chưa ghi mũi nào"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/cancel":
    post:
      tags: [Completion]
      summary: "Hủy lượt khách bỏ về"
      description: "UC45 · BR-TN-07. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: WAITING → CANCELLED (Visit#6) · Lịch hẹn#8 · Order#6. Lịch hẹn → CANCELLED, không tính hủy muộn."
      operationId: cancelVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CancelVisitRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Visit"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`BR-TN-07` lượt đã được gọi — nhân viên hoàn tất theo BR-KB-02"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/medical-record":
    get:
      tags: ["Medical record"]
      summary: "Xem bệnh án của lượt"
      description: "UC48, UC53 · BR-KB-01. Actor: A07, A08. Quyền: VET, CARETAKER chi nhánh (CARETAKER chỉ xem). Chuyển trạng thái: —."
      operationId: getMedicalRecord
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/MedicalRecord"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Không có Visit hoặc Visit nhóm GROOMING (không có bệnh án)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: ["Medical record"]
      summary: "Ghi bệnh án / hẹn tái khám"
      description: "UC48 · BR-KB-01, 06. Actor: A07. Quyền: VET được gán lượt. Chuyển trạng thái: —."
      operationId: updateMedicalRecord
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateMedicalRecordRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/MedicalRecord"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KB-06` ngày tái khám không sau ngày khám hoặc quá 180 ngày [CFG]"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS — bệnh án đã khóa, dùng bản bổ sung"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/weight":
    post:
      tags: ["Medical record"]
      summary: "Ghi cân nặng khi khám"
      description: "UC48 · BR-KH-04. Actor: A07. Quyền: VET được gán lượt. Chuyển trạng thái: —. source = VET (A8)."
      operationId: recordVisitWeight
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RecordWeightRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/WeightRecordRef"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/visits/{visitId}/medical-record/addenda":
    post:
      tags: ["Medical record"]
      summary: "Thêm bản bổ sung bệnh án"
      description: "UC53 · BR-KB-01, BR-QT-15. Actor: A07. Quyền: VET chi nhánh nơi khám (A7). Chuyển trạng thái: —. Không sửa / xóa nội dung cũ; ghi audit."
      operationId: addMedicalRecordAddendum
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/AddendumRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Addendum"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
