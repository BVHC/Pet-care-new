      operationId: removePrescriptionItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VisitId"
        - $ref: "#/components/parameters/PrescriptionItemId"
      responses:
        "204":
          description: "Không có nội dung"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Lượt không IN_PROGRESS"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
