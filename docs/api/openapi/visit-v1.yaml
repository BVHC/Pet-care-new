        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/visits/{visitId}/vaccinations":
    post:
      tags: [Vaccinations]
      summary: "Ghi nhận mũi tiêm"
      description: "UC49, ST06 · BR-KB-04, BR-KO-05, BR-TB-03. Actor: A07. Quyền: VET được gán lượt. Chuyển trạng thái: IN_PROGRESS giữ nguyên · dòng Order VACCINE · trừ kho FEFO · Care Task#5. Ngày tiêm = hôm nay (A6). Chưa đủ tuổi: cảnh báo trong warnings, không chặn."
      operationId: recordVaccination
