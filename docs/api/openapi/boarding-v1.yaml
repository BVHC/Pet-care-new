components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    KennelId:
      name: kennelId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BranchId:
      name: branchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CareLogId:
      name: careLogId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    KennelStatus:
      type: string
      enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
      description: "03 #7"
    BookingStatus:
      type: string
      enum: [BOOKED, CHECKED_IN, OVERDUE, CHECKED_OUT, CANCELLED, NO_SHOW]
      description: "03 #6"
    Kennel:
      type: object
      required: [kennelId, branchId, kennelTypeId, kennelTypeName, code, status]
      properties:
        kennelId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        kennelTypeId:
          type: integer
          format: int64
        kennelTypeName:
          type: string
        code:
          type: string
          maxLength: 20
        status:
          $ref: "#/components/schemas/KennelStatus"
        note:
          type: [string, "null"]
          maxLength: 300
        currentBookingId:
          type: [integer, "null"]
          format: int64
          description: "Khi OCCUPIED"
    CreateKennelRequest:
      type: object
      required: [kennelTypeId, code]
      properties:
        kennelTypeId:
          type: integer
          format: int64
          description: "Loại chuồng đang bật tại chi nhánh"
        code:
          type: string
          maxLength: 20
          description: "Duy nhất trong chi nhánh (BR-LT-01)"
        note:
          type: [string, "null"]
          maxLength: 300
    UpdateKennelRequest:
      type: object
      properties:
        code:
          type: [string, "null"]
          maxLength: 20
        note:
          type: [string, "null"]
          maxLength: 300
    AffectedBookingBrief:
      type: object
      required: [bookingId, code, checkInDate, checkOutDate, petName]
      properties:
        bookingId:
          type: integer
          format: int64
        code:
          type: string
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        petName:
          type: string
    MaintenanceResult:
      type: object
      required: [kennel, shortageBookings]
      properties:
        kennel:
          $ref: "#/components/schemas/Kennel"
        shortageBookings:
          type: array
          items:
            $ref: "#/components/schemas/AffectedBookingBrief"
          description: "Đặt chỗ thiếu chỗ sau khi giảm sức chứa — cảnh báo, không tự hủy (BR-LT-01)"
    NightAvailability:
      type: object
      required: [date, capacity, occupied, remaining]
      properties:
        date:
          type: string
          format: date
        capacity:
          type: integer
          format: int32
        occupied:
          type: integer
          format: int32
        remaining:
          type: integer
          format: int32
    BoardingAvailability:
      type: object
      required: [kennelTypeId, nightlyPrice, nights, available]
      properties:
        kennelTypeId:
          type: integer
          format: int64
        nightlyPrice:
          type: integer
          format: int64
          minimum: 0
          description: VND
        nights:
          type: array
          items:
            $ref: "#/components/schemas/NightAvailability"
        available:
          type: boolean
          description: "Mọi đêm còn chỗ"
    VaccineGap:
      type: object
      required: [vaccineTypeId, vaccineTypeName]
      properties:
        vaccineTypeId:
          type: integer
          format: int64
        vaccineTypeName:
          type: string
        lastAdministeredOn:
          type: [string, "null"]
          format: date
          description: "null = chưa từng tiêm tại hệ thống"
        nextDueDate:
          type: [string, "null"]
          format: date
    CreateBookingRequest:
      type: object
      required: [petId, branchId, kennelTypeId, checkInDate, checkOutDate]
      properties:
        petId:
          type: integer
          format: int64
        branchId:
          type: integer
          format: int64
        kennelTypeId:
          type: integer
          format: int64
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
    Booking:
      type: object
      required: [bookingId, code, customerId, customerName, petId, petName, branchId, kennelTypeId, kennelTypeName, checkInDate, checkOutDate, nightlyPrice, status, channel, lateCancel, missingCareLogToday]
      properties:
        bookingId:
          type: integer
          format: int64
        code:
          type: string
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        petId:
          type: integer
          format: int64
        petName:
          type: string
        branchId:
          type: integer
          format: int64
        kennelTypeId:
          type: integer
          format: int64
        kennelTypeName:
          type: string
        kennelId:
          type: [integer, "null"]
          format: int64
        kennelCode:
          type: [string, "null"]
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
          description: "Ngày trả dự kiến"
        actualCheckInAt:
          type: [string, "null"]
          format: date-time
        actualCheckOutAt:
          type: [string, "null"]
          format: date-time
        nightlyPrice:
          type: integer
          format: int64
          minimum: 0
          description: "Snapshot lúc đặt (BR-LT-02)"
        status:
          $ref: "#/components/schemas/BookingStatus"
        endReason:
          type: [string, "null"]
          enum: [RETURNED, PET_DECEASED, null]
        channel:
          type: string
          enum: [ONLINE, COUNTER]
        lateCancel:
          type: boolean
        cancelSource:
          type: [string, "null"]
          enum: [CUSTOMER, STAFF, CLINIC, null]
        cancelReason:
          type: [string, "null"]
        overdueSince:
          type: [string, "null"]
          format: date-time
        activeOrderId:
          type: [integer, "null"]
          format: int64
          description: "Order BOARDING OPEN/PENDING nếu có"
        missingCareLogToday:
          type: boolean
          description: "Đang lưu trú mà hôm nay chưa có nhật ký (BR-LT-11)"
    BookingResult:
      type: object
      required: [booking, vaccineWarnings]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        vaccineWarnings:
          type: array
          items:
            $ref: "#/components/schemas/VaccineGap"
          description: "Dự kiến chưa đạt mũi bắt buộc vào ngày nhận — cảnh báo, gợi ý đặt lịch tiêm (BR-LT-05)"
    ExtendBookingRequest:
      type: object
      required: [checkOutDate]
      properties:
        checkOutDate:
          type: string
          format: date
          description: "Sau ngày trả hiện tại, tổng ≤ 30 đêm [CFG]"
    CancelBookingRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 300
    CheckInReadiness:
      type: object
      required: [vaccineGaps, availableKennels, withinOpeningHours, canCheckIn]
      properties:
        vaccineGaps:
          type: array
          items:
            $ref: "#/components/schemas/VaccineGap"
          description: "Rỗng mới nhận được (BR-LT-05)"
        availableKennels:
          type: array
          items:
            $ref: "#/components/schemas/Kennel"
          description: "Chuồng AVAILABLE đúng loại đã đặt"
        withinOpeningHours:
          type: boolean
        canCheckIn:
          type: boolean
    CheckInRequest:
      type: object
      required: [kennelId, weightKg, healthCondition, emergencyPhone]
      properties:
        kennelId:
          type: integer
          format: int64
          description: "AVAILABLE, đúng loại đã đặt (BR-LT-08)"
        weightKg:
          type: number
          description: "> 0, bắt buộc"
        healthCondition:
          type: string
          description: "Tình trạng quan sát được"
        belongings:
          type: [string, "null"]
        dietInstructions:
          type: [string, "null"]
        emergencyPhone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
          description: "SĐT liên hệ khẩn, dùng cho Care Task quá hạn đón (BR-TB-05)"
    CheckoutStarted:
      type: object
      required: [booking, orderId, nights, amount]
      properties:
        booking:
          $ref: "#/components/schemas/Booking"
        orderId:
          type: integer
          format: int64
        nights:
          type: integer
          format: int32
          description: "Tối thiểu 1; trả sau 12:00 [CFG] +1 đêm"
        amount:
          type: integer
          format: int64
          minimum: 0
          description: VND
    DeceasedEndRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          description: "Ghi rõ diễn biến (BR-LT-12)"
    CareLogAddendum:
      type: object
      required: [addendumId, content, createdBy, createdAt]
      properties:
        addendumId:
          type: integer
          format: int64
        content:
          type: string
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CareLog:
      type: object
      required: [careLogId, bookingId, logDate, photoUrls, isAbnormal, recordedBy, recordedByName, createdAt, editableUntil, addenda]
      properties:
        careLogId:
          type: integer
          format: int64
        bookingId:
          type: integer
          format: int64
        logDate:
          type: string
          format: date
        eating:
          type: [string, "null"]
          maxLength: 300
        drinking:
          type: [string, "null"]
          maxLength: 300
        hygiene:
          type: [string, "null"]
          maxLength: 300
        activity:
          type: [string, "null"]
          maxLength: 300
        note:
          type: [string, "null"]
        photoUrls:
          type: array
          items:
            type: string
        isAbnormal:
          type: boolean
        recordedBy:
          type: integer
          format: int64
        recordedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        editableUntil:
          type: string
          format: date-time
          description: "created_at + 1 giờ [CFG]"
        addenda:
          type: array
          items:
            $ref: "#/components/schemas/CareLogAddendum"
    CareLogRequest:
      type: object
      required: [photoUrls]
      properties:
        logDate:
          type: [string, "null"]
          format: date
          description: "Mặc định hôm nay"
        eating:
          type: [string, "null"]
          maxLength: 300
        drinking:
          type: [string, "null"]
          maxLength: 300
        hygiene:
          type: [string, "null"]
