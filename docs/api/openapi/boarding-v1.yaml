# Pet Care Boarding API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module LT (tầng 2) · owner BE-2
# Nguồn: 01 UC54, UC57–UC60; 02 BR-LT-01…12, BR-LH-09, BR-KH-04, 05, BR-SP-04, BR-BH-06, BR-TK-19; 03 #6 Đặt chỗ lưu trú, #7 Chuồng (+ Order#3); 04 §7; 05 §7 (kennels, boarding_bookings, boarding_check_ins, care_logs, care_log_addenda)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Boarding API v1"
  version: "1.0.0"
  description: "Module LT (tầng 2) · owner BE-2. Nguồn: 01 UC54, UC57–UC60; 02 BR-LT-01…12, BR-LH-09, BR-KH-04, 05, BR-SP-04, BR-BH-06, BR-TK-19; 03 #6 Đặt chỗ lưu trú, #7 Chuồng (+ Order#3); 04 §7; 05 §7 (kennels, boarding_bookings, boarding_check_ins, care_logs, care_log_addenda). Chi tiết và truy vết: ../boarding-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Kennels
    description: "Chuồng (UC54)"
  - name: Availability
    description: "Sức chứa theo đêm (BR-LT-03)"
  - name: Bookings
    description: "Đặt chỗ, gia hạn, hủy (UC58)"
  - name: Stay
    description: "Nhận thú, trả thú, thú mất (UC59)"
  - name: "Care logs"
    description: "Nhật ký chăm sóc (UC57, UC60)"
paths:
  "/kennels":
    get:
      tags: [Kennels]
      summary: "Danh sách chuồng của chi nhánh"
      description: "UC54, UC59 · BR-LT-01. Actor: A05, A06, A08. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —."
      operationId: listKennels
      security:
        - bearerAuth: []
      parameters:
        - name: kennelTypeId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, OCCUPIED, MAINTENANCE]
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Kennel"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Kennels]
      summary: "Tạo chuồng"
      description: "UC54 · BR-LT-01, BR-SP-04. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: — → AVAILABLE (Chuồng#1)."
      operationId: createKennel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateKennelRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Kennel"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-01` mã trùng trong chi nhánh · loại chuồng không phải dịch vụ BOARDING đang bật"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/kennels/{kennelId}":
    patch:
      tags: [Kennels]
      summary: "Sửa mã / ghi chú chuồng"
      description: "UC54 · BR-LT-01. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
      operationId: updateKennel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KennelId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateKennelRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Kennel"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Kennels]
      summary: "Xóa chuồng"
      description: "UC54 · BR-LT-01. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
      operationId: deleteKennel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KennelId"
      responses:
        "204":
          description: "Không có nội dung"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Chuồng đang OCCUPIED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/kennels/{kennelId}/start-maintenance":
    post:
      tags: [Kennels]
      summary: "Chuyển chuồng sang bảo trì"
      description: "UC54 · BR-LT-01, 03. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: AVAILABLE → MAINTENANCE (Chuồng#4)."
      operationId: startKennelMaintenance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KennelId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/MaintenanceResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Chuồng không AVAILABLE (OCCUPIED không chuyển được)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/kennels/{kennelId}/end-maintenance":
    post:
      tags: [Kennels]
      summary: "Hết bảo trì"
      description: "UC54 · BR-LT-01. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: MAINTENANCE → AVAILABLE (Chuồng#5)."
      operationId: endKennelMaintenance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/KennelId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Kennel"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Chuồng không MAINTENANCE"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/branches/{branchId}/boarding-availability":
    get:
      tags: [Availability]
      summary: "Xem còn chỗ theo đêm"
      description: "UC58 · BR-LT-01, 02, 03, 04. Actor: A02, A06. Quyền: Khách đã đăng nhập; lễ tân. Chuyển trạng thái: —. A1."
      operationId: getBoardingAvailability
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - name: kennelTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: checkInDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOutDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/BoardingAvailability"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-02` quá 30 đêm [CFG] hoặc ngày trả không sau ngày nhận · loại chuồng không bật tại chi nhánh"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/boarding-bookings":
    post:
      tags: [Bookings]
      summary: "Đặt chỗ lưu trú"
      description: "UC58 · BR-LT-02…05, BR-LH-09, BR-KH-05, BR-TK-19. Actor: A02, A06. Quyền: Khách: thú của mình · lễ tân chi nhánh. Chuyển trạng thái: — → BOOKED (Đặt chỗ#1). Snapshot giá đêm. Thiếu mũi bắt buộc dự kiến: cảnh báo, không chặn."
      operationId: createBoardingBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/BookingResult"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-02` thú sai loài / quá cân nặng tối đa / ngoài 1–30 đêm [CFG] / chồng ngày với đặt chỗ khác · `BR-LT-03` hết chỗ (message ghi các đêm thiếu) · `BR-LT-04` khách đặt ngoài khoảng 1–60 ngày [CFG], ngày nhận / trả là ngày nghỉ · `BR-LH-09` đang bị hạn chế đặt online · `BR-KH-05` thú đã mất · `BR-TK-19` hồ sơ chờ liên kết · loại chuồng không bật tại chi nhánh ACTIVE"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Bookings]
      summary: "Danh sách đặt chỗ"
      description: "UC58, UC59, UC60 · BR-LT-07, 11. Actor: A02, A05, A06, A07, A08. Quyền: Khách: của mình · nhân viên chi nhánh. Chuyển trạng thái: —."
      operationId: listBoardingBookings
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [BOOKED, CHECKED_IN, OVERDUE, CHECKED_OUT, CANCELLED, NO_SHOW]
        - name: petId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: inStay
          in: query
          required: false
          schema:
            type: boolean
          description: "CHECKED_IN hoặc OVERDUE"
        - name: missingCareLogToday
          in: query
          required: false
          schema:
            type: boolean
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/boarding-bookings/{bookingId}":
    get:
      tags: [Bookings]
      summary: "Chi tiết đặt chỗ"
      description: "UC58, UC60 · —. Actor: A02, A05–A08. Quyền: Khách: của mình · nhân viên chi nhánh. Chuyển trạng thái: —."
      operationId: getBoardingBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/boarding-bookings/{bookingId}/extend":
    post:
      tags: [Bookings]
      summary: "Gia hạn ngày trả"
      description: "UC58 · BR-LT-02, 03, 06. Actor: A02, A06. Quyền: Khách: thú của mình · lễ tân chi nhánh. Chuyển trạng thái: BOOKED / CHECKED_IN giữ nguyên (Đặt chỗ#2)."
      operationId: extendBoardingBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ExtendBookingRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-06` đã qua ngày trả dự kiến · `BR-LT-03` hết chỗ các đêm thêm · `BR-LT-02` vượt 30 đêm"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Đặt chỗ OVERDUE (không gia hạn) hoặc đã kết thúc"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/boarding-bookings/{bookingId}/cancel":
    post:
      tags: [Bookings]
      summary: "Hủy đặt chỗ"
      description: "UC58 · BR-LT-06, BR-LH-09. Actor: A02, A06. Quyền: Khách: thú của mình · lễ tân chi nhánh. Chuyển trạng thái: BOOKED → CANCELLED (Đặt chỗ#4). Còn < 24 giờ [CFG] trước ngày nhận → hủy muộn, đánh giá hạn chế đặt online (BR-LH-09)."
      operationId: cancelBoardingBooking
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Đã tới ngày nhận"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Đặt chỗ không còn BOOKED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/boarding-bookings/{bookingId}/check-in-readiness":
    get:
      tags: [Stay]
      summary: "Kiểm tra điều kiện nhận thú"
      description: "UC59 · BR-LT-04, 05, 08. Actor: A06, A08. Quyền: Lễ tân, CARETAKER chi nhánh. Chuyển trạng thái: —."
      operationId: getCheckInReadiness
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/CheckInReadiness"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Đặt chỗ không còn BOOKED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/boarding-bookings/{bookingId}/check-in":
    post:
      tags: [Stay]
      summary: "Nhận thú"
      description: "UC59 · BR-LT-04, 05, 08, BR-KH-04. Actor: A06, A08. Quyền: Lễ tân, CARETAKER chi nhánh. Chuyển trạng thái: BOOKED → CHECKED_IN (Đặt chỗ#3) · Chuồng#2 (→ OCCUPIED). Cân nặng ghi vào lịch sử (source INTAKE); nhận sớm được nếu còn chỗ."
      operationId: checkInBoarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CheckInRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LT-05` thiếu / quá hạn mũi bắt buộc (lễ tân tiếp nhận walk-in để tiêm trước) · `BR-LT-08` chuồng không AVAILABLE hoặc sai loại, thiếu cân nặng · `BR-LT-04` ngoài giờ mở cửa · `BR-LT-03` nhận sớm khi hết chỗ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Đặt chỗ không còn BOOKED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/boarding-bookings/{bookingId}/cancel-no-kennel":
    post:
      tags: [Stay]
      summary: "Hủy vì không còn chuồng đúng loại lúc nhận"
      description: "UC59 · BR-LT-08, BR-LH-09. Actor: A06. Quyền: Lễ tân chi nhánh. Chuyển trạng thái: BOOKED → CANCELLED (Đặt chỗ#5, phòng khám hủy). Không tính hủy muộn; thông báo khách và BRANCH_MANAGER (A3)."
      operationId: cancelBoardingNoKennel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Booking"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "Vẫn còn chuồng AVAILABLE đúng loại"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
