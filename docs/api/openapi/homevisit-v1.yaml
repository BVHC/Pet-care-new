# Pet Care Home Visit API v1 (tầng 3) — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module LH, KB (khám tại nhà) · owner BE-1
# Nguồn: 01 UC43, UC51; 09-tang3-be1-spec.md §A (BR-LH-13, 14, BR-KB-07, BR-BH-16; 03 #22 Lịch khám tại nhà); 05 bổ sung appointments.is_home_visit…, visits.is_home_visit, order_lines HOME_FEE
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Home Visit API v1 (tầng 3)"
  version: "1.0.0"
  description: "Module LH, KB (khám tại nhà) · owner BE-1. Nguồn: 01 UC43, UC51; 09-tang3-be1-spec.md §A (BR-LH-13, 14, BR-KB-07, BR-BH-16; 03 #22 Lịch khám tại nhà); 05 bổ sung appointments.is_home_visit…, visits.is_home_visit, order_lines HOME_FEE. Chi tiết và truy vết: ../homevisit-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: "Home visit booking"
    description: "Đặt lịch khám tại nhà (UC43)"
  - name: "Home visit"
    description: "Bác sĩ thực hiện khám tại nhà (UC51)"
paths:
  "/home-visit-appointments":
    post:
      tags: ["Home visit booking"]
      summary: "Đặt lịch khám tại nhà"
      description: "UC43 · BR-LH-13, BR-SP-09, 11. Actor: A02, A06. Quyền: CUSTOMER cho thú của mình; A06 đặt hộ ở chi nhánh của mình. Chuyển trạng thái: — → BOOKED (Lịch khám tại nhà#1). Chốt `homeFee` và địa chỉ lúc đặt. Dùng chung khóa quota với appointment-v1 (ADR-0045)."
      operationId: createHomeVisitAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateHomeVisitAppointmentRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/HomeVisitAppointment"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LH-13` chi nhánh chưa bật khám tại nhà · dịch vụ không phải `EXAM` / không bật · địa chỉ không phải của khách · thú đã mất; `BR-LH-04` / `05` / `09` như lịch thường"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Không tìm thấy thú / chi nhánh / dịch vụ / địa chỉ"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`CONCURRENCY_CONFLICT` khung vừa hết quota (BR-LH-03)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: ["Home visit"]
      summary: "Lịch khám tại nhà của chi nhánh"
      description: "UC51 · BR-KB-07. Actor: A06, A07. Quyền: A06, A07 của chi nhánh. Chuyển trạng thái: —. Tự lấy chi nhánh của người gọi. Sắp `slotStart` tăng dần."
      operationId: listHomeVisitAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: "Vắng = hôm nay (giờ Việt Nam)"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/HomeVisitAppointmentSummary"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/me/home-visit-appointments":
    get:
      tags: ["Home visit booking"]
      summary: "Lịch khám tại nhà của tôi"
      description: "UC43 · BR-LH-13. Actor: A02. Quyền: CUSTOMER, chỉ thú của mình. Chuyển trạng thái: —. Mới nhất trước (`slotDate` giảm dần, trùng thì `appointmentId` giảm dần)."
      operationId: listMyHomeVisitAppointments
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/HomeVisitAppointmentSummary"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/home-visit-appointments/{appointmentId}":
    get:
      tags: ["Home visit"]
      summary: "Chi tiết lịch khám tại nhà"
      description: "UC51 · BR-KB-07. Actor: A02, A06, A07. Quyền: Khách chủ lịch; A06, A07 của chi nhánh. Chuyển trạng thái: —."
      operationId: getHomeVisitAppointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/HomeVisitAppointment"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Không tìm thấy lịch tại nhà — cả khi lịch thuộc người khác (ADR-0006)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/home-visit-appointments/{appointmentId}/start":
    post:
      tags: ["Home visit"]
      summary: "Bắt đầu khám tại nhà"
      description: "UC51 · BR-KB-07, BR-BH-01, 16. Actor: A07. Quyền: VET của chi nhánh. Chuyển trạng thái: BOOKED → CHECKED_IN (Lịch khám tại nhà#2); Visit#1 biến thể. Tạo Visit `IN_PROGRESS` gán VET gọi, mở Order `VISIT` với dòng khám và dòng phí khám tại nhà (snapshot)."
      operationId: startHomeVisit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/HomeVisitStarted"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KB-07` ngoài ngày hẹn · không phải lịch tại nhà · thú đã mất · `BR-TN-01` thú đã có Visit mở"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`INVALID_STATE_TRANSITION` trạng thái lịch không cho phép (03 #22)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/home-visit-appointments/{appointmentId}/mark-unreachable":
    post:
      tags: ["Home visit"]
      summary: "Ghi nhận không gặp được khách"
      description: "UC51 · BR-LH-14, BR-LH-09. Actor: A07. Quyền: VET của chi nhánh. Chuyển trạng thái: BOOKED → NO_SHOW (Lịch khám tại nhà#3). Tính vào hạn chế đặt online của khách (BR-LH-09); thông báo khách."
      operationId: markHomeVisitUnreachable
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppointmentId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/MarkUnreachableRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/HomeVisitAppointment"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-LH-14` ngoài ngày hẹn · thiếu ghi chú"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`INVALID_STATE_TRANSITION` trạng thái lịch không cho phép (03 #22)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, TOO_MANY_REQUESTS, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    HomeVisitStatus:
      type: string
      enum: [BOOKED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW]
      description: "03 #3 và #22"
    CreateHomeVisitAppointmentRequest:
      type: object
      required: [petId, serviceId, branchId, slotDate, slotStart, contactPhone]
      properties:
        petId:
          type: integer
          format: int64
        serviceId:
          type: integer
          format: int64
          description: "Dịch vụ khám (`EXAM`) đang bật ở chi nhánh"
        branchId:
          type: integer
          format: int64
        slotDate:
          type: string
          format: date
        slotStart:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "08:30"
          description: "Khung 30 phút (BR-LH-02)"
        addressId:
          type: [integer, "null"]
          format: int64
          description: "Địa chỉ trong sổ của khách (một trong `addressId` / `address`)"
        address:
          type: [string, "null"]
          maxLength: 300
          description: "Nhập tay, chỉ lễ tân đặt hộ"
        contactPhone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        note:
          type: [string, "null"]
          maxLength: 300
        customerId:
          type: [integer, "null"]
          format: int64
          description: "Chỉ lễ tân đặt hộ; khách tự đặt thì bỏ qua"
    HomeVisitAppointment:
      type: object
      required: [appointmentId, code, petId, petName, customerId, serviceId, serviceName, branchId, slotDate, slotStart, status, homeAddress, homeContactPhone, homeFee, createdAt]
      properties:
        appointmentId:
          type: integer
          format: int64
        code:
          type: string
        petId:
          type: integer
          format: int64
        petName:
          type: string
        customerId:
          type: integer
          format: int64
        serviceId:
          type: integer
          format: int64
        serviceName:
          type: string
        branchId:
          type: integer
          format: int64
        slotDate:
          type: string
          format: date
        slotStart:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "08:30"
        status:
          $ref: "#/components/schemas/HomeVisitStatus"
        homeAddress:
          type: string
          description: "Snapshot (BR-SP-11)"
        homeContactPhone:
          type: string
        homeFee:
          type: integer
          format: int64
          minimum: 0
          description: "Snapshot (BR-SP-11)"
        note:
          type: [string, "null"]
        visitId:
          type: [integer, "null"]
          format: int64
          description: "Có sau khi bắt đầu"
        createdAt:
          type: string
          format: date-time
    HomeVisitAppointmentSummary:
      type: object
      required: [appointmentId, code, petName, serviceName, slotDate, slotStart, status, homeAddress, homeFee]
      properties:
        appointmentId:
          type: integer
          format: int64
        code:
          type: string
        petName:
          type: string
        serviceName:
          type: string
        slotDate:
          type: string
          format: date
        slotStart:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "08:30"
        status:
          $ref: "#/components/schemas/HomeVisitStatus"
        homeAddress:
          type: string
        homeFee:
          type: integer
          format: int64
          minimum: 0
          description: VND
    HomeVisitStarted:
      type: object
      required: [appointmentId, visitId, orderId]
      properties:
        appointmentId:
          type: integer
          format: int64
        visitId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
    MarkUnreachableRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          maxLength: 300
          description: "Bắt buộc (BR-LH-14)"
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
