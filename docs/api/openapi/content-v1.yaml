  "/feedbacks/{feedbackId}":
    get:
      tags: [Feedback]
      summary: "Xem feedback"
      description: "UC84 · BR-DG-03, 04. Actor: A04, A05. Quyền: Như listFeedbacks. Chuyển trạng thái: NEW → SEEN khi mở lần đầu (A2)."
      operationId: getFeedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Feedback"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/feedbacks/{feedbackId}/resolve":
    post:
      tags: [Feedback]
      summary: "Đánh dấu đã xử lý"
      description: "UC84 · BR-DG-04. Actor: A04, A05. Quyền: Như listFeedbacks. Chuyển trạng thái: SEEN → RESOLVED."
      operationId: resolveFeedback
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FeedbackId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResolveFeedbackRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Feedback"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-DG-04` thiếu ghi chú"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Đã RESOLVED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [HOME_BANNER, ABOUT, POLICY, FAQ]
    ArticleCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ArticleId:
      name: articleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    PageContent:
      type: object
      required: [key, content, updatedAt]
      properties:
        key:
          type: string
          enum: [HOME_BANNER, ABOUT, POLICY, FAQ]
        title:
          type: [string, "null"]
          maxLength: 250
        content:
          type: object
          additionalProperties: true
          description: A3
        updatedAt:
          type: string
          format: date-time
    UpdatePageContentRequest:
      type: object
      required: [content]
      properties:
        title:
          type: [string, "null"]
          maxLength: 250
        content:
          type: object
          additionalProperties: true
    ArticleCategory:
      type: object
      required: [categoryId, name, slug, isHidden, articleCount]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
        isHidden:
          type: boolean
        articleCount:
          type: integer
          format: int32
    ArticleCategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 120
    UpdateArticleCategoryRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 100
        isHidden:
          type: [boolean, "null"]
    PublicArticleCategory:
      type: object
      required: [categoryId, name, slug]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
    Article:
      type: object
      required: [articleId, categoryId, title, slug, content, authorDisplayName, status, createdAt, updatedAt]
      properties:
        articleId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 250
        slug:
          type: string
          maxLength: 270
        coverImageUrl:
          type: [string, "null"]
          maxLength: 500
        summary:
          type: [string, "null"]
          maxLength: 500
        content:
          type: string
          description: "HTML đã lọc"
        authorDisplayName:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [DRAFT, PUBLISHED, HIDDEN]
        firstPublishedAt:
          type: [string, "null"]
          format: date-time
          description: "Khác null: slug khóa, không xóa được"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ArticleSummary:
      type: object
      required: [articleId, categoryId, title, slug, status, updatedAt]
      properties:
        articleId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED, HIDDEN]
        firstPublishedAt:
          type: [string, "null"]
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateArticleRequest:
      type: object
      required: [categoryId, title, slug, content, authorDisplayName]
      properties:
        categoryId:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 250
        slug:
          type: string
          maxLength: 270
          description: "Duy nhất toàn hệ thống (BR-BV-01)"
        coverImageUrl:
          type: [string, "null"]
          maxLength: 500
        summary:
          type: [string, "null"]
          maxLength: 500
        content:
          type: string
        authorDisplayName:
          type: string
          maxLength: 100
    UpdateArticleRequest:
      type: object
      properties:
        categoryId:
          type: [integer, "null"]
          format: int64
        title:
          type: [string, "null"]
          maxLength: 250
        slug:
          type: [string, "null"]
          maxLength: 270
          description: "Không đổi được sau lần xuất bản đầu"
        coverImageUrl:
          type: [string, "null"]
          maxLength: 500
        summary:
          type: [string, "null"]
          maxLength: 500
        content:
          type: [string, "null"]
        authorDisplayName:
          type: [string, "null"]
          maxLength: 100
    PublicArticleCard:
      type: object
      required: [articleId, title, slug, categoryName, categorySlug, authorDisplayName, publishedAt]
      properties:
        articleId:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        categoryName:
          type: string
        categorySlug:
          type: string
        coverImageUrl:
          type: [string, "null"]
          maxLength: 500
        summary:
          type: [string, "null"]
        authorDisplayName:
          type: string
        publishedAt:
          type: string
          format: date-time
    PublicArticle:
      type: object
      required: [articleId, title, slug, categoryName, categorySlug, content, authorDisplayName, publishedAt]
      properties:
        articleId:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        categoryName:
          type: string
        categorySlug:
          type: string
        coverImageUrl:
          type: [string, "null"]
          maxLength: 500
        summary:
          type: [string, "null"]
        content:
          type: string
        authorDisplayName:
          type: string
        publishedAt:
          type: string
          format: date-time
    CreateFeedbackRequest:
      type: object
      required: [topic, content]
      properties:
        topic:
          type: string
          enum: [BRANCH_SERVICE, WEBSITE, OTHER]
        branchId:
          type: [integer, "null"]
          format: int64
          description: "Bắt buộc khi BRANCH_SERVICE"
        rating:
          type: [integer, "null"]
          format: int32
          description: "1–5"
        content:
          type: string
          maxLength: 2000
          description: "10–2000 ký tự"
    MyFeedback:
      type: object
      required: [feedbackId, topic, content, status, createdAt]
      properties:
        feedbackId:
          type: integer
          format: int64
        topic:
          type: string
          enum: [BRANCH_SERVICE, WEBSITE, OTHER]
        branchId:
          type: [integer, "null"]
          format: int64
        rating:
          type: [integer, "null"]
          format: int32
        content:
          type: string
        status:
          type: string
          enum: [NEW, SEEN, RESOLVED]
          description: "Khách chỉ thấy trạng thái (BR-DG-04)"
        createdAt:
          type: string
          format: date-time
    Feedback:
      type: object
      required: [feedbackId, customerId, customerName, topic, content, status, createdAt]
      properties:
        feedbackId:
          type: integer
          format: int64
        customerId:
          type: integer
          format: int64
        customerName:
          type: string
        topic:
          type: string
          enum: [BRANCH_SERVICE, WEBSITE, OTHER]
        branchId:
          type: [integer, "null"]
          format: int64
        branchName:
          type: [string, "null"]
        rating:
          type: [integer, "null"]
          format: int32
        content:
          type: string
        status:
          type: string
          enum: [NEW, SEEN, RESOLVED]
        seenAt:
          type: [string, "null"]
          format: date-time
        resolvedBy:
          type: [integer, "null"]
          format: int64
        resolvedAt:
          type: [string, "null"]
          format: date-time
        resolutionNote:
          type: [string, "null"]
          description: "Nội bộ"
        createdAt:
          type: string
          format: date-time
    ResolveFeedbackRequest:
      type: object
      required: [resolutionNote]
      properties:
        resolutionNote:
          type: string
          description: "Bắt buộc (BR-DG-04)"
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
