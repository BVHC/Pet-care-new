      description: "UC76 · BR-KO-01, 06, BR-QT-15. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —. Hiệu lực ngay, ghi movement ADJUSTMENT và audit. A4."
      operationId: createStockAdjustment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
