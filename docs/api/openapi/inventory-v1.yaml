          $ref: "#/components/responses/Forbidden"
  "/stock-adjustments/{adjustmentId}":
    get:
      tags: [Adjustments]
      summary: "Chi tiết phiếu điều chỉnh"
      description: "UC76 · BR-KO-06. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
