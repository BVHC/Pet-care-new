      type: http
      scheme: bearer
      description: "Access token trả về từ POST /auth/login, gắn với một phiên (sessions). Phiên bị hủy thì token hết hiệu lực ngay (BR-TK-11, 13, 14)."
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: "Số trang, bắt đầu từ 0"
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Error:
      type: object
      description: "Envelope lỗi duy nhất, do GlobalExceptionHandler (platform/exception) sinh. Vi phạm business rule: errorCode = BUSINESS_RULE_VIOLATION, message kết thúc bằng mã rule, ví dụ \"… (BR-LH-05)\"."
      required: [success, errorCode, message, statusCode, timestamp, traceId]
      properties:
        success:
          type: boolean
          enum: [false]
        errorCode:
          type: string
          enum: [BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND, ACCESS_DENIED_SCOPE_MISMATCH, CONCURRENCY_CONFLICT, VALIDATION_FAILED, MALFORMED_REQUEST, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, UNAUTHENTICATED, ACCESS_DENIED, INTERNAL_ERROR]
          description: platform/exception/ErrorCode
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được; với BUSINESS_RULE_VIOLATION kết thúc bằng \" (BR-…)\""
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    Supplier:
      type: object
      required: [supplierId, name, phone, isActive]
      properties:
        supplierId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        address:
          type: [string, "null"]
          maxLength: 300
        isActive:
          type: boolean
          description: "false = ngừng hợp tác (BR-KO-02)"
    SupplierRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        address:
          type: [string, "null"]
          maxLength: 300
    UpdateSupplierRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 200
        phone:
          type: [string, "null"]
          pattern: "^0[0-9]{9,10}$"
          maxLength: 15
        address:
          type: [string, "null"]
          maxLength: 300
        isActive:
          type: [boolean, "null"]
    ReceiptLineRequest:
      type: object
      required: [productId, quantity, unitCost]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
          description: "> 0"
        unitCost:
          type: integer
          format: int64
          minimum: 0
          description: "Giá nhập"
        lotNumber:
          type: [string, "null"]
          maxLength: 50
          description: "Bắt buộc nếu sản phẩm quản lý hạn dùng (BR-SP-05)"
        expiryDate:
          type: [string, "null"]
          format: date
          description: "Bắt buộc nếu quản lý hạn dùng, sau ngày nhập"
    StockReceiptRequest:
      type: object
      required: [supplierId, receiptDate, lines]
      properties:
        supplierId:
          type: integer
          format: int64
          description: "Đang hợp tác"
        receiptDate:
          type: string
          format: date
        note:
          type: [string, "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptLineRequest"
    ReceiptLine:
      type: object
      required: [lineId, productId, productName, quantity, unitCost]
      properties:
        lineId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        quantity:
          type: integer
          format: int32
        unitCost:
          type: integer
          format: int64
          minimum: 0
          description: VND
        lotNumber:
          type: [string, "null"]
        expiryDate:
          type: [string, "null"]
          format: date
        stockLotId:
          type: [integer, "null"]
          format: int64
          description: "Gán khi xác nhận"
    StockReceipt:
      type: object
      required: [receiptId, code, branchId, supplierId, supplierName, receiptDate, status, lines, createdBy]
      properties:
        receiptId:
          type: integer
          format: int64
        code:
          type: string
          description: "Dãy số liên tục"
        branchId:
          type: integer
          format: int64
        supplierId:
          type: integer
          format: int64
        supplierName:
          type: string
        receiptDate:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, CONFIRMED, CANCELLED]
        note:
          type: [string, "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptLine"
        createdBy:
          type: integer
          format: int64
        confirmedBy:
          type: [integer, "null"]
          format: int64
        confirmedAt:
          type: [string, "null"]
          format: date-time
        cancelledBy:
          type: [integer, "null"]
          format: int64
        cancelledAt:
          type: [string, "null"]
          format: date-time
        cancelReason:
          type: [string, "null"]
    StockReceiptSummary:
      type: object
      required: [receiptId, code, supplierName, receiptDate, status, lineCount, totalCost]
      properties:
        receiptId:
          type: integer
          format: int64
        code:
          type: string
        supplierName:
          type: string
        receiptDate:
          type: string
          format: date
        status:
          type: string
          enum: [DRAFT, CONFIRMED, CANCELLED]
        lineCount:
          type: integer
          format: int32
        totalCost:
          type: integer
          format: int64
          minimum: 0
          description: VND
    CancelReceiptRequest:
      type: object
      properties:
        reason:
          type: [string, "null"]
          maxLength: 300
    InventoryItem:
      type: object
      required: [productId, productName, sku, unit, productType, tracksExpiry, totalQuantity, availableQuantity, minQuantity, belowMin, expiredQuantity]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        sku:
          type: string
        unit:
          type: string
        productType:
          type: string
          enum: [GOODS, DRUG, VACCINE]
        tracksExpiry:
          type: boolean
        totalQuantity:
          type: integer
          format: int32
          description: "Tổng các lô"
        availableQuantity:
          type: integer
          format: int32
          description: "Tổng lô chưa hết hạn (BR-KO-01)"
        minQuantity:
          type: integer
          format: int32
        belowMin:
          type: boolean
        nearestExpiryDate:
          type: [string, "null"]
          format: date
        expiredQuantity:
          type: integer
          format: int32
          description: "Tồn ở lô đã hết hạn, cần điều chỉnh lý do hết hạn (BR-KO-07)"
    StockLot:
      type: object
      required: [stockLotId, quantity, isDefault, expired]
      properties:
        stockLotId:
          type: integer
          format: int64
        lotNumber:
          type: [string, "null"]
        expiryDate:
          type: [string, "null"]
          format: date
        quantity:
          type: integer
          format: int32
        isDefault:
          type: boolean
          description: "Lô duy nhất của sản phẩm không quản lý hạn dùng"
        expired:
          type: boolean
    SetMinQuantityRequest:
      type: object
      required: [minQuantity]
      properties:
        minQuantity:
          type: integer
          format: int32
          description: "≥ 0"
    AdjustmentLineRequest:
      type: object
      required: [stockLotId, quantityDelta]
      properties:
        stockLotId:
          type: integer
          format: int64
        quantityDelta:
          type: integer
          format: int32
          description: "≠ 0; âm = giảm, dương = tăng"
    StockAdjustmentRequest:
      type: object
      required: [reason, lines]
      properties:
        reason:
          type: string
          enum: [DAMAGED, EXPIRED, COUNT_MISMATCH, OTHER]
        note:
          type: [string, "null"]
          description: "Bắt buộc khi OTHER"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/AdjustmentLineRequest"
    AdjustmentLine:
      type: object
      required: [stockLotId, productId, productName, quantityDelta, balanceAfter]
      properties:
        stockLotId:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        lotNumber:
          type: [string, "null"]
        quantityDelta:
          type: integer
          format: int32
        balanceAfter:
          type: integer
          format: int32
    StockAdjustment:
      type: object
      required: [adjustmentId, code, branchId, reason, lines, createdBy, createdAt]
      properties:
        adjustmentId:
          type: integer
          format: int64
        code:
          type: string
        branchId:
          type: integer
          format: int64
        reason:
          type: string
          enum: [DAMAGED, EXPIRED, COUNT_MISMATCH, OTHER]
        note:
          type: [string, "null"]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/AdjustmentLine"
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: "VALIDATION_FAILED / MALFORMED_REQUEST: dữ liệu không hợp lệ · BUSINESS_RULE_VIOLATION: vi phạm rule, message kết thúc bằng mã rule \"(BR-…)\"."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập hoặc phiên đã hết hạn / bị hủy."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "ACCESS_DENIED: sai vai trò · ACCESS_DENIED_SCOPE_MISMATCH: ngoài phạm vi (chi nhánh, chủ sở hữu). Message chung, không lộ cấu trúc phân quyền."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Không tìm thấy (RESOURCE_NOT_FOUND)."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
