# Pet Care Inventory API v1 — OpenAPI 3.1, sinh từ khai báo; không sửa tay, sửa khai báo rồi sinh lại.
# Module KO (tầng 2) · owner BE-2
# Nguồn: 01 UC73–UC76; 02 BR-KO-01…07, BR-SP-05, BR-QT-15; 03 #9 Phiếu nhập kho; 04 §9; 05 §9 (suppliers, inventory_items, stock_lots, stock_receipts, stock_receipt_lines, stock_adjustments, stock_adjustment_lines, stock_movements)
# Truy vết: CONFIRMED = có trong docs · ASSUMPTION (A#) · TBD (Q#) — xem file .md cùng tên.

openapi: "3.1.0"
info:
  title: "Pet Care Inventory API v1"
  version: "1.0.0"
  description: "Module KO (tầng 2) · owner BE-2. Nguồn: 01 UC73–UC76; 02 BR-KO-01…07, BR-SP-05, BR-QT-15; 03 #9 Phiếu nhập kho; 04 §9; 05 §9 (suppliers, inventory_items, stock_lots, stock_receipts, stock_receipt_lines, stock_adjustments, stock_adjustment_lines, stock_movements). Chi tiết và truy vết: ../inventory-v1.md"
servers:
  - url: "/api"
    description: "Mọi path bên dưới nằm sau tiền tố /api"
tags:
  - name: Suppliers
    description: "Nhà cung cấp (UC73)"
  - name: "Stock receipts"
    description: "Phiếu nhập kho (UC74)"
  - name: Inventory
    description: "Tồn kho, lô, tồn tối thiểu (UC75)"
  - name: Adjustments
    description: "Điều chỉnh tồn (UC76)"
paths:
  "/suppliers":
    get:
      tags: [Suppliers]
      summary: "Danh sách nhà cung cấp"
      description: "UC73, UC74 · BR-KO-02. Actor: A05. Quyền: BRANCH_MANAGER. Chuyển trạng thái: —."
      operationId: listSuppliers
      security:
        - bearerAuth: []
      parameters:
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Supplier"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Suppliers]
      summary: "Thêm nhà cung cấp"
      description: "UC73 · BR-KO-02. Actor: A05. Quyền: BRANCH_MANAGER (A1). Chuyển trạng thái: —."
      operationId: createSupplier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SupplierRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Supplier"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/suppliers/{supplierId}":
    patch:
      tags: [Suppliers]
      summary: "Sửa / ngừng hợp tác nhà cung cấp"
      description: "UC73 · BR-KO-02. Actor: A05. Quyền: BRANCH_MANAGER (A1). Chuyển trạng thái: —. Ngừng hợp tác thì không chọn được ở phiếu nhập mới."
      operationId: updateSupplier
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateSupplierRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/Supplier"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Suppliers]
      summary: "Xóa nhà cung cấp chưa có phiếu nhập"
      description: "UC73 · BR-KO-02. Actor: A05. Quyền: BRANCH_MANAGER (A1). Chuyển trạng thái: —."
      operationId: deleteSupplier
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SupplierId"
      responses:
        "204":
          description: "Không có nội dung"
        "400":
          description: "`BR-KO-02` đã có phiếu nhập — chỉ ngừng hợp tác"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/stock-receipts":
    get:
      tags: ["Stock receipts"]
      summary: "Danh sách phiếu nhập"
      description: "UC74 · BR-KO-03. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
      operationId: listStockReceipts
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, CANCELLED]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: supplierId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/StockReceiptSummary"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: ["Stock receipts"]
      summary: "Tạo phiếu nhập nháp"
      description: "UC74 · BR-KO-03. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: — → DRAFT (Phiếu nhập#1). Chưa ảnh hưởng tồn."
      operationId: createStockReceipt
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/StockReceiptRequest"
      responses:
        "201":
          description: "Đã tạo"
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StockReceipt"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/stock-receipts/{receiptId}":
    get:
      tags: ["Stock receipts"]
      summary: "Chi tiết phiếu nhập"
      description: "UC74 · BR-KO-03. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
      operationId: getStockReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StockReceipt"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: ["Stock receipts"]
      summary: "Sửa phiếu nháp"
      description: "UC74 · BR-KO-03. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —. A2."
      operationId: updateStockReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/StockReceiptRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StockReceipt"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Phiếu không còn DRAFT"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/stock-receipts/{receiptId}/confirm":
    post:
      tags: ["Stock receipts"]
      summary: "Xác nhận phiếu nhập"
      description: "UC74 · BR-KO-02, 03, BR-SP-05. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: DRAFT → CONFIRMED (Phiếu nhập#2). Cộng tồn theo lô; cùng số lô và hạn thì cộng vào lô cũ."
      operationId: confirmStockReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StockReceipt"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KO-02` nhà cung cấp ngừng hợp tác · `BR-KO-03` dòng số lượng ≤ 0 / thiếu giá nhập / thiếu số lô, hạn dùng hoặc hạn không sau ngày nhập"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Phiếu không còn DRAFT"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/stock-receipts/{receiptId}/cancel":
    post:
      tags: ["Stock receipts"]
      summary: "Hủy phiếu nhập"
      description: "UC74 · BR-KO-03, 04, 06, BR-QT-15. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: DRAFT → CANCELLED (Phiếu nhập#3) · CONFIRMED → CANCELLED (Phiếu nhập#4). Phiếu CONFIRMED: trừ lại tồn, ghi audit. Không xóa cứng phiếu."
      operationId: cancelStockReceipt
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReceiptId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CancelReceiptRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/StockReceipt"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          description: "`BR-KO-04` tồn hiện tại của lô không đủ để trừ lại — dùng phiếu điều chỉnh (BR-KO-06)"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Phiếu đã CANCELLED"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/inventory":
    get:
      tags: [Inventory]
      summary: "Xem tồn kho chi nhánh"
      description: "UC75 · BR-KO-01, 07. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh (chỉ BRANCH_MANAGER sửa). Chuyển trạng thái: —."
      operationId: listInventory
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Tên hoặc SKU"
        - name: productType
          in: query
          required: false
          schema:
            type: string
            enum: [GOODS, DRUG, VACCINE]
        - name: belowMin
          in: query
          required: false
          schema:
            type: boolean
        - name: expiringWithinDays
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: "Có lô sắp hết hạn trong N ngày"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PageMeta"
                      - type: object
                        required: [content]
                        properties:
                          content:
                            type: array
                            items:
                              $ref: "#/components/schemas/InventoryItem"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/inventory/{productId}":
    get:
      tags: [Inventory]
      summary: "Tồn của một sản phẩm"
      description: "UC75, UC66, UC48 · BR-KO-01. Actor: A05, A06, A07, A08. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. Dùng ở POS / kê đơn / tiêm để xem tồn khả dụng."
      operationId: getInventoryItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/InventoryItem"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/inventory/{productId}/lots":
    get:
      tags: [Inventory]
      summary: "Tồn theo lô, hạn dùng"
      description: "UC75, UC76 · BR-KO-01, 05. Actor: A05, A06. Quyền: Nhân viên chi nhánh. Chuyển trạng thái: —. Sắp theo hạn dùng tăng dần (thứ tự FEFO)."
      operationId: listStockLots
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StockLot"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  "/inventory/{productId}/min-quantity":
    put:
      tags: [Inventory]
      summary: "Đặt tồn tối thiểu"
      description: "UC75 · BR-KO-07. Actor: A05. Quyền: BRANCH_MANAGER chi nhánh. Chuyển trạng thái: —."
      operationId: setMinQuantity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/SetMinQuantityRequest"
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                required: [data, message, code]
                properties:
                  data:
                    $ref: "#/components/schemas/InventoryItem"
                  message:
                    type: string
                  code:
                    type: integer
                    description: "HTTP status của kết quả, ví dụ 200, 201"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
