# Pet Care Procurement API v1 — OpenAPI 3.1 (derived strictly from docs/)
#
# Source of truth: docs/01-business-operations.md (01#13),
# docs/02-business-rules.md (RULE-13-01..08), docs/03-state-machines.md
# (FSM-12 PurchaseRequest, FSM-13 PurchaseOrder), docs/04-glossary.md (13),
# docs/05-domain-model.md (4.13), docs/06-erd.md (purchase_orders/goods_receipts;
# purchase_requests lack column specs, storage TBD).
# Supplier master has no ERD table: orders carry a free-text supplier name and
# supplier management stays out of v1. Stock increases are a ReceiveGoods effect.
# Closed and cancelled orders are absolutely immutable.
#
# Traceability legend: CONFIRMED = in docs / ASSUMPTION (A#) = least invention /
# TBD (Q#) = needs PO (see ../procurement-v1.md section E). No `servers` (TBD Q1).
# Error envelope follows docs/convention/backend/04-exception-handling. No 422.

openapi: 3.1.0
info:
  title: Pet Care Procurement API v1
  version: 1.0.0
  description: >-
    Strictly derived from docs/ (01#13 operations, RULE-13-01..08, FSM-12
    DRAFT->SUBMITTED->APPROVED and FSM-13 ISSUED->PARTIALLY_RECEIVED->RECEIVED).
    Internal requests pass maker-checker before becoming supplier orders.
    Deliveries are inspected before anything touches stock, and finished orders
    never change again.
tags:
  - name: Requests
    description: Internal purchase requests (Create/Submit/Approve/Reject/CancelPurchaseRequest).
  - name: Orders
    description: Supplier orders, inspection, receipts, and terminal closure.
paths:
  /purchase-requests:
    post:
      tags: [Requests]
      summary: Create purchase request (CreatePurchaseRequest)
      description: CONFIRMED (RULE-13-01). Opens DRAFT. Shape PROPOSED and storage TBD Q9 in md.
      operationId: createPurchaseRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
      responses:
        '201':
          description: Request drafted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Inventory staff of the scope only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchase-requests/{id}/submit:
    post:
      tags: [Requests]
      summary: Submit request (SubmitPurchaseRequest)
      description: From DRAFT to SUBMITTED. Creator only. Idempotent.
      operationId: submitPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Creator only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/approve:
    post:
      tags: [Requests]
      summary: Approve request (ApprovePurchaseRequest)
      description: CONFIRMED maker-checker (RULE-13-02). StoreManager for stores, OrganizationAdmin for warehouse scope.
      operationId: approvePurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '400':
          description: Maker-checker violation — approver is the same actor who created the request (CONFIRMED code MAKER_CHECKER_VIOLATION, RULE-13-02, BusinessRuleViolationException per convention 04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not SUBMITTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/reject:
    post:
      tags: [Requests]
      summary: Reject request (RejectPurchaseRequest)
      description: CONFIRMED (RULE-13-02, reasoned).
      operationId: rejectPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not SUBMITTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/cancel:
    post:
      tags: [Requests]
      summary: Cancel request (CancelPurchaseRequest)
      description: CONFIRMED (RULE-13-03). DRAFT or SUBMITTED only, creator only.
      operationId: cancelPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Creator only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders:
    post:
      tags: [Orders]
      summary: Create supplier order (CreatePurchaseOrder)
      description: CONFIRMED (RULE-13-04). From an APPROVED request. Supplier is free text until a master exists (ASSUMPTION A1 in md). Numbers are server-generated (ASSUMPTION A2).
      operationId: createPurchaseOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Request not APPROVED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}:
    get:
      tags: [Orders]
      summary: Track order (TrackPurchaseOrder)
      description: Order with lines, cumulative receipts, and remaining quantities.
      operationId: trackPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order tracking view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchase-orders/{id}/inspect:
    post:
      tags: [Orders]
      summary: Inspect delivery (InspectGoods)
      description: CONFIRMED mandatory pre-receipt inspection (RULE-13-05). Failed goods are refused with a return record (shape TBD Q10 in md).
      operationId: inspectGoods
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'
      responses:
        '200':
          description: Inspection recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Receiving staff only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nothing delivered yet, or order finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/receive:
    post:
      tags: [Orders]
      summary: Receive goods (ReceiveGoods)
      description: CONFIRMED (RULE-13-05/06/08). Requires inspection, refuses finished orders, raises physical and available stock with batch and expiry tracking.
      operationId: receiveGoods
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
      responses:
        '200':
          description: Receipt recorded with new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Receiving staff only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Uninspected, finished, or over-delivered (over-delivery handling TBD Q5 in md).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order (CancelPurchaseOrder)
      description: Before any delivery. Finished-order immutability CONFIRMED (RULE-13-08).
      operationId: cancelPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already receiving or finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/cancel-remaining:
    post:
      tags: [Orders]
      summary: Close short delivery (CancelRemainingPurchaseOrder)
      description: CONFIRMED (RULE-13-07). From PARTIALLY_RECEIVED to CLOSED when the supplier cannot deliver the rest.
      operationId: cancelRemainingPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not partially received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT/Session Token (RULE-01-01 CONFIRMED existence; Bearer transport ASSUMPTION A2 in auth-v1).
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "199000.00"
      description: Decimal string, 2 fractional digits, matching DB DECIMAL(12,2) (docs/06-erd.md) — sent/received as string to avoid IEEE-754 float rounding. Parse server-side as BigDecimal, not double.
    PurchaseRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]
      description: CONFIRMED (FSM-12, 04 glossary).
    PurchaseOrderStatus:
      type: string
      enum: [ISSUED, PARTIALLY_RECEIVED, RECEIVED, CLOSED, CANCELLED]
      description: CONFIRMED (FSM-13, 04 glossary).
    RequestLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        expectedPrice:
          $ref: '#/components/schemas/Money'
        recommendedSupplier:
          type: string
    CreateRequestRequest:
      type: object
      required: [storeId, lines]
      properties:
        storeId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestLine'
    PurchaseRequestResponse:
      type: object
      required: [requestId, storeId, status]
      properties:
        requestId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseRequestStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RequestLine'
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
    OrderLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
    CreateOrderRequest:
      type: object
      required: [purchaseRequestId, supplierName]
      properties:
        purchaseRequestId:
          type: string
          format: uuid
        supplierName:
          type: string
          description: Free text until a supplier master exists (ASSUMPTION A1 in md).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          description: Defaults to the approved request lines (ASSUMPTION A5 in md).
    PurchaseOrderResponse:
      type: object
      required: [orderId, poNumber, storeId, supplierName, status, totalAmount]
      properties:
        orderId:
          type: string
          format: uuid
        poNumber:
          type: string
        storeId:
          type: string
          format: uuid
        supplierName:
          type: string
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        totalAmount:
          $ref: '#/components/schemas/Money'
    ReceiptLine:
      type: object
      required: [productId, receivedQuantity]
      properties:
        productId:
          type: string
          format: uuid
        receivedQuantity:
          type: integer
          minimum: 0
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
    InspectLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 0
        reason:
          type: string
    InspectRequest:
      type: object
      properties:
        acceptedLines:
          type: array
          items:
            $ref: '#/components/schemas/InspectLine'
        rejectedLines:
          type: array
          items:
            $ref: '#/components/schemas/InspectLine'
        returnNote:
          type: string
      description: Shape PROPOSED (TBD Q10 in md).
    InspectResponse:
      type: object
      required: [receiptId, inspected]
      properties:
        receiptId:
          type: string
          format: uuid
          nullable: true
        inspected:
          type: boolean
    ReceiveRequest:
      type: object
      required: [receiptLines]
      properties:
        receiptLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceiptLine'
    ReceiveResponse:
      type: object
      required: [receiptId, orderId, status]
      properties:
        receiptId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
    Error:
      type: object
      required: [success, errorCode, message, statusCode, timestamp]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          description: MAKER_CHECKER_VIOLATION is CONFIRMED (RULE-13-02, 400, BusinessRuleViolationException); ACCESS_DENIED_SCOPE_MISMATCH is CONFIRMED (RULE-02-01, 403); VALIDATION_FAILED, BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND follow docs/convention/backend/04-exception-handling.
        message:
          type: string
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
