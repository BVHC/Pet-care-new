# Pet Care Procurement API v1 — OpenAPI 3.1 (derived strictly from docs/)
#
# Source of truth: docs/01-business-operations.md (01#13),
# docs/02-business-rules.md (RULE-13-01..08), docs/03-state-machines.md
# (FSM-12 PurchaseRequest, FSM-13 PurchaseOrder), docs/04-glossary.md (13),
# docs/05-domain-model.md (4.13), docs/06-erd.md (suppliers/purchase_requests/
# purchase_request_lines/purchase_orders/purchase_order_lines/goods_receipts —
# full schema since V1, audit columns added V16).
# IMPLEMENTED (BE-2, RULE-13-01..04): PurchaseRequest CRUD + CreatePurchaseOrder/
# TrackPurchaseOrder + Supplier CRUD (real `suppliers` table, not free text).
# NOT IMPLEMENTED — future task (RULE-13-05..08, needs Inventory integration):
# InspectGoods/ReceiveGoods/CancelPurchaseOrder/CancelRemainingPurchaseOrder.
# Stock increases are a ReceiveGoods effect (still no endpoint).
# Closed and cancelled orders are absolutely immutable (once those commands land).
#
# Traceability legend: CONFIRMED = in docs / ASSUMPTION (A#) = least invention /
# TBD (Q#) = needs PO (see ../procurement-v1.md section E). No `servers` (TBD Q1).
# Error envelope follows docs/convention/backend/04-exception-handling. No 422 —
# BusinessRuleViolationException is always 400, never 409 (409 is reserved for
# InvalidStateTransition/ConcurrencyConflict).

openapi: 3.1.0
info:
  title: Pet Care Procurement API v1
  version: 1.0.0
  description: >-
    Strictly derived from docs/ (01#13 operations, RULE-13-01..04 implemented;
    RULE-13-05..08 designed but not built yet). Internal requests pass
    maker-checker before becoming supplier orders, which are only ever created
    from an APPROVED request against an ACTIVE Supplier. Inspection, receiving,
    and terminal order closure (FSM-13 beyond ISSUED) are a future task.
tags:
  - name: Requests
    description: Internal purchase requests (Create/Submit/Approve/Reject/CancelPurchaseRequest).
  - name: Orders
    description: Supplier orders, inspection, receipts, and terminal closure.
  - name: Suppliers
    description: Supplier master data (ManageSupplier, RULE-13-04, Organization Admin only).
paths:
  /stores/{id}/purchase-requests:
    post:
      tags: [Requests]
      summary: Create purchase request (CreatePurchaseRequest)
      description: CONFIRMED (RULE-13-01). Opens DRAFT. storeId comes from the path, not the body.
      operationId: createPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequestRequest'
      responses:
        '201':
          description: Request drafted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Inventory staff of the scope only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchase-requests/{id}/submit:
    post:
      tags: [Requests]
      summary: Submit request (SubmitPurchaseRequest)
      description: From DRAFT to SUBMITTED. Store-scoped (4-role, not creator-restricted, same as Module 12). Non-idempotent — 409 if not DRAFT.
      operationId: submitPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/approve:
    post:
      tags: [Requests]
      summary: Approve request (ApprovePurchaseRequest)
      description: CONFIRMED maker-checker (RULE-13-02). StoreManager for stores, OrganizationAdmin for warehouse scope.
      operationId: approvePurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '400':
          description: Maker-checker violation — approver is the same actor who created the request (CONFIRMED code MAKER_CHECKER_VIOLATION, RULE-13-02, BusinessRuleViolationException per convention 04).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not SUBMITTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/reject:
    post:
      tags: [Requests]
      summary: Reject request (RejectPurchaseRequest)
      description: CONFIRMED (RULE-13-02) — reason is mandatory ("REJECTED kèm lý do").
      operationId: rejectPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Request rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not SUBMITTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-requests/{id}/cancel:
    post:
      tags: [Requests]
      summary: Cancel request (CancelPurchaseRequest)
      description: CONFIRMED (RULE-13-03). DRAFT or SUBMITTED only (FSM-12 guards it), store-scoped (not creator-restricted).
      operationId: cancelPurchaseRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside store scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders:
    post:
      tags: [Orders]
      summary: Create supplier order (CreatePurchaseOrder)
      description: CONFIRMED (RULE-13-04). From an APPROVED request, real supplierId (not free text — Q8 resolved). Lines are copied 1:1 from the request, not supplied by the client (ASSUMPTION A5). Numbers are server-generated (ASSUMPTION A2).
      operationId: createPurchaseOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '400':
          description: Validation failed, request not APPROVED, or supplier not ACTIVE / wrong organization (CONFIRMED RULE-13-04, BUSINESS_RULE_VIOLATION per convention 04 — not 409).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchase-orders/{id}:
    get:
      tags: [Orders]
      summary: Track order (TrackPurchaseOrder)
      description: Order with lines, cumulative receipts, and remaining quantities.
      operationId: trackPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order tracking view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /purchase-orders/{id}/inspect:
    post:
      tags: [Orders]
      summary: 'NOT IMPLEMENTED — future task: Inspect delivery (InspectGoods)'
      description: NOT IMPLEMENTED — RULE-13-05..08 need Inventory integration, deferred to a future task. Design kept PROPOSED for reference. Failed goods are refused with a return record (shape TBD Q10 in md).
      operationId: inspectGoods
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectRequest'
      responses:
        '200':
          description: Inspection recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Receiving staff only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Nothing delivered yet, or order finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/receive:
    post:
      tags: [Orders]
      summary: 'NOT IMPLEMENTED — future task: Receive goods (ReceiveGoods)'
      description: NOT IMPLEMENTED — RULE-13-05..08 need Inventory integration, deferred to a future task. Design kept PROPOSED for reference. Requires inspection, refuses finished orders, raises physical and available stock with batch and expiry tracking.
      operationId: receiveGoods
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveRequest'
      responses:
        '200':
          description: Receipt recorded with new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Receiving staff only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Uninspected, finished, or over-delivered (over-delivery handling TBD Q5 in md).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: 'NOT IMPLEMENTED — future task: Cancel order (CancelPurchaseOrder)'
      description: NOT IMPLEMENTED — RULE-13-08 needs Inventory integration, deferred to a future task. Design kept PROPOSED for reference. Before any delivery; finished-order immutability CONFIRMED (RULE-13-08).
      operationId: cancelPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already receiving or finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchase-orders/{id}/cancel-remaining:
    post:
      tags: [Orders]
      summary: 'NOT IMPLEMENTED — future task: Close short delivery (CancelRemainingPurchaseOrder)'
      description: NOT IMPLEMENTED — RULE-13-07 needs Inventory integration, deferred to a future task. Design kept PROPOSED for reference. From PARTIALLY_RECEIVED to CLOSED when the supplier cannot deliver the rest.
      operationId: cancelRemainingPurchaseOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not partially received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers:
    post:
      tags: [Suppliers]
      summary: Create supplier (ManageSupplier)
      description: CONFIRMED (RULE-13-04). Organization Admin only — organizationId is derived from actor.getOrganizationId(), same as POST /products.
      operationId: createSupplier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '201':
          description: Supplier created (ACTIVE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '400':
          description: Duplicate code within the Organization (CONFIRMED RULE-13-04, BUSINESS_RULE_VIOLATION).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organization Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Suppliers]
      summary: List suppliers
      operationId: listSuppliers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page of suppliers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organization Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{id}:
    patch:
      tags: [Suppliers]
      summary: Update supplier (ManageSupplier)
      description: Partial update — null fields keep their current value. status toggles ACTIVE/INACTIVE.
      operationId: updateSupplier
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequest'
      responses:
        '200':
          description: Supplier updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organization Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stale version (ConcurrencyConflictException).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Suppliers]
      summary: Get supplier
      operationId: getSupplier
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      responses:
        '200':
          description: Supplier detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organization Admin only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT/Session Token (RULE-01-01 CONFIRMED existence; Bearer transport ASSUMPTION A2 in auth-v1).
  parameters:
    StoreId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: CONFIRMED — plain Spring Pageable, 0-indexed (platform convention, matches the already-corrected Inventory contract).
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: CONFIRMED — plain Spring Pageable (platform convention).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "199000.00"
      description: Decimal string, 2 fractional digits, matching DB DECIMAL(12,2) (docs/06-erd.md) — sent/received as string to avoid IEEE-754 float rounding. Parse server-side as BigDecimal, not double.
    PurchaseRequestStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, CANCELLED]
      description: CONFIRMED (FSM-12, 04 glossary).
    PurchaseOrderStatus:
      type: string
      enum: [ISSUED, PARTIALLY_RECEIVED, RECEIVED, CLOSED, CANCELLED]
      description: CONFIRMED (FSM-13, 04 glossary). This scope slice only ever reaches ISSUED.
    SupplierStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: CONFIRMED (RULE-13-04, ERD supplier_status_enum).
    CreateSupplierRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 20
        contactEmail:
          type: string
          format: email
          maxLength: 100
        address:
          type: string
    UpdateSupplierRequest:
      type: object
      description: Partial update — omitted/null fields keep their current value.
      properties:
        name:
          type: string
          maxLength: 255
        contactPhone:
          type: string
          maxLength: 20
        contactEmail:
          type: string
          format: email
          maxLength: 100
        address:
          type: string
        status:
          $ref: '#/components/schemas/SupplierStatus'
    SupplierResponse:
      type: object
      required: [supplierId, organizationId, code, name, status]
      properties:
        supplierId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        contactPhone:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SupplierStatus'
    SupplierPage:
      type: object
      description: Platform PageResponse<SupplierResponse> envelope (CONFIRMED convention — every shipped module reuses this shape).
      required: [content, page, size, totalElements, totalPages, first, last]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/SupplierResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
    RequestLine:
      type: object
      required: [productId, requestedQuantity, estimatedUnitPrice]
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
          description: Response-only, enriched cross-module from Catalog.
        requestedQuantity:
          type: integer
          minimum: 1
        estimatedUnitPrice:
          $ref: '#/components/schemas/Money'
        recommendedSupplierName:
          type: string
          nullable: true
          description: Free-text advisory (RULE-13-01) — NOT a Supplier FK. The real Supplier is attached at CreatePurchaseOrder time.
    CreateRequestRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestLine'
      description: storeId comes from the path, not the body.
    PurchaseRequestResponse:
      type: object
      required: [requestId, requestNumber, storeId, status, createdBy, lines, createdAt]
      properties:
        requestId:
          type: string
          format: uuid
        requestNumber:
          type: string
        storeId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseRequestStatus'
        createdBy:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/RequestLine'
        createdAt:
          type: string
          format: date-time
        submittedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: CONFIRMED mandatory (RULE-13-02 — "REJECTED kèm lý do").
    OrderLine:
      type: object
      required: [productId, orderedQuantity, receivedQuantity, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
          description: Response-only, enriched cross-module from Catalog.
        orderedQuantity:
          type: integer
          minimum: 1
        receivedQuantity:
          type: integer
          description: Always 0 in this scope slice — ReceiveGoods (RULE-13-05..08) is not implemented yet.
        unitPrice:
          $ref: '#/components/schemas/Money'
    CreateOrderRequest:
      type: object
      required: [purchaseRequestId, supplierId]
      properties:
        purchaseRequestId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
          description: CONFIRMED — real Supplier FK (Q8 resolved), not free text.
      description: Lines are NOT accepted here — copied 1:1 from the approved PurchaseRequest (ASSUMPTION A5).
    PurchaseOrderResponse:
      type: object
      required: [orderId, poNumber, purchaseRequestId, storeId, supplierId, supplierName, status, totalAmount, createdBy, createdAt, lines]
      properties:
        orderId:
          type: string
          format: uuid
        poNumber:
          type: string
        purchaseRequestId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        supplierName:
          type: string
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        totalAmount:
          $ref: '#/components/schemas/Money'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    ReceiptLine:
      type: object
      required: [productId, receivedQuantity]
      properties:
        productId:
          type: string
          format: uuid
        receivedQuantity:
          type: integer
          minimum: 0
        batchNumber:
          type: string
        expiryDate:
          type: string
          format: date
    InspectLine:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 0
        reason:
          type: string
    InspectRequest:
      type: object
      properties:
        acceptedLines:
          type: array
          items:
            $ref: '#/components/schemas/InspectLine'
        rejectedLines:
          type: array
          items:
            $ref: '#/components/schemas/InspectLine'
        returnNote:
          type: string
      description: Shape PROPOSED (TBD Q10 in md).
    InspectResponse:
      type: object
      required: [receiptId, inspected]
      properties:
        receiptId:
          type: string
          format: uuid
          nullable: true
        inspected:
          type: boolean
    ReceiveRequest:
      type: object
      required: [receiptLines]
      properties:
        receiptLines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceiptLine'
    ReceiveResponse:
      type: object
      required: [receiptId, orderId, status]
      properties:
        receiptId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
    Error:
      type: object
      required: [success, errorCode, message, statusCode, timestamp]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          description: MAKER_CHECKER_VIOLATION is CONFIRMED (RULE-13-02, 400, BusinessRuleViolationException); ACCESS_DENIED_SCOPE_MISMATCH is CONFIRMED (RULE-02-01, 403); VALIDATION_FAILED, BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND follow docs/convention/backend/04-exception-handling.
        message:
          type: string
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
