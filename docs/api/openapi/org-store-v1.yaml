# Pet Care Org & Store API v1 — OpenAPI 3.1 (derived strictly from docs/)
#
# Source of truth: docs/01-business-operations.md (01#3),
# docs/02-business-rules.md (RULE-03-01..10), docs/03-state-machines.md (FSM-2 Store),
# docs/04-glossary.md (03), docs/05-domain-model.md (4.3),
# docs/06-erd.md (organizations/stores/operating_hours/store_resources/
# organization_policies/store_policies).
# Policy operations (ManageOrganizationPolicy, ConfigureStorePolicy) are RESOLVED
# (RULE-03-09, RULE-03-10) — see /organizations/{id}/policy and /stores/{id}/policy.
# Price/availability overrides belong to the Module 05 catalog contract (TBD Q8).
#
# Traceability legend: CONFIRMED = in docs (source cited) / ASSUMPTION (A#) =
# reasonable inference / TBD (Q#) = needs PO (see ../org-store-v1.md section E).
# No `servers` (base URL TBD Q1). Error envelope follows
# docs/convention/backend/04-exception-handling. No 422 (convention uses 400).

openapi: 3.1.0
info:
  title: Pet Care Org and Store API v1
  version: 1.0.0
  description: >-
    Strictly derived from docs/ (01#3 operations, RULE-03-01..10, FSM-2 Store
    lifecycle DRAFT->ACTIVE<->SUSPENDED/DEACTIVATED->ARCHIVED). Organization
    creation is SUPER_ADMIN tenant provisioning (ASSUMPTION A1). Activate needs
    hours plus resources plus service catalog (RULE-03-02, catalog check is a
    cross-domain dependency on Module 05). Archive needs the 4 zero-conditions
    (RULE-03-06). Policy endpoints (ManageOrganizationPolicy RULE-03-09,
    ConfigureStorePolicy RULE-03-10) are RESOLVED — dedicated organization_policies
    and store_policies tables, optimistic-locked GET/PATCH, lazy-create semantics.
tags:
  - name: Organizations
    description: Tenant lifecycle (CreateOrganization, UpdateOrganization).
  - name: Stores
    description: Store lifecycle and configuration (FSM-2, hours, resources).
  - name: Policies
    description: Organization-level and Store-level policy settings (RULE-03-09, RULE-03-10). No FSM — single current record per Organization/Store.
paths:
  /organizations:
    post:
      tags: [Organizations]
      summary: Create organization (CreateOrganization)
      description: "CONFIRMED (RULE-03-01). SUPER_ADMIN tenant provisioning (ASSUMPTION A1: 01#3 attribution to OrgAdmin cannot bootstrap)."
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non-SUPER_ADMIN (tenant lifecycle is PLATFORM scope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate organization code (ERD UNIQUE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Organizations]
      summary: List organizations (scope-filtered)
      description: Derived listing for tenant administration. Pagination PROPOSED (same TBD as iam-v1 Q7).
      operationId: listOrganizations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization detail
      description: Path/shape PROPOSED.
      operationId: getOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizations]
      summary: Update organization (UpdateOrganization)
      description: CONFIRMED (RULE-03-01). Updatable fields TBD Q9; code treated as immutable (PROPOSED).
      operationId: updateOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/{id}/policy:
    get:
      tags: [Policies]
      summary: Get current organization policy (ManageOrganizationPolicy)
      description: >-
        CONFIRMED (RULE-03-09). Returns the current organization_policies record, or the
        documented defaults (refundWindowDays=7, refundRequiresApproval=true,
        dataRetentionDays=730, securityFrameworkLevel=STANDARD, version=0) with
        updatedAt=null when never configured — never 404 for an existing Organization.
      operationId: getOrganizationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Current (or default) organization policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not SUPER_ADMIN or ORGANIZATION_ADMIN of this Organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01). STORE_MANAGER never allowed here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Policies]
      summary: Update organization policy (ManageOrganizationPolicy)
      description: >-
        CONFIRMED (RULE-03-09). Partial update; lazy-creates the organization_policies row on
        first write. Requires the current version for optimistic locking — mismatched or
        stale version (including a create-race on the UNIQUE(organization_id) constraint)
        returns 409 CONCURRENCY_CONFLICT.
      operationId: updateOrganizationPolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationPolicyRequest'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not SUPER_ADMIN or ORGANIZATION_ADMIN of this Organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01). STORE_MANAGER never allowed here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Concurrency conflict (optimistic lock, CONCURRENCY_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organizations/{id}/stores:
    post:
      tags: [Stores]
      summary: Create store as DRAFT (CreateStore)
      description: CONFIRMED (RULE-03-01/02, FSM-2). New stores start DRAFT and serve nothing until ActivateStore.
      operationId: createStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreRequest'
      responses:
        '201':
          description: Store created as DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate store code in organization (ERD UNIQUE organization_id plus code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Stores]
      summary: List stores of an organization
      description: Derived listing. Pagination PROPOSED.
      operationId: listStores
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of stores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /stores/{id}:
    get:
      tags: [Stores]
      summary: Get store detail
      description: Path/shape PROPOSED.
      operationId: getStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Stores]
      summary: Update store (UpdateStore)
      description: >-
        CONFIRMED (01#3). Same 3-field shape (name/address/phone) for OrgAdmin (any Store in own
        Org) and StoreManager (own Store only) — Q6 RESOLVED 2026-09-17, difference is Store scope
        (RULE-02-05), not field set. Rejected with 400 when the Store is ARCHIVED (RULE-03-06,
        extended 2026-09-17 — see docs/02-business-rules.md Decision Log §03).
      operationId: updateStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreRequest'
      responses:
        '200':
          description: Store updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          description: >-
            Validation failed, or Store is ARCHIVED (RULE-03-06 — Terminal State, immutable
            since 2026-09-17).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Concurrency conflict (optimistic lock, CONCURRENCY_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/activate:
    post:
      tags: [Stores]
      summary: Activate store (ActivateStore, implemented)
      description: >-
        CONFIRMED guards (RULE-03-02, FSM-2; implemented — see docs/api/org-store-v1.md
        Decision Log Q12). Only from DRAFT/SUSPENDED/DEACTIVATED. Needs valid operating
        hours, at least one active StoreResource, and at least one active Service in the
        Organization's catalog (Module 05 cross-domain, via ServiceCatalogService).
        Idempotent (already ACTIVE returns 200 no-op). On success, also initializes
        catalog overrides for the store and records a StoreActivated outbox event.
      operationId: activateStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store active (or already active, idempotent no-op).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '400':
          description: RULE-03-02 not satisfied (missing/invalid operating hours, no active resource, or no active service in catalog) — CONFIRMED code BUSINESS_RULE_VIOLATION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization, or actor is not OrganizationAdmin/SUPER_ADMIN (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Store status is not DRAFT/SUSPENDED/DEACTIVATED (e.g. ARCHIVED) — CONFIRMED code INVALID_STATE_TRANSITION; or concurrency conflict (CONCURRENCY_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/suspend:
    post:
      tags: [Stores]
      summary: Suspend store (SuspendStore)
      description: CONFIRMED (RULE-03-03/04, FSM-2). Only from ACTIVE. New bookings, walk-ins and orders are blocked by their owning modules. Idempotent.
      operationId: suspendStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store suspended (or already suspended).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wrong state for suspension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/deactivate:
    post:
      tags: [Stores]
      summary: Deactivate store (DeactivateStore)
      description: CONFIRMED (RULE-03-03/04, FSM-2). Only from ACTIVE. Idempotent.
      operationId: deactivateStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store deactivated (or already deactivated).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wrong state for deactivation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/archive:
    post:
      tags: [Stores]
      summary: Archive store permanently (ArchiveStore)
      description: CONFIRMED (RULE-03-06, FSM-2). Only from SUSPENDED or DEACTIVATED. All four zero-conditions are checked; the failing one is reported in details (PROPOSED shape).
      operationId: archiveStore
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Store archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside own organization (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Wrong state or an archival condition is unmet (details.failedCondition, PROPOSED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/operating-hours:
    put:
      tags: [Stores]
      summary: Configure operating hours (ConfigureOperatingHour)
      description: >-
        CONFIRMED (RULE-03-02/06/07). Replace-all semantics (RESOLVED 2026-09-18): deletes all
        existing rows for the Store and re-inserts exactly the given array; a day omitted from
        the request has no row after the call. dayOfWeek 1 means Sunday through 7 meaning
        Saturday (CONFIRMED per ERD, non-ISO). Authorization RESOLVED 2026-09-18 (Q5/Q10): only
        STORE_MANAGER for their own Store — no SUPER_ADMIN/ORGANIZATION_ADMIN exception. Rejected
        with 400 when the Store is ARCHIVED (RULE-03-06).
      operationId: configureOperatingHours
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatingHoursRequest'
      responses:
        '200':
          description: Hours replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingHoursResponse'
        '400':
          description: >-
            Validation failed (duplicate dayOfWeek, missing/contradictory openTime-closeTime),
            or Store is ARCHIVED (RULE-03-06).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not STORE_MANAGER of this Store (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH,
            RULE-02-01). SUPER_ADMIN/ORGANIZATION_ADMIN also get 403 here (RESOLVED 2026-09-18).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /stores/{id}/resources:
    get:
      tags: [Stores]
      summary: List store resources
      description: Derived listing over store_resources.
      operationId: listStoreResources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Resource list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResourceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Stores]
      summary: Configure store resource (ConfigureStoreResource)
      description: CONFIRMED (RULE-03-02/08). resourceCode is unique per store (ERD UNIQUE).
      operationId: createStoreResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreResourceRequest'
      responses:
        '201':
          description: Resource configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01). StoreManager configurability is TBD Q5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate resource code in store (ERD UNIQUE store_id plus resource_code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stores/{id}/resources/{rid}:
    patch:
      tags: [Stores]
      summary: Update store resource (ConfigureStoreResource)
      description: CONFIRMED (01#3). resourceCode is immutable (ASSUMPTION A4).
      operationId: updateStoreResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
        - name: rid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreResourceRequest'
      responses:
        '200':
          description: Resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /stores/{id}/policy:
    get:
      tags: [Policies]
      summary: Get current store policy (ConfigureStorePolicy)
      description: >-
        CONFIRMED (RULE-03-10). Returns the current store_policies record, or the documented
        defaults (surchargeEnabled=false, surchargeType=null, surchargeValue=null, version=0)
        with updatedAt=null when never configured — never 404 for an existing Store. Does not
        cover opening hours (see /stores/{id}/operating-hours) or staff shifts (out of scope,
        Module 08).
      operationId: getStorePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      responses:
        '200':
          description: Current (or default) store policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePolicyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Outside scope (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01). Allowed for STORE_MANAGER of this Store, ORGANIZATION_ADMIN of its Organization, and SUPER_ADMIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Policies]
      summary: Update store policy (ConfigureStorePolicy)
      description: >-
        CONFIRMED (RULE-03-10). Partial update; lazy-creates the store_policies row on first
        write. Requires the current version for optimistic locking — mismatched or stale
        version (including a create-race on the UNIQUE(store_id) constraint) returns 409
        CONCURRENCY_CONFLICT. Must not contradict OrganizationPolicy (RULE-03-03) — no
        overlapping fields exist today, kept as an invariant for future fields on either side.
        Authorization RESOLVED 2026-09-18: only STORE_MANAGER for their own Store — no
        SUPER_ADMIN/ORGANIZATION_ADMIN exception, same as ConfigureOperatingHour/
        ConfigureStoreResource (unlike the broader GET below). Rejected with 400 when the Store
        is ARCHIVED (RULE-03-06, extended 2026-09-18 to cover StorePolicy).
      operationId: updateStorePolicy
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStorePolicyRequest'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePolicyResponse'
        '400':
          description: Validation failed, business rule violated (RULE-03-10 surcharge fields), or Store is ARCHIVED (RULE-03-06).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not STORE_MANAGER of this Store (CONFIRMED code ACCESS_DENIED_SCOPE_MISMATCH, RULE-02-01). SUPER_ADMIN/ORGANIZATION_ADMIN also get 403 here (no exception for PATCH).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Concurrency conflict (optimistic lock, CONCURRENCY_CONFLICT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT/Session Token (RULE-01-01 CONFIRMED existence; Bearer transport ASSUMPTION A2 in auth-v1).
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoreId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OrganizationStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, INACTIVE]
      description: CONFIRMED values in ERD organizations; no FSM exists (TBD Q3).
    StoreStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUSPENDED, DEACTIVATED, ARCHIVED]
      description: CONFIRMED (FSM-2, 04 glossary StoreStatus).
    FacilityType:
      type: string
      enum: [RETAIL_STORE, CENTRAL_WAREHOUSE]
      description: CONFIRMED (ERD stores).
    ResourceType:
      type: string
      enum: [CLINIC_ROOM, GROOMING_TABLE, ULTRASOUND_MACHINE, XRAY_MACHINE]
      description: CONFIRMED (ERD store_resources plus 05 domain 4.3).
    SecurityFrameworkLevel:
      type: string
      enum: [STANDARD, ENHANCED, STRICT]
      description: CONFIRMED (RULE-03-09, ERD organization_policies).
    SurchargeType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]
      description: CONFIRMED (RULE-03-10, ERD store_policies).
    OrganizationResponse:
      type: object
      required: [organizationId, code, name, status]
      properties:
        organizationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/OrganizationStatus'
    OrganizationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateOrganizationRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        taxCode:
          type: string
        address:
          type: string
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        taxCode:
          type: string
        address:
          type: string
      description: Code is treated as immutable (PROPOSED, TBD Q4).
    OrganizationPolicyResponse:
      type: object
      required: [organizationId, refundWindowDays, refundRequiresApproval, dataRetentionDays, securityFrameworkLevel, version]
      properties:
        organizationId:
          type: string
          format: uuid
        refundWindowDays:
          type: integer
          description: CONFIRMED (RULE-03-09). Default 7 when never configured.
        refundRequiresApproval:
          type: boolean
          description: CONFIRMED (RULE-03-09). Default true when never configured.
        dataRetentionDays:
          type: integer
          description: CONFIRMED (RULE-03-09). Default 730 when never configured.
        securityFrameworkLevel:
          $ref: '#/components/schemas/SecurityFrameworkLevel'
        version:
          type: integer
          format: int64
          description: Optimistic lock token; 0 when never configured (default response).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when the policy has never been explicitly configured (default response).
    UpdateOrganizationPolicyRequest:
      type: object
      required: [version]
      properties:
        refundWindowDays:
          type: integer
        refundRequiresApproval:
          type: boolean
        dataRetentionDays:
          type: integer
        securityFrameworkLevel:
          $ref: '#/components/schemas/SecurityFrameworkLevel'
        version:
          type: integer
          format: int64
          description: >-
            Required. Must match the current version (0 if never configured) for the
            optimistic-lock check (RULE-03-09); mismatch returns 409 CONCURRENCY_CONFLICT.
      description: Partial update — omitted fields keep their current value.
    StoreResponse:
      type: object
      required: [storeId, organizationId, code, name, facilityType, status]
      properties:
        storeId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        facilityType:
          $ref: '#/components/schemas/FacilityType'
        address:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/StoreStatus'
    StorePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreResponse'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CreateStoreRequest:
      type: object
      required: [code, name, facilityType, address, phone]
      properties:
        code:
          type: string
        name:
          type: string
        facilityType:
          $ref: '#/components/schemas/FacilityType'
        address:
          type: string
        phone:
          type: string
    UpdateStoreRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
      description: >-
        Same shape for OrgAdmin and StoreManager (Q6 RESOLVED 2026-09-17) — actor difference is
        Store scope (RULE-02-05), not field set. All fields optional (partial update, null =
        unchanged); rejected with 400 if the target Store is ARCHIVED (RULE-03-06).
    OperatingHoursRequest:
      type: object
      required: [hours]
      properties:
        hours:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            required: [dayOfWeek, isClosed]
            properties:
              dayOfWeek:
                type: integer
                minimum: 1
                maximum: 7
                description: 1 means Sunday through 7 meaning Saturday (CONFIRMED per ERD, non-ISO).
              openTime:
                type: string
                format: time
              closeTime:
                type: string
                format: time
              isClosed:
                type: boolean
    OperatingHoursResponse:
      type: object
      required: [storeId, organizationId, hours]
      properties:
        storeId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Organization cha của Store (derived, read-only) — cần cho audit_logs.organization_id đúng theo resource bị tác động thay vì scope actor.
        hours:
          type: array
          items:
            type: object
            required: [dayOfWeek, isClosed]
            properties:
              dayOfWeek:
                type: integer
              openTime:
                type: string
                format: time
              closeTime:
                type: string
                format: time
              isClosed:
                type: boolean
    StoreResourceResponse:
      type: object
      required: [resourceId, storeId, resourceCode, resourceName, resourceType, isActive]
      properties:
        resourceId:
          type: string
          format: uuid
        storeId:
          type: string
          format: uuid
        resourceCode:
          type: string
        resourceName:
          type: string
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        isActive:
          type: boolean
    StoreResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StoreResourceResponse'
    CreateStoreResourceRequest:
      type: object
      required: [resourceCode, resourceName, resourceType]
      properties:
        resourceCode:
          type: string
        resourceName:
          type: string
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        isActive:
          type: boolean
          default: true
    UpdateStoreResourceRequest:
      type: object
      properties:
        resourceName:
          type: string
        isActive:
          type: boolean
      description: resourceCode is immutable (ASSUMPTION A4).
    StorePolicyResponse:
      type: object
      required: [storeId, organizationId, surchargeEnabled, version]
      properties:
        storeId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          description: Organization cha của Store (derived, read-only) — cần cho audit_logs.organization_id đúng theo resource bị tác động thay vì scope actor.
        surchargeEnabled:
          type: boolean
          description: CONFIRMED (RULE-03-10). Default false when never configured.
        surchargeType:
          allOf:
            - $ref: '#/components/schemas/SurchargeType'
          nullable: true
          description: Null when surchargeEnabled is false.
        surchargeValue:
          type: number
          nullable: true
          description: Backed by BigDecimal (precision 12, scale 2). Null when surchargeEnabled is false; 0-100 when surchargeType is PERCENTAGE.
        version:
          type: integer
          format: int64
          description: Optimistic lock token; 0 when never configured (default response).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when the policy has never been explicitly configured (default response).
    UpdateStorePolicyRequest:
      type: object
      required: [version]
      properties:
        surchargeEnabled:
          type: boolean
        surchargeType:
          allOf:
            - $ref: '#/components/schemas/SurchargeType'
          nullable: true
        surchargeValue:
          type: number
          nullable: true
          description: Backed by BigDecimal (precision 12, scale 2).
        version:
          type: integer
          format: int64
          description: >-
            Required. Must match the current version (0 if never configured) for the
            optimistic-lock check (RULE-03-10); mismatch returns 409 CONCURRENCY_CONFLICT.
      description: >-
        Partial update — omitted fields keep their current value. surchargeType and
        surchargeValue are required when surchargeEnabled is set to true (RULE-03-10).
    Error:
      type: object
      required: [success, errorCode, message, statusCode, timestamp]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          description: ACCESS_DENIED_SCOPE_MISMATCH is CONFIRMED (RULE-02-01, 403); VALIDATION_FAILED, BUSINESS_RULE_VIOLATION, INVALID_STATE_TRANSITION, RESOURCE_NOT_FOUND follow docs/convention/backend/04-exception-handling; STORE_NOT_READY and archival failedCondition details are PROPOSED.
        message:
          type: string
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
