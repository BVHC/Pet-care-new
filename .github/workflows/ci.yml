name: CI/CD Pipeline

# docs/adr/0121 (trả D060). Pull request vào dev chạy kiểm nhanh: conflict marker, compile, unit test, FE.
# integration-tests (mvn verify toàn bộ) chỉ chạy khi push vào main hoặc chạy tay (workflow_dispatch).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Backend CI
  # ===========================================
  backend-ci:
    name: Backend CI (Maven)
    runs-on: ubuntu-latest

    # Test dùng Testcontainers (pgvector/pgvector:pg17) nên không cần service Postgres; Docker có sẵn trên runner.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Rebase / merge đã commit nhầm conflict marker sáu lần (CLAUDE.md, Gotchas).
      - name: Check for conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>) '; then
            echo '::error::Còn conflict marker trong repo'
            exit 1
          fi

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: cd BE && mvn clean compile -DskipTests

      - name: Run Backend Tests
        run: cd BE && mvn test

  # ===========================================
  # Frontend CI
  # ===========================================
  frontend-ci:
    name: Frontend CI (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck || npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint || true

      - name: Build Frontend
        run: npm run build

  # ===========================================
  # Integration Tests (chỉ main / chạy tay, docs/adr/0121)
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Build Backend
        run: cd BE && mvn package -DskipTests

      - name: Run Backend Tests
        run: cd BE && mvn verify

      - name: Install FE dependencies
        run: cd FE && npm ci

      - name: Build FE
        run: cd FE && npm run build

  # ===========================================
  # Deploy to Staging (on dev branch; chỗ giữ chỗ, chưa có lệnh triển khai)
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add deployment commands here
          # e.g., docker-compose up -d

  # ===========================================
  # Deploy to Production (on main branch)
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add deployment commands here
          # e.g., kubectl apply -f k8s/
