name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # Backend CI
  # ===========================================
  backend-ci:
    name: Backend CI (Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: cd BE && mvn clean compile -DskipTests

      - name: Run Flyway Migration
        run: cd BE && mvn flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/petcare_test -Dflyway.user=postgres -Dflyway.password=postgres

      - name: Run Backend Tests
        run: cd BE && mvn test -Dflyway.url=jdbc:postgresql://localhost:5432/petcare_test -Dflyway.user=postgres -Dflyway.password=postgres

  # ===========================================
  # Frontend CI
  # ===========================================
  frontend-ci:
    name: Frontend CI (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: FE

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck || npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint || true

      - name: Build Frontend
        run: npm run build

  # ===========================================
  # Integration Tests
  # ===========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: FE/package-lock.json

      - name: Build Backend
        run: cd BE && mvn package -DskipTests

      - name: Run Backend Tests
        run: cd BE && mvn verify -Dflyway.url=jdbc:postgresql://localhost:5432/petcare_test -Dflyway.user=postgres -Dflyway.password=postgres

      - name: Install FE dependencies
        run: cd FE && npm ci

      - name: Build FE
        run: cd FE && npm run build

  # ===========================================
  # Deploy to Staging (on develop branch)
  # ===========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add deployment commands here
          # e.g., docker-compose up -d

  # ===========================================
  # Deploy to Production (on main branch)
  # ===========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add deployment commands here
          # e.g., kubectl apply -f k8s/
