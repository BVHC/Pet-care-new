# Datasource nạp sẵn khi Grafana khởi động (docs/adr/0155). uid cố định: mọi dashboard trong ../../dashboards trỏ "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
