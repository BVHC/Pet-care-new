# ===========================================
# Pet-care Docker Compose
# ===========================================

version: '3.8'

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:17
    container_name: petcare-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: petcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Backend API
  # ===========================================
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: petcare-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: petcare
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-petcare-256-bit-secret-key-for-jwt-signing-min-32-chars}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # Frontend Web
  # ===========================================
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: petcare-web
    ports:
      - "3000:80"
    depends_on:
      - backend

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
  redis_data:

# ===========================================
# Networks
# ===========================================
networks:
  default:
    name: petcare-network
