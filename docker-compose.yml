# ===========================================
# Pet-care Docker Compose
# ===========================================

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:17
    container_name: petcare-postgres
    environment:
      # Chỉ có hiệu lực khi volume postgres_data được tạo mới
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-petcare}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # Mailpit — SMTP giả cho dev (docs/adr/0012)
  # ===========================================
  # Nhận mọi email worker ST20 gửi, xem ở http://localhost:8025. Dùng SMTP thật thì đặt MAIL_* trong .env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: petcare-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # ===========================================
  # Backend API
  # ===========================================
  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile
    container_name: petcare-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-petcare}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Không có mặc định (application-docker.yml cũng vậy): thiếu thì compose dừng ngay.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chưa đặt - sao chép .env.example thành .env}
      # SMTP của worker ST20 (docs/adr/0012). Mặc định Mailpit; Gmail / nhà cung cấp thật: đặt MAIL_* trong .env.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@petcare.local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Lịch job dọn phiên (docs/adr/0008); mặc định trùng application.yml.
      APP_JOBS_SESSION_CLEANUP_CRON: ${SESSION_CLEANUP_CRON:-0 0 3 * * *}
      # Lịch ST02 dọn tài khoản PENDING quá hạn (docs/adr/0013); mặc định trùng application.yml.
      PENDING_ACCOUNT_CLEANUP_CRON: ${PENDING_ACCOUNT_CLEANUP_CRON:-0 */15 * * * *}
      # Lịch ba luồng ST20: email HIGH, NORMAL (docs/adr/0012), IN_APP (docs/adr/0014); mặc định trùng application.yml.
      NOTIFICATION_OUTBOX_CRON: ${NOTIFICATION_OUTBOX_CRON:-*/10 * * * * *}
      NOTIFICATION_OUTBOX_PRIORITY_CRON: ${NOTIFICATION_OUTBOX_PRIORITY_CRON:-*/5 * * * * *}
      NOTIFICATION_IN_APP_CRON: ${NOTIFICATION_IN_APP_CRON:-*/5 * * * * *}
      # Lịch dọn notification_outbox đã xử lý (docs/adr/0016); mặc định trùng application.yml.
      NOTIFICATION_OUTBOX_CLEANUP_CRON: ${NOTIFICATION_OUTBOX_CLEANUP_CRON:-0 40 3 * * *}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # Frontend Web
  # ===========================================
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: petcare-web
    ports:
      - "3000:80"
    depends_on:
      - backend

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
  redis_data:

# ===========================================
# Networks
# ===========================================
networks:
  default:
    name: petcare-network
