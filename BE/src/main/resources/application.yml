spring:
  application:
    name: petcare-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petcare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # TIMESTAMPTZ đọc/ghi theo UTC, không phụ thuộc timezone JVM (platform/config/TimeConfig).
        jdbc:
          time_zone: UTC

  # Flyway sở hữu schema (db/migration/V{n}__*.sql). Không bật baseline-on-migrate:
  # DB đã có bảng mà chưa có lịch sử Flyway phải báo lỗi, không được âm thầm bỏ qua V1.
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms

  # Gmail SMTP. Chưa có code gửi mail; cấu hình giữ cho worker gửi notification_outbox (ST20).
  # MAIL_PASSWORD phải là Gmail App Password (bật 2FA), không dùng mật khẩu Gmail thật.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# Khóa HS256 ký access token (platform/security/JwtProperties, docs/adr/0003), tối thiểu 32 byte.
# Hạn phiên không cấu hình ở đây mà là tham số [CFG] session.ttl_hours; không có refresh token.
jwt:
  secret: ${JWT_SECRET:petcare-256-bit-secret-key-for-jwt-signing-min-32-chars}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Job định kỳ (docs/adr/0007): cron 6 trường theo giờ Việt Nam, "-" để tắt.
  jobs:
    # Xóa phiên đăng nhập hết hạn quá retention-days ngày (docs/adr/0008). Docker đổi lịch bằng SESSION_CLEANUP_CRON.
    session-cleanup:
      cron: "0 0 3 * * *"
      retention-days: 30
      batch-size: 1000

server:
  port: ${SERVER_PORT:8081}
  # Sau nginx (FE/nginx.conf đặt X-Forwarded-For): Tomcat RemoteIpValve chỉ tin header từ proxy thuộc dải nội bộ,
  # nên request.getRemoteAddr() là IP client thật — audit_logs.ip_address dùng giá trị này (docs/adr/0002).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Chưa có code gửi mail và MAIL_USERNAME/MAIL_PASSWORD mặc định trống: mail health indicator
    # luôn DOWN, kéo /actuator/health xuống 503 và healthcheck Docker báo unhealthy.
    # Bật lại khi có worker gửi notification_outbox (ST20).
    mail:
      enabled: false
