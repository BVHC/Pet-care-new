spring:
  application:
    name: petcare-api

  datasource:
    url: jdbc:postgresql://localhost:5432/petcare
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms

jwt:
  secret: ${JWT_SECRET:petcare-256-bit-secret-key-for-jwt-signing-min-32-chars}
  access-token-ttl-min: 15
  refresh-token-ttl-days: 30

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    blacklist-fail-open: true
  refresh-token-cleanup:
    enabled: true
    cron: "0 30 2 * * *"
    retention-days-default: 7
    retention-days-extended: 30
    batch-size: 500
    max-batches-per-run: 200
    known-security-reasons: LOGOUT,LOCK_ACCOUNT,DEACTIVATE_ACCOUNT

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
