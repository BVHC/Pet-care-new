# ===========================================
# Spring Boot Docker Profile — chỉ ghi phần khác application.yml
# ===========================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:petcare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Không có giá trị mặc định: container bắt buộc nhận JWT_SECRET (docker-compose truyền vào).
jwt:
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: 8080

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.petcare: DEBUG
    org.springframework.web: INFO
