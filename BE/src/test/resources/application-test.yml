# Profile test. DataSource do Testcontainers cấp (com.petcare.TestcontainersConfiguration,
# @ServiceConnection, postgres:17): mỗi lần chạy là một DB sạch, Flyway áp migration thật,
# Hibernate ddl-auto=validate kế thừa từ application.yml. Cần Docker đang chạy.
spring:
  application:
    name: petcare-api-test

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms

  # SMTP giả: test không bao giờ gửi mail thật. Cổng 3025 = GreenMail (ServerSetupTest.SMTP) mà
  # NotificationOutboxIT dựng; test khác không gửi mail. Timeout ngắn cho case SMTP treo.
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-app-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

jwt:
  secret: test-secret-key-for-jwt-signing-minimum-32-characters-long

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  # Không job nào tự chạy trong test (docs/adr/0007); IT gọi job trực tiếp.
  jobs:
    session-cleanup:
      cron: "-"
    pending-account-cleanup:
      cron: "-"
    notification-outbox:
      cron: "-"
      priority-cron: "-"
      in-app-cron: "-"
    notification-outbox-cleanup:
      cron: "-"

# Mail health indicator tắt: test không có SMTP chạy thường trực (GreenMail chỉ bật trong NotificationOutboxIT).
management:
  health:
    mail:
      enabled: false
