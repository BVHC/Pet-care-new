# Profile test. DataSource do Testcontainers cấp (com.petcare.TestcontainersConfiguration,
# @ServiceConnection, postgres:17): mỗi lần chạy là một DB sạch, Flyway áp migration thật,
# Hibernate ddl-auto=validate kế thừa từ application.yml. Cần Docker đang chạy.
spring:
  application:
    name: petcare-api-test

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms

  # SMTP giả: test không bao giờ gửi mail thật.
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-app-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: test-secret-key-for-jwt-signing-minimum-32-characters-long
  access-token-ttl-min: 15
  refresh-token-ttl-days: 30

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

# management.health.mail.enabled=false kế thừa từ application.yml.
