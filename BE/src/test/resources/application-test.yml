spring:
  application:
    name: petcare-api-test

  datasource:
    url: jdbc:postgresql://localhost:5432/petcare_test
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms

  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-app-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: test-secret-key-for-jwt-signing-minimum-32-characters-long
  access-token-ttl-min: 15
  refresh-token-ttl-days: 30

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  security:
    blacklist-fail-open: true
  refresh-token-cleanup:
    enabled: false
  otp-expiry:
    enabled: false
  caregiver:
    invitation-ttl-days: 7
  caregiver-expiry:
    enabled: false

server:
  port: 8081

management:
  health:
    # Test khong co SMTP server that (spring.mail.host tro vao localhost:3025),
    # nen mail health indicator luon DOWN va keo /actuator/health xuong 503 —
    # lam TraceIdCorsTest (mong doi 200) fail. Health cua mail khong nam trong
    # pham vi test traceId/CORS.
    mail:
      enabled: false
